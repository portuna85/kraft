# 푸시·PR마다 테스트와 실행용 JAR 빌드를 검증한다.
#
# 개선 보고서의 "배포 자동화" 공백에 대한 최소 대응이다. 대부분의 테스트는 test 프로파일
# (H2 인메모리)로 돌기 때문에 .env가 필요 없다(build.gradle.kts의 Test 태스크 참고).
#
# MariaDbMigrationTest만 Testcontainers로 실제 MariaDB를 띄워 V1~V6 마이그레이션과
# ddl-auto: validate를 검증한다. ubuntu-latest에는 Docker가 있으므로 여기서는 항상 실행된다
# (Docker가 없는 환경에서는 그 클래스만 자동으로 건너뛴다).
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build jar
        run: ./gradlew test bootJar --no-daemon --console=plain

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 확인할 수 있도록 리포트를 남긴다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 브라우저 검증은 별도 잡으로 둔다. 위 test 잡은 Node도 Docker도 없이 도는 것이
  # 계약이므로(그 잡의 주석 참고) 거기에 npm을 섞지 않는다. 실패 원인도 구분된다.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Playwright가 이 JAR을 e2e 프로파일(H2 인메모리)로 직접 띄운다.
      - name: Build jar
        run: ./gradlew bootJar --no-daemon --console=plain

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # 실패했을 때 trace로 클릭 단위 재생이 가능하다.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
