# 푸시·PR마다 테스트와 실행용 JAR 빌드를 검증한다.
#
# 개선 보고서의 "배포 자동화" 공백에 대한 최소 대응이다. 대부분의 테스트는 test 프로파일
# (H2 인메모리)로 돌기 때문에 .env가 필요 없다(build.gradle.kts의 Test 태스크 참고).
#
# MariaDB 마이그레이션·기존 DB 전환·백업 복구 테스트는 Testcontainers를 사용한다.
# ubuntu-latest에는 Docker가 있으므로 세 테스트 클래스도 실행된다.
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build jar
        run: ./gradlew test bootJar --no-daemon --console=plain

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 확인할 수 있도록 리포트를 남긴다.
      # 커버리지 리포트도 함께 올린다(test가 끝나면 자동으로 만들어진다). 문턱값은 두지
      # 않았으므로 이 잡은 커버리지 때문에 실패하지 않는다 — 들여다볼 자료로만 남긴다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

  # 브라우저 검증은 Node.js가 필요한 별도 잡에서 수행한다.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # E2E 시드·메일 기록기·H2를 포함하는 전용 JAR. 운영 bootJar와 분리한다.
      - name: Build E2E jar
        run: ./gradlew bootE2eJar --no-daemon --console=plain

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ESLint + tsc(jsconfig). tsc는 타입 검사가 아니라 IDE가 쓰는 타입 설정이 실제로
      # 해석되는지 확인하는 용도다 — bootstrap 전역 선언이 깨지면 여기서 드러난다.
      - name: Lint and typecheck
        run: npm run lint

      # 커밋된 bootstrap.custom.css가 SCSS 소스와 일치하는지 본다. 소스만 고치고 다시
      # 빌드하지 않으면 화면과 저장소가 어긋나므로, 여기서 잡는다.
      - name: Check generated CSS is up to date
        run: npm run check:css

      - name: Check generated Vue is up to date
        run: npm run check:vue

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # 실패했을 때 trace로 클릭 단위 재생이 가능하다.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
