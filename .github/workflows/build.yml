# 푸시·PR마다 테스트와 실행용 JAR 빌드를 검증한다.
#
# 개선 보고서의 "배포 자동화" 공백에 대한 최소 대응이다. 테스트는 test 프로파일(H2 인메모리)로
# 돌기 때문에 Docker MariaDB나 .env가 필요 없다(build.gradle.kts의 Test 태스크 참고).
# 실제 MariaDB + Flyway 기동 검증은 아직 여기 포함되지 않는다.
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build jar
        run: ./gradlew test bootJar --no-daemon --console=plain

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 확인할 수 있도록 리포트를 남긴다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
