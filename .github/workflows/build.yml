# 푸시마다 테스트와 실행용 JAR 빌드를 검증하고, main 푸시가 전부 통과하면 운영에 배포한다.
#
# 대부분의 테스트는 test 프로파일(H2 인메모리)로 돌아 .env가 필요 없다(build.gradle.kts의 Test 태스크). MariaDB 마이그레이션·기존 DB 전환·백업 복구·
# 추천 이력 테스트는 Testcontainers를 쓰며 ubuntu-latest에는 Docker가 있어 실행된다 — Docker가 조용히 빠지는 회귀는 "Verify Docker-gated tests actually ran"이 잡는다.
#
# deploy 잡은 test 잡이 만든 jar를 다시 빌드하지 않고 그대로 서버로 보낸다(테스트한 바이트와 운영에 올라가는 바이트를 같게). 서버 준비 방법은 deploy/deploy-apply.sh 주석 참고.
name: build

on:
  # 이 저장소는 PR을 만들지 않는 1인 개발이라 pull_request 트리거는 두지 않는다(push와 겹쳐 같은 커밋이 두 번 도는 것도 없앤다).
  push:
    branches: ['**']
    # 문서만 바뀐 푸시가 운영을 재시작하지 않게 한다(main 푸시는 곧 배포). 코드와 문서가 함께 바뀐 커밋은 평소대로 돈다.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# 이 workflow가 쓰는 권한만 남긴다 — 어떤 잡도 GITHUB_TOKEN으로 쓰지 않으므로 read면 충분하다.
permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 뒤 커밋이 앞 실행을 대신한다. main은 취소하지 않는다 — deploy가 이미 시작됐을 수 있고, main 커밋마다 결과를 남겨야 배포 이력과 맞춰 볼 수 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 얕은 클론이다. "Guard migration files"가 이번 푸시 이전 커밋(github.event.before) 하나만 따로 받아 트리 diff를 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/*.sh는 러너가 아니라 운영 서버에 수동 설치된 채로 돈다(deploy 잡은 jar를 올리고 서버에서 트리거만 한다). 그래서 실행이 아니라 문법·흔한 실수만
      # 정적으로 잡는다. -S warning: 파일명이 전부 스크립트가 만든 타임스탬프라 info 수준(SC2012, ls 대신 find)은 해당하지 않는다.
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning deploy/*.sh

      # 마이그레이션 규칙(확장→배포→수축).
      # 1) 이미 있던 V*.sql을 수정·삭제·이름 변경하면 실패시킨다 — Flyway가 적용된 파일의 체크섬을 기록하므로 고치면 운영 기동이 실패한다. 새 버전 파일을 추가한다.
      # 2) 새로 추가된 V*.sql의 위반 후보는 경고만 남긴다(되돌릴 이유가 없는 보안 수정처럼 의도된 경우가 있다). 이번 푸시에서 새로 추가된 파일만 본다.
      - name: Guard migration files
        run: |
          base="${{ github.event.before }}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            # 이전 커밋 하나만 받는다. force-push로 사라진 커밋이면 실패하고 아래에서 건너뛴다.
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # 새 브랜치 첫 푸시이거나 force-push로 이전 커밋이 사라진 경우 — 조용히 통과하지 않고 건너뛰었음을 남긴다.
            echo "::warning::비교할 이전 커밋이 없어 마이그레이션 가드를 건너뜁니다(새 브랜치 첫 푸시·force-push 등)."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- 'src/main/resources/db/migration/V*.sql')
          if [ -n "$changed" ]; then
            for f in $changed; do
              echo "::error file=$f::이미 있는 마이그레이션을 수정·삭제·이름 변경했습니다 — 체크섬이 달라져 운영 기동이 실패합니다. 새 버전 파일을 추가하세요."
            done
            exit 1
          fi
          new_files=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'src/main/resources/db/migration/V*.sql')
          for f in $new_files; do
            if grep -iE 'drop[[:space:]]+(column|table|index)|rename[[:space:]]+(column|table)|change[[:space:]]+column|modify[[:space:]]+column|truncate' "$f" > /dev/null; then
              echo "::warning file=$f::파괴적 DDL이 있습니다 — 확장→배포→수축 규칙을 지켰는지 확인하세요."
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # 후처리의 캐시 정리가 별도 Gradle/JVM을 띄워 약 25초를 쓴다 — 캐시 저장·복원은 유지하고 매 push의 추가 정리만 생략한다.
          cache-cleanup: never

      # Docker(Testcontainers) 테스트는 docker-tests 잡이 병렬로 돈다(같은 JVM에서 순차로 돌리면 배포 전 크리티컬 패스가 늘어난다). Java 포맷 게이트:
      # 미사용 import·줄 끝 공백·파일 끝 줄바꿈만 본다(규칙은 build.gradle.kts의 spotless 블록). 실패하면 로컬에서 `./gradlew spotlessApply`.
      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon --console=plain

      - name: Test and build jar
        run: ./gradlew test bootJar -PdockerTests=exclude --no-daemon --console=plain

      # 실패했을 때 원인을 볼 리포트와, 테스트 JVM의 애플리케이션 로그(build/test-logs — 서버 쪽 예외 스택은 여기에만 있다)를 남긴다. 커버리지 리포트도 올리지만 문턱값은 없다.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs
          path: build/test-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

      # deploy 잡이 이 jar를 그대로 쓴다 — 테스트와 같은 태스크 실행으로 만든 바로 그 파일이어야 "테스트한 것"과 "배포한 것"이 같다. main 푸시에서만 만든다.
      - name: Upload production jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-jar
          path: build/libs/kraft.jar
          # JAR는 이미 ZIP 압축되어 있어 다시 압축할 필요가 없다.
          compression-level: 0
          retention-days: 30

  # Docker(Testcontainers) 테스트만 따로 돈다 — test 잡과 병렬이라 느린 쪽이 크리티컬 패스다. deploy는 이 잡도 통과해야 한다.
  docker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-cleanup: never

      - name: Docker tests
        run: ./gradlew test -PdockerTests=only --no-daemon --console=plain

      # Docker가 없으면 @Testcontainers(disabledWithoutDocker) 클래스가 실패가 아니라 전부 skipped로 조용히 통과한다. 각 클래스의 JUnit XML에서 skipped가
      # 전체와 같은지(=한 건도 실행되지 않음) 확인해 잡는다.
      - name: Verify Docker-gated tests actually ran
        run: |
          # 목록을 소스에서 직접 찾아 Docker 테스트를 추가해도 따라가게 한다(기반 클래스 MariaDbIntegrationTest는 테스트가 없어 제외).
          classes=$(grep -rlE '@Tag\("docker"\)|extends MariaDbIntegrationTest' src/test/java --include='*.java' \
            | grep -v '/support/MariaDbIntegrationTest.java' \
            | sed 's#src/test/java/##; s#\.java$##; s#/#.#g')
          failed=0
          for cls in $classes; do
            file="build/test-results/test/TEST-${cls}.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$file 이 없습니다 — $cls 결과가 전혀 수집되지 않았다"
              failed=1
              continue
            fi
            tests=$(grep -o 'tests="[0-9]*"' "$file" | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' "$file" | head -1 | grep -o '[0-9]*')
            if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then
              echo "::error::$cls 에 테스트 케이스가 0건이다"
              failed=1
            elif [ "$skipped" = "$tests" ]; then
              echo "::error::$cls 의 테스트 ${tests}건이 전부 skipped다 — Docker가 없어 조용히 건너뛰었을 수 있다"
              failed=1
            else
              echo "$cls: ${tests}건 중 ${skipped}건 skip — 실제로 실행됨"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      - name: Upload docker test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-test-logs
          path: build/test-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload docker test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-test-report
          path: build/reports/tests/test
          retention-days: 7

  # 의존성 그래프는 저장소의 Automatic Dependency Submission (Gradle)이 제출한다(별도 잡은 중복이다).

  # 정적 검사만 모아 Node 전용으로 돈다(JDK·Gradle 없이 e2e보다 빨리 끝난다). deploy는 이 잡도 통과해야 한다.
  frontend-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # ESLint + tsc(jsconfig) + vue-tsc. tsc는 IDE 타입 설정이 실제로 해석되는지(bootstrap 전역 선언), vue-tsc는 .vue 템플릿·props·서버 DTO(src/vue/shared/types.js) 계약을 본다.
      - name: Lint and typecheck
        run: npm run lint

      # 브라우저 없이 도는 순수 함수 단위 테스트(node --test) — 여러 동작이 겹치는 조합을 E2E보다 싸게 검사한다.
      - name: Unit tests
        run: npm run test:unit

      # 커밋된 생성물(bootstrap.custom.css)이 SCSS 소스와 일치하는지 — 소스만 고치고 다시 빌드하지 않은 경우를 잡는다.
      - name: Check generated CSS is up to date
        run: npm run check:css

      - name: Check generated Vue is up to date
        run: npm run check:vue

      # 템플릿의 modulepreload가 진입 스크립트가 의존하는 청크를 빠짐없이 가리키는지 — 잘못돼도 검사 명령은 계속 성공하므로 CI에 연결해 둔다.
      - name: Check modulepreload references
        run: npm run check:preload

      # high/critical이 나오면 경고와 요약만 남기고 배포는 막지 않는다 — 새 권고에 따라 코드와 무관하게 결과가 바뀌어, 게이트로 두면 관련 없는 푸시의 배포가 멈춘다.
      - name: Audit npm dependencies
        continue-on-error: true
        run: |
          if ! npm run audit:check > audit.txt 2>&1; then
            {
              echo '### npm audit: high 이상의 취약점이 있습니다 (배포는 막지 않음)'
              echo '```'
              cat audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::npm audit에서 high 이상의 취약점이 나왔습니다. 실행 요약을 확인하세요."
            exit 1
          fi

  # E2E JAR는 한 번만 빌드해 모든 shard가 내려받는다(백엔드 테스트와 독립적으로 시작).
  e2e-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read locked Playwright version
        id: playwright-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          with open("package-lock.json", encoding="utf-8") as lockfile:
              packages = json.load(lockfile)["packages"]
          version = packages["node_modules/playwright-core"]["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Use a released Playwright Docker image"
          assert packages["node_modules/@playwright/test"]["version"] == version
          print(f"version={version}")
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # test 잡이 공통 의존성·컴파일 캐시를 저장한다. E2E 시작 전 중복 저장을 피한다.
          cache-read-only: true

      - name: Build E2E jar
        run: ./gradlew bootE2eJar --no-daemon --console=plain

      - name: Upload E2E jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-jar
          path: build/libs/kraft-e2e.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e:
    needs: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 브라우저·OS 라이브러리가 든 공식 이미지(매번 apt 설치하는 비용 제거). lockfile과 버전을 맞춰 실행 파일을 못 찾는 오류를 막는다.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright-version }}-noble
      options: --init --ipc=host
    # 각 러너가 별도 서버·H2·로그인 상태를 쓴다. 러너 안에서는 workers=1로 순서를 유지하고 파일 단위로 분할해 계정 변경·공유 DB 테스트의 충돌을 막는다.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Download E2E jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-jar
          path: build/libs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run E2E
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # retries: 1로 두 번째에 통과한 테스트(flaky)는 실패시키지 않고 요약에 적는다(컨테이너에 jq가 없어 node 스크립트로 읽는다).
      - name: Report flaky tests
        if: ${{ !cancelled() && hashFiles('playwright-results.json') != '' }}
        run: node scripts/report-flaky.mjs "${{ matrix.shard }}"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

      # 실패했을 때 trace로 클릭 단위 재생이 가능하다.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # 시각 회귀. 기준선은 같은 Playwright 이미지(Linux)에서 만든 -chromium-linux.png이고, 일반 e2e 샤드는 이 스펙을 건너뛴다(CI=1). 배포 게이트다 —
  # 화면을 일부러 바꿨다면 `npm run visual:update`로 기준선을 다시 만들어 함께 커밋한다. 실패하면 playwright-visual-diff 아티팩트에서 기대·실제·차이를 본다.
  visual:
    needs: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright-version }}-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Download E2E jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-jar
          path: build/libs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run visual regression
        env:
          VISUAL: '1'
        run: npx playwright test --project=chromium visual

      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual-diff
          path: test-results
          retention-days: 7

  # main 푸시가 test·docker-tests·frontend-checks·e2e·visual을 모두 통과했을 때만 운영에 배포한다(다른 브랜치에서는 돌지 않는다). 서드파티 SSH 액션은
  # 쓰지 않는다 — 공개 저장소에서 배포 개인키를 외부 액션에 넘기는 것은 공급망 위험이고 필요한 것은 ssh 한 줄뿐이다. 아무것도 빌드하지 않고 test 잡의 jar를 옮길 뿐이다.
  deploy:
    runs-on: ubuntu-24.04
    needs: [test, docker-tests, frontend-checks, e2e, visual]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 이 잡 전체의 상한 — SSH·curl 개별 타임아웃으로 못 잡는 무응답(방화벽이 SYN을 버리는 경우)이 deploy-production 그룹을 영영 막지 않게 한다.
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://kraft.io.kr
    steps:
      # main이 이 실행이 시작된 뒤 앞서 갔으면(force-push, 또 다른 푸시) 낡은 커밋을 배포하지 않고 건너뛴다 — 뒤이은 푸시의 워크플로가 최신을 배포한다.
      - name: Verify main hasn't moved since this run started
        run: |
          latest=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "::notice::main이 이미 $latest 로 앞서 있습니다(이 실행은 ${{ github.sha }}). 배포를 건너뜁니다."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Download production jar
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-jar

      # 배포 키는 서버 authorized_keys에 forced command(/opt/kraft/deploy-apply.sh)로 등록돼 있어 셸도 다른 명령도 얻지 못한다. 아래 ssh에 넘기는 커밋 SHA는
      # 실행되지 않고 SSH_ORIGINAL_COMMAND로 전달돼 로그에만 남는다.
      - name: Configure SSH
        if: env.SKIP_DEPLOY != '1'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy jar to server
        if: env.SKIP_DEPLOY != '1'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          # "<커밋 SHA>-<jar의 SHA-256>"을 보낸다. 서버의 deploy-apply.sh가 받은 jar와 대조한다.
          jar_sha256=$(sha256sum kraft.jar | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "${{ github.sha }}-${jar_sha256}" \
            < kraft.jar

      # 서버 안(localhost)에서는 deploy-apply.sh가 이미 헬스체크를 했다. 여기서는 바깥에서 도메인이 응답하는지(nginx·TLS·DNS 포함) 본다. --connect-timeout·--max-time이
      # 없으면 DNS·TLS 무응답에 잡 전체 timeout까지 멈추고, --retry로 막 올라오는 순간의 미응답은 실패로 잡지 않는다.
      - name: Smoke test
        if: env.SKIP_DEPLOY != '1'
        run: |
          curl -fsS -o /dev/null --connect-timeout 5 --max-time 15 \
            --retry 5 --retry-delay 3 --retry-all-errors https://kraft.io.kr/recommend

      # 스모크 테스트는 "도메인이 응답한다"만 봐서 옛 jar가 계속 떠 있어도 통과한다. /healthz의 X-Kraft-Build(짧은 git SHA)가 방금 푸시한 커밋의 앞부분인지 확인한다
      # (재시작 직후 잠깐 이전 jar가 응답할 수 있어 여러 번 본다. 롤백되면 헤더가 달라 실패로 드러난다).
      - name: Verify deployed build
        if: env.SKIP_DEPLOY != '1'
        run: |
          expected="${{ github.sha }}"
          for attempt in $(seq 1 10); do
            actual=$(curl -sS -D - -o /dev/null --connect-timeout 5 --max-time 15 https://kraft.io.kr/healthz \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-kraft-build" {print $2}') || actual=""
            if [ -n "$actual" ] && [[ "$expected" == "$actual"* ]]; then
              echo "배포된 빌드 확인: $actual"
              exit 0
            fi
            echo "시도 $attempt/10: 응답한 빌드='${actual:-없음}', 기대='${expected:0:7}'"
            sleep 6
          done
          echo "::error::배포 후 /healthz가 방금 푸시한 빌드(${expected:0:7})가 아닌 '${actual:-없음}'를 알립니다 — 옛 jar가 떠 있거나 롤백됐을 수 있습니다."
          exit 1
