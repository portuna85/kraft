# 푸시·PR마다 테스트와 실행용 JAR 빌드를 검증하고, main 푸시가 전부 통과하면 운영에 배포한다.
#
# 대부분의 테스트는 test 프로파일(H2 인메모리)로 돌기 때문에 .env가 필요 없다
# (build.gradle.kts의 Test 태스크 참고).
#
# MariaDB 마이그레이션·기존 DB 전환·백업 복구·추천 최신성/이력 수입 테스트는 Testcontainers를
# 사용한다. ubuntu-latest에는 Docker가 있으므로 이 다섯 테스트 클래스도 실행된다 — Docker가
# 조용히 빠지는 CI 환경 회귀를 "Verify Docker-gated tests actually ran" 스텝이 잡는다(O06).
#
# deploy 잡은 test 잡이 만든 jar를 그대로 서버로 보낸다(다시 빌드하지 않는다) — 테스트를
# 통과한 바이트와 운영에 올라가는 바이트가 같은 것임을 보장하기 위해서다. 배포 절차와
# 서버 준비 방법은 deploy/deploy-apply.sh 주석 참고(docs/는 이 저장소에 커밋하지 않는
# 로컬 전용 문서라 여기서 가리키지 않는다, 개선 보고서 OPS-F1).
name: build

on:
  # 이 저장소는 PR을 만들지 않는 1인 개발 정책이라(개선 보고서 OPS-F2) pull_request 트리거는
  # 두지 않는다 — push만으로 같은 커밋이 build를 두 번 돌게 만드는 중복을 없앤다.
  push:
    branches: ['**']
    # 문서만 바뀐 푸시가 운영을 재시작하지 않게 한다(OPS-01) — main 푸시는 곧 배포라서,
    # README 한 줄이 systemctl restart(=JVM 기동 동안의 중단)로 이어졌다. 코드와 문서가 함께
    # 바뀐 커밋은 하나라도 무시 대상이 아닌 파일이 있으면 평소대로 돈다.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# 기본값(레포 설정에 따라 write일 수 있다)에 기대지 않고, 이 workflow가 실제로 쓰는 권한만
# 남긴다. 어떤 잡도 GITHUB_TOKEN으로 커밋·릴리스·패키지를 쓰지 않으므로 read면 충분하다.
permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 뒤 커밋이 앞 커밋의 실행을 대신한다 — CI 분(分)을 아끼고
# 결과도 최신 커밋 것만 의미가 있다. main은 취소하지 않는다 — deploy 잡이 이미 시작됐을 수
# 있고, main 커밋 하나하나의 test/e2e 결과를 전부 남겨야 배포 이력과 맞춰 볼 수 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 얕은 클론(depth 1)이다(OPS-27). 아래 "Guard migration files" 스텝이 이번 푸시 이전 커밋(github.
      # event.before)과 diff해야 하지만, 그 커밋 하나만 따로 받아 오면 되고(트리만 있으면 diff가 된다)
      # 전체 히스토리를 받을 필요가 없다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 이 deploy/*.sh 파일들(backup.sh, deploy-apply.sh 등)은 러너가 아니라 운영 서버에서
      # 수동 설치된 채로 돈다 — 아래 deploy 잡은 jar를 올리고 이 스크립트를 서버에서
      # 트리거만 할 뿐, 그 안의 셸 로직을 러너가 실행하는 것은 아니다(개선 보고서 OPS-F1).
      # 그래서 여기서는 실행이 아니라 문법·흔한 실수만 정적으로 잡는다(개선 보고서 OPS-01).
      # ubuntu-latest에 이미 설치되어 있어 별도 설치 없이 쓴다. -S warning: 파일명이 전부
      # 스크립트가 만든 타임스탬프라 info 수준(SC2012, ls 대신 find 권장)은 해당하지 않아
      # 걸러 둔다.
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning deploy/*.sh

      # 마이그레이션 규칙(A-OPS-03, src/main/resources/db/migration/README.md)을 지킨다.
      #
      # 1) 이미 있던 V*.sql을 수정·삭제·이름 변경하면 **실패**시킨다(OPS-03). Flyway는 적용된
      #    파일의 체크섬을 기록하므로, 고치면 운영이 기동에 실패하고 배포가 롤백된다. 바꾸려면
      #    새 버전 파일을 추가한다.
      # 2) 새로 추가된 V*.sql의 "확장→배포→수축" 위반 후보는 경고만 남긴다 — 의도된 경우(토큰
      #    해시화처럼 되돌릴 이유가 없는 보안 수정)가 있어서다. 이번 푸시에서 새로 추가된
      #    파일만 본다 — 이미 배포된 옛 파일(V24 등)은 의도적으로 확장+수축을 한 파일에
      #    압축한 적이 있어 매번 다시 걸리면 안 된다.
      - name: Guard migration files
        run: |
          base="${{ github.event.before }}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            # 이전 커밋 하나만 받는다. force-push로 사라진 커밋이면 실패하고 아래에서 건너뛴다.
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # 새 브랜치 첫 푸시이거나 force-push로 이전 커밋이 사라진 경우다. 조용히 통과하지
            # 않고 건너뛰었다는 사실을 남긴다.
            echo "::warning::비교할 이전 커밋이 없어 마이그레이션 가드를 건너뜁니다(새 브랜치 첫 푸시·force-push 등)."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- 'src/main/resources/db/migration/V*.sql')
          if [ -n "$changed" ]; then
            for f in $changed; do
              echo "::error file=$f::이미 있는 마이그레이션을 수정·삭제·이름 변경했습니다 — 체크섬이 달라져 운영 기동이 실패합니다. 새 버전 파일을 추가하세요."
            done
            exit 1
          fi
          new_files=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'src/main/resources/db/migration/V*.sql')
          for f in $new_files; do
            if grep -iE 'drop[[:space:]]+(column|table|index)|rename[[:space:]]+(column|table)|change[[:space:]]+column|modify[[:space:]]+column|truncate' "$f" > /dev/null; then
              echo "::warning file=$f::파괴적 DDL이 있습니다 — 확장→배포→수축 규칙(db/migration/README.md)을 지켰는지 확인하세요."
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # 후처리의 캐시 정리가 별도 Gradle/JVM을 띄워 약 25초를 쓴다.
          # 캐시 저장·복원은 유지하고 매 push의 추가 정리 실행만 생략한다.
          cache-cleanup: never

      # Docker(Testcontainers) 테스트는 아래 docker-tests 잡이 병렬로 돈다(OPS-07) — 같은 JVM에서
      # 순차로 돌면 배포 전 크리티컬 패스에 그 시간이 그대로 더해졌다. jar는 이 잡에서 만든 것이
      # deploy로 간다.
      # Java 포맷 게이트(OPS-33). 미사용 import·줄 끝 공백·파일 끝 줄바꿈만 본다 — 규칙은 build.gradle.kts의
      # spotless 블록. 실패하면 로컬에서 `./gradlew spotlessApply`로 고친다. 테스트보다 먼저 돌려 빨리 실패한다.
      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon --console=plain

      - name: Test and build jar
        run: ./gradlew test bootJar -PdockerTests=exclude --no-daemon --console=plain

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 확인할 수 있도록 리포트를 남긴다.
      # 커버리지 리포트도 함께 올린다(test가 끝나면 자동으로 만들어진다). 문턱값은 두지
      # 않았으므로 이 잡은 커버리지 때문에 실패하지 않는다 — 들여다볼 자료로만 남긴다.
      # 실패했을 때 테스트 JVM이 남긴 애플리케이션 로그(build/test-logs)도 함께 올린다(OPS-23).
      # 리포트에는 어설션 메시지만 있고, 서버 쪽 예외 스택은 이 로그에만 있다.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          path: build/test-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

      # deploy 잡이 이 jar를 그대로 가져다 쓴다. 여기서 test와 같은 태스크 실행으로 만들어진
      # 바로 그 파일이라는 점이 중요하다 — deploy 잡에서 다시 빌드하면 "테스트한 것"과
      # "배포한 것"이 이론상 달라질 수 있다. PR·다른 브랜치 푸시는 어차피 배포하지 않으므로
      # (deploy 잡의 if 조건) 그때는 이 아티팩트를 만들 이유가 없다.
      - name: Upload production jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-jar
          path: build/libs/kraft.jar
          # JAR는 이미 ZIP 압축되어 있어 다시 압축할 필요가 없다.
          compression-level: 0
          retention-days: 30

  # Docker(Testcontainers) 테스트만 따로 돈다(OPS-07). test 잡의 빠른 H2 테스트와 병렬로 돌아,
  # 두 잡 중 느린 쪽이 배포 전 크리티컬 패스가 된다. deploy는 이 잡도 통과해야 진행한다.
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-cleanup: never

      - name: Docker tests
        run: ./gradlew test -PdockerTests=only --no-daemon --console=plain

      # @Testcontainers(disabledWithoutDocker = true) 클래스는 Docker가 없으면 "실패"가 아니라
      # 전부 skipped로 조용히 통과한다 — CI 이미지에서 Docker가 빠지거나 데몬이 죽어 있어도
      # 빌드가 그대로 초록으로 끝나 아무도 모른다. 각 클래스의 JUnit XML을 열어 skipped 건수가
      # 전체 건수와 같은지(=한 건도 실행되지 않음) 확인해, 그런 회귀를 여기서 실패로 잡는다.
      - name: Verify Docker-gated tests actually ran
        run: |
          # 손으로 적은 목록이 하나라도 빠지면 그 클래스는 이 검증 밖에 남는다 — 소스에서
          # 직접 찾아, Docker 테스트를 새로 추가해도 이 목록이 자동으로 따라간다. 기반 클래스
          # (MariaDbIntegrationTest)는 테스트가 없으므로 제외하고, 그것을 상속한 클래스를 센다.
          classes=$(grep -rlE '@Tag\("docker"\)|extends MariaDbIntegrationTest' src/test/java --include='*.java' \
            | grep -v '/support/MariaDbIntegrationTest.java' \
            | sed 's#src/test/java/##; s#\.java$##; s#/#.#g')
          failed=0
          for cls in $classes; do
            file="build/test-results/test/TEST-${cls}.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$file 이 없습니다 — $cls 결과가 전혀 수집되지 않았다"
              failed=1
              continue
            fi
            tests=$(grep -o 'tests="[0-9]*"' "$file" | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' "$file" | head -1 | grep -o '[0-9]*')
            if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then
              echo "::error::$cls 에 테스트 케이스가 0건이다"
              failed=1
            elif [ "$skipped" = "$tests" ]; then
              echo "::error::$cls 의 테스트 ${tests}건이 전부 skipped다 — Docker가 없어 조용히 건너뛰었을 수 있다"
              failed=1
            else
              echo "$cls: ${tests}건 중 ${skipped}건 skip — 실제로 실행됨"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      - name: Upload docker test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-test-logs
          path: build/test-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload docker test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-test-report
          path: build/reports/tests/test
          retention-days: 7

  # 의존성 그래프는 저장소의 Automatic Dependency Submission (Gradle)이 제출한다.
  # 같은 push에서 별도 dependency-submission 잡을 실행하면 중복 해석·제출하게 된다.

  # 정적 검사만 모아 Node 전용으로 돈다 — JDK·Gradle을 설정하지 않아 e2e보다 훨씬 빨리
  # 끝난다. e2e와 독립적으로 병렬로 돌고, deploy는 이 잡도 통과해야 진행한다.
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # ESLint + tsc(jsconfig) + vue-tsc(tsconfig.vue.json). tsc는 IDE가 쓰는 타입 설정이 실제로
      # 해석되는지 확인하는 용도다 — bootstrap 전역 선언이 깨지면 여기서 드러난다. vue-tsc는 .vue
      # 컴포넌트의 템플릿·props·서버 DTO(src/vue/shared/types.js) 계약을 검사한다(평가 보고서
      # 2026-09-25 F09).
      - name: Lint and typecheck
        run: npm run lint

      # 브라우저 없이 돌리는 순수 함수 단위 테스트(node --test). 댓글·답글 상태 규칙처럼 여러
      # 동작이 겹치는 조합을 E2E보다 싸게 검사한다(평가 보고서 2026-09-25 F02·F03).
      - name: Unit tests
        run: npm run test:unit

      # 커밋된 bootstrap.custom.css가 SCSS 소스와 일치하는지 본다. 소스만 고치고 다시
      # 빌드하지 않으면 화면과 저장소가 어긋나므로, 여기서 잡는다.
      - name: Check generated CSS is up to date
        run: npm run check:css

      - name: Check generated Vue is up to date
        run: npm run check:vue

      # 템플릿의 modulepreload가 그 페이지의 진입 스크립트가 의존하는 청크를 빠짐없이
      # 가리키는지 본다(F01, FE-04) — 잘못되면 검사 명령 자체는 계속 성공해서, CI에 연결해 두지 않으면
      # 새 페이지가 이 누락을 그대로 들고 병합될 수 있다.
      - name: Check modulepreload references
        run: npm run check:preload

      # lockfile이 있다는 것만으로 알려진 취약점이 없다고 판정하지 않는다(F06). high/critical만
      # 실패시킨다 — low/moderate까지 막으면 관련 없는 푸시가 새로 공개된 취약점 때문에 갑자기
      # 막힐 수 있어, 급한 것만 걸러 사람이 보게 한다.
      - name: Audit npm dependencies
        run: npm run audit:check

  # E2E JAR는 한 번만 빌드하고 모든 shard가 같은 파일을 내려받는다.
  # 백엔드 테스트와 독립적으로 시작하므로 긴 test 잡을 기다리지 않는다.
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read locked Playwright version
        id: playwright-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          with open("package-lock.json", encoding="utf-8") as lockfile:
              packages = json.load(lockfile)["packages"]
          version = packages["node_modules/playwright-core"]["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Use a released Playwright Docker image"
          assert packages["node_modules/@playwright/test"]["version"] == version
          print(f"version={version}")
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # test 잡이 공통 의존성·컴파일 캐시를 저장한다. E2E 시작 전 중복 저장을 피한다.
          cache-read-only: true

      - name: Build E2E jar
        run: ./gradlew bootE2eJar --no-daemon --console=plain

      - name: Upload E2E jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-jar
          path: build/libs/kraft-e2e.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e:
    needs: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 브라우저와 OS 라이브러리가 포함된 공식 이미지로 매번 apt 설치하는 비용을 없앤다.
    # lockfile과 이미지 버전을 맞춰 Playwright가 실행 파일을 찾지 못하는 오류를 방지한다.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright-version }}-noble
      options: --init --ipc=host
    # 각 러너가 별도 서버·H2·로그인 상태를 사용한다. 러너 안에서는 workers=1로
    # 순서를 유지하고 파일 단위로 분할해 계정 변경·공유 DB 테스트의 충돌을 막는다.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Download E2E jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-jar
          path: build/libs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run E2E
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # retries: 1로 두 번째에 통과한 테스트(flaky)는 잡을 실패시키지 않는다. 대신 눈에 띄도록 요약에 적는다(OPS-34).
      # Playwright 컨테이너에는 jq가 없어 node 스크립트로 JSON 결과를 읽는다.
      - name: Report flaky tests
        if: ${{ !cancelled() && hashFiles('playwright-results.json') != '' }}
        run: node scripts/report-flaky.mjs "${{ matrix.shard }}"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

      # 실패했을 때 trace로 클릭 단위 재생이 가능하다.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # 시각 회귀(OPS-05). 기준선은 같은 Playwright 이미지(Linux)에서 만든 -chromium-linux.png다.
  # 일반 e2e 샤드는 이 스펙을 건너뛰고(CI=1), 여기서 VISUAL=1로 이 스펙만 돌린다.
  #
  # 6번 연속 오탐 없이 통과해 배포 게이트로 올렸다(deploy의 needs에 포함). 화면을 일부러 바꿨다면
  # `npm run visual:update`로 기준선을 다시 만들어 함께 커밋한다. 실패하면 playwright-visual-diff
  # 아티팩트에서 기대·실제·차이 이미지를 본다.
  visual:
    needs: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright-version }}-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Download E2E jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-jar
          path: build/libs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run visual regression
        env:
          VISUAL: '1'
        run: npx playwright test --project=chromium visual

      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-visual-diff
          path: test-results
          retention-days: 7

  # main에 실제로 반영된 푸시가 test·frontend-checks·e2e·visual을 모두 통과했을 때만 운영에 배포한다.
  # PR이나 다른 브랜치 푸시에서는 절대 돌지 않는다(if 조건).
  #
  # 서드파티 SSH 액션(appleboy/ssh-action 등)을 쓰지 않는다. 공개 저장소에서 배포용
  # 개인키를 외부 액션에 넘기는 것은 공급망 위험이고, 필요한 것은 ssh 한 줄뿐이라
  # 직접 쓰는 편이 검토 가능하다 — 이 저장소가 생성물을 커밋해 리뷰 가능한 diff를
  # 유지하는 것과 같은 판단이다.
  #
  # JDK·Gradle 설정이 없다 — 이 잡은 아무것도 빌드하지 않는다. test 잡이 만든 jar를
  # 그대로 옮길 뿐이다.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-tests, frontend-checks, e2e, visual]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 이 잡 전체의 상한. SSH·curl 각각에 타임아웃을 둬도, 네트워크가 응답 없이 그냥
    # 걸려 있는 경우(예: 방화벽이 SYN을 조용히 버림)까지는 개별 타임아웃이 못 잡을 수
    # 있다 — deploy-production 동시성 그룹을 다음 배포가 영영 기다리게 두지 않는다.
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://kraft.io.kr
    steps:
      # main이 이 워크플로가 시작된 뒤에도 그대로인지 확인한다. force-push나 그 사이 또 다른
      # 푸시로 origin/main이 이미 앞서 있으면, 낡은 커밋을 배포하는 대신 조용히 건너뛴다 —
      # 뒤이은 푸시의 워크플로가 최신 커밋을 다시 배포할 것이다.
      - name: Verify main hasn't moved since this run started
        run: |
          latest=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "::notice::main이 이미 $latest 로 앞서 있습니다(이 실행은 ${{ github.sha }}). 배포를 건너뜁니다."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Download production jar
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-jar

      # 배포 전용 키는 서버의 authorized_keys에 forced command로 등록되어 있다
      # (command="/opt/kraft/deploy-apply.sh"). 이 키로 접속하면 클라이언트가 무엇을
      # 요청하든 그 스크립트만 실행된다 — 셸도, 다른 명령도 얻지 못한다. 그래서 아래
      # ssh 명령의 "${{ github.sha }}"는 실행되는 게 아니라 SSH_ORIGINAL_COMMAND로
      # 서버 스크립트에 전달되어 로그에만 남는다.
      - name: Configure SSH
        if: env.SKIP_DEPLOY != '1'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy jar to server
        if: env.SKIP_DEPLOY != '1'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          # "<커밋 SHA>-<jar의 SHA-256>"을 보낸다(OPS-13). 서버의 deploy-apply.sh가 받은 jar와 대조한다.
          jar_sha256=$(sha256sum kraft.jar | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "${{ github.sha }}-${jar_sha256}" \
            < kraft.jar

      # 서버 안(localhost)에서는 deploy-apply.sh가 이미 헬스체크를 했다. 여기서는
      # 바깥에서 실제로 도메인이 응답하는지 — nginx·TLS·DNS까지 포함해 — 한 번 더 본다.
      # --connect-timeout·--max-time이 없으면 DNS·TLS가 응답 없이 걸릴 때 이 스텝이
      # 잡 전체 timeout-minutes가 끝날 때까지 그냥 멈춰 있는다. --retry로 배포 직후
      # nginx·앱이 막 올라오는 찰나의 순간적인 미응답까지 실패로 잡지 않는다.
      - name: Smoke test
        if: env.SKIP_DEPLOY != '1'
        run: |
          curl -fsS -o /dev/null --connect-timeout 5 --max-time 15 \
            --retry 5 --retry-delay 3 --retry-all-errors https://kraft.io.kr/

      # 위 스모크 테스트는 "도메인이 응답한다"만 본다 — 배포가 조용히 실패해 옛 jar가 계속 떠
      # 있어도 통과한다(OPS-12). /healthz의 X-Kraft-Build 헤더가 방금 푸시한 커밋인지 확인한다.
      # 헤더 값은 build.gradle.kts의 buildVersion(짧은 git SHA)이라 github.sha의 앞부분과
      # 비교한다. 재시작 직후 잠깐 이전 jar가 응답할 수 있어 여러 번 다시 본다. 롤백된 경우도
      # 헤더가 없거나 달라 여기서 실패로 드러난다.
      - name: Verify deployed build
        if: env.SKIP_DEPLOY != '1'
        run: |
          expected="${{ github.sha }}"
          for attempt in $(seq 1 10); do
            actual=$(curl -sS -D - -o /dev/null --connect-timeout 5 --max-time 15 https://kraft.io.kr/healthz \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-kraft-build" {print $2}') || actual=""
            if [ -n "$actual" ] && [[ "$expected" == "$actual"* ]]; then
              echo "배포된 빌드 확인: $actual"
              exit 0
            fi
            echo "시도 $attempt/10: 응답한 빌드='${actual:-없음}', 기대='${expected:0:7}'"
            sleep 6
          done
          echo "::error::배포 후 /healthz가 방금 푸시한 빌드(${expected:0:7})가 아닌 '${actual:-없음}'를 알립니다 — 옛 jar가 떠 있거나 롤백됐을 수 있습니다."
          exit 1
