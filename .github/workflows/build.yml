# 푸시·PR마다 테스트와 실행용 JAR 빌드를 검증하고, main 푸시가 전부 통과하면 운영에 배포한다.
#
# 대부분의 테스트는 test 프로파일(H2 인메모리)로 돌기 때문에 .env가 필요 없다
# (build.gradle.kts의 Test 태스크 참고).
#
# MariaDB 마이그레이션·기존 DB 전환·백업 복구·추천 최신성/이력 수입 테스트는 Testcontainers를
# 사용한다. ubuntu-latest에는 Docker가 있으므로 이 다섯 테스트 클래스도 실행된다 — Docker가
# 조용히 빠지는 CI 환경 회귀를 "Verify Docker-gated tests actually ran" 스텝이 잡는다(O06).
#
# deploy 잡은 test 잡이 만든 jar를 그대로 서버로 보낸다(다시 빌드하지 않는다) — 테스트를
# 통과한 바이트와 운영에 올라가는 바이트가 같은 것임을 보장하기 위해서다. 배포 절차와
# 서버 준비 방법은 deploy/deploy-apply.sh 주석과 docs/github-actions-cicd.md 참고.
name: build

on:
  push:
    branches: ['**']
  pull_request:

# 기본값(레포 설정에 따라 write일 수 있다)에 기대지 않고, 이 workflow가 실제로 쓰는 권한만
# 남긴다. 어떤 잡도 GITHUB_TOKEN으로 커밋·릴리스·패키지를 쓰지 않으므로 read면 충분하다.
permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 뒤 커밋이 앞 커밋의 실행을 대신한다 — CI 분(分)을 아끼고
# 결과도 최신 커밋 것만 의미가 있다. main은 취소하지 않는다 — deploy 잡이 이미 시작됐을 수
# 있고, main 커밋 하나하나의 test/e2e 결과를 전부 남겨야 배포 이력과 맞춰 볼 수 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 배포·백업 스크립트는 운영 서버에서만 돈다(수동 설치, CI가 배포하지 않는다) — 여기서는
      # 문법·흔한 실수만 정적으로 잡는다(개선 보고서 OPS-01). ubuntu-latest에 이미 설치되어
      # 있어 별도 설치 없이 쓴다. -S warning: 파일명이 전부 스크립트가 만든 타임스탬프라
      # info 수준(SC2012, ls 대신 find 권장)은 해당하지 않아 걸러 둔다.
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning deploy/*.sh

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Test and build jar
        run: ./gradlew test bootJar --no-daemon --console=plain

      # @Testcontainers(disabledWithoutDocker = true) 클래스는 Docker가 없으면 "실패"가 아니라
      # 전부 skipped로 조용히 통과한다 — CI 이미지에서 Docker가 빠지거나 데몬이 죽어 있어도
      # 빌드가 그대로 초록으로 끝나 아무도 모른다. 각 클래스의 JUnit XML을 열어 skipped 건수가
      # 전체 건수와 같은지(=한 건도 실행되지 않음) 확인해, 그런 회귀를 여기서 실패로 잡는다.
      - name: Verify Docker-gated tests actually ran
        run: |
          # 손으로 적은 목록이 하나라도 빠지면 그 클래스는 이 검증 밖에 남는다 — 소스에서
          # 직접 찾아, @Testcontainers를 새로 쓴 클래스를 여기 추가하는 것을 잊어도 이 목록이
          # 자동으로 따라간다.
          classes=$(grep -rl '@Testcontainers' src/test/java --include='*.java' \
            | sed 's#src/test/java/##; s#\.java$##; s#/#.#g')
          failed=0
          for cls in $classes; do
            file="build/test-results/test/TEST-${cls}.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$file 이 없습니다 — $cls 결과가 전혀 수집되지 않았다"
              failed=1
              continue
            fi
            tests=$(grep -o 'tests="[0-9]*"' "$file" | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' "$file" | head -1 | grep -o '[0-9]*')
            if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then
              echo "::error::$cls 에 테스트 케이스가 0건이다"
              failed=1
            elif [ "$skipped" = "$tests" ]; then
              echo "::error::$cls 의 테스트 ${tests}건이 전부 skipped다 — Docker가 없어 조용히 건너뛰었을 수 있다"
              failed=1
            else
              echo "$cls: ${tests}건 중 ${skipped}건 skip — 실제로 실행됨"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 확인할 수 있도록 리포트를 남긴다.
      # 커버리지 리포트도 함께 올린다(test가 끝나면 자동으로 만들어진다). 문턱값은 두지
      # 않았으므로 이 잡은 커버리지 때문에 실패하지 않는다 — 들여다볼 자료로만 남긴다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

      # deploy 잡이 이 jar를 그대로 가져다 쓴다. 여기서 test와 같은 태스크 실행으로 만들어진
      # 바로 그 파일이라는 점이 중요하다 — deploy 잡에서 다시 빌드하면 "테스트한 것"과
      # "배포한 것"이 이론상 달라질 수 있다. PR·다른 브랜치 푸시는 어차피 배포하지 않으므로
      # (deploy 잡의 if 조건) 그때는 이 아티팩트를 만들 이유가 없다.
      - name: Upload production jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-jar
          path: build/libs/kraft-0.0.1-SNAPSHOT.jar
          retention-days: 7

  # 정적 검사만 모아 Node 전용으로 돈다 — JDK·Gradle을 설정하지 않아 e2e보다 훨씬 빨리
  # 끝난다. e2e와 독립적으로 병렬로 돌고, deploy는 이 잡도 통과해야 진행한다.
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ESLint + tsc(jsconfig). tsc는 타입 검사가 아니라 IDE가 쓰는 타입 설정이 실제로
      # 해석되는지 확인하는 용도다 — bootstrap 전역 선언이 깨지면 여기서 드러난다.
      - name: Lint and typecheck
        run: npm run lint

      # 커밋된 bootstrap.custom.css가 SCSS 소스와 일치하는지 본다. 소스만 고치고 다시
      # 빌드하지 않으면 화면과 저장소가 어긋나므로, 여기서 잡는다.
      - name: Check generated CSS is up to date
        run: npm run check:css

      - name: Check generated Vue is up to date
        run: npm run check:vue

      # 템플릿의 modulepreload가 실제로 그 페이지의 가장 무거운 의존 청크를 가리키는지
      # 본다(F01) — 잘못되면 검사 명령 자체는 계속 성공해서, CI에 연결해 두지 않으면
      # 새 페이지가 이 누락을 그대로 들고 병합될 수 있다.
      - name: Check modulepreload references
        run: npm run check:preload

      # 커밋된 vendor/bootstrap.min.js가 package-lock.json이 고정한 버전과 어긋나지 않는지
      # 본다(F06) — 별도 npm 패키지가 아니라 직접 복사해 둔 파일이라, 버전을 올려도
      # 이 파일만 조용히 뒤처질 수 있다.
      - name: Check vendor asset version
        run: npm run check:vendor

      # lockfile이 있다는 것만으로 알려진 취약점이 없다고 판정하지 않는다(F06). high/critical만
      # 실패시킨다 — low/moderate까지 막으면 관련 없는 푸시가 새로 공개된 취약점 때문에 갑자기
      # 막힐 수 있어, 급한 것만 걸러 사람이 보게 한다.
      - name: Audit npm dependencies
        run: npm run audit:check

  # 브라우저 검증은 Node.js가 필요한 별도 잡에서 수행한다. test 잡의 산출물을 쓰지 않고
  # bootE2eJar를 직접 새로 빌드하므로 test와는 기능적으로 독립적이다 — needs를 걸지 않고
  # 병렬로 돌려 전체 workflow 시간을 줄인다(test 실패 시에도 e2e가 끝까지 도는 대신,
  # public 저장소라 Actions 분당 과금 걱정 없이 대기 시간만 아낀다). frontend-checks와도
  # 독립적으로 병렬로 돈다 — 정적 검사 실패가 실제 브라우저 검증까지 막을 이유는 없다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # E2E 시드·메일 기록기·H2를 포함하는 전용 JAR. 운영 bootJar와 분리한다.
      - name: Build E2E jar
        run: ./gradlew bootE2eJar --no-daemon --console=plain

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # package.json의 @playwright/test 버전이 바뀔 때만 캐시를 새로 받는다 — 브라우저
      # 바이너리는 버전마다 호환성이 갈려, 낡은 캐시를 재사용하면 안 된다.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # 실패했을 때 trace로 클릭 단위 재생이 가능하다.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # main에 실제로 반영된 푸시가 test·frontend-checks·e2e를 모두 통과했을 때만 운영에 배포한다.
  # PR이나 다른 브랜치 푸시에서는 절대 돌지 않는다(if 조건).
  #
  # 서드파티 SSH 액션(appleboy/ssh-action 등)을 쓰지 않는다. 공개 저장소에서 배포용
  # 개인키를 외부 액션에 넘기는 것은 공급망 위험이고, 필요한 것은 ssh 한 줄뿐이라
  # 직접 쓰는 편이 검토 가능하다 — 이 저장소가 생성물을 커밋해 리뷰 가능한 diff를
  # 유지하는 것과 같은 판단이다.
  #
  # JDK·Gradle 설정이 없다 — 이 잡은 아무것도 빌드하지 않는다. test 잡이 만든 jar를
  # 그대로 옮길 뿐이다.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend-checks, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 이 잡 전체의 상한. SSH·curl 각각에 타임아웃을 둬도, 네트워크가 응답 없이 그냥
    # 걸려 있는 경우(예: 방화벽이 SYN을 조용히 버림)까지는 개별 타임아웃이 못 잡을 수
    # 있다 — deploy-production 동시성 그룹을 다음 배포가 영영 기다리게 두지 않는다.
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://kraft.io.kr
    steps:
      # main이 이 워크플로가 시작된 뒤에도 그대로인지 확인한다. force-push나 그 사이 또 다른
      # 푸시로 origin/main이 이미 앞서 있으면, 낡은 커밋을 배포하는 대신 조용히 건너뛴다 —
      # 뒤이은 푸시의 워크플로가 최신 커밋을 다시 배포할 것이다.
      - name: Verify main hasn't moved since this run started
        run: |
          latest=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "::notice::main이 이미 $latest 로 앞서 있습니다(이 실행은 ${{ github.sha }}). 배포를 건너뜁니다."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Download production jar
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-jar

      # 배포 전용 키는 서버의 authorized_keys에 forced command로 등록되어 있다
      # (command="/opt/kraft/deploy-apply.sh"). 이 키로 접속하면 클라이언트가 무엇을
      # 요청하든 그 스크립트만 실행된다 — 셸도, 다른 명령도 얻지 못한다. 그래서 아래
      # ssh 명령의 "${{ github.sha }}"는 실행되는 게 아니라 SSH_ORIGINAL_COMMAND로
      # 서버 스크립트에 전달되어 로그에만 남는다.
      - name: Configure SSH
        if: env.SKIP_DEPLOY != '1'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy jar to server
        if: env.SKIP_DEPLOY != '1'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "${{ github.sha }}" \
            < kraft-0.0.1-SNAPSHOT.jar

      # 서버 안(localhost)에서는 deploy-apply.sh가 이미 헬스체크를 했다. 여기서는
      # 바깥에서 실제로 도메인이 응답하는지 — nginx·TLS·DNS까지 포함해 — 한 번 더 본다.
      # --connect-timeout·--max-time이 없으면 DNS·TLS가 응답 없이 걸릴 때 이 스텝이
      # 잡 전체 timeout-minutes가 끝날 때까지 그냥 멈춰 있는다. --retry로 배포 직후
      # nginx·앱이 막 올라오는 찰나의 순간적인 미응답까지 실패로 잡지 않는다.
      - name: Smoke test
        if: env.SKIP_DEPLOY != '1'
        run: |
          curl -fsS -o /dev/null --connect-timeout 5 --max-time 15 \
            --retry 5 --retry-delay 3 --retry-all-errors https://kraft.io.kr/
