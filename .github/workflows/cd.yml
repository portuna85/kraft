name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: read

# 동시 배포 방지 — 진행 중인 배포는 취소하지 않음
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # ssh-action의 command_timeout(20m)은 원격 스크립트 실행만 감싼다 — SSH 연결 자체가
    # 걸리는 경우까지 대비해 job 상한을 여유 있게 둔다.
    timeout-minutes: 30
    environment:
      name: production
      url: https://kraft.io.kr

    steps:
      - name: Download affected-component plan from CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment-plan
          path: .deployment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load affected-component plan
        id: deployment-plan
        run: |
          source .deployment/deployment-plan.env
          {
            echo "backend=$DEPLOY_BACKEND_CHANGED"
            echo "web=$DEPLOY_WEB_CHANGED"
            echo "infra=$DEPLOY_INFRA_CHANGED"
          } >> "$GITHUB_OUTPUT"
      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # 배포 대상 SHA (CI가 빌드·푸시한 이미지 태그와 일치)
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          KRAFT_BACKEND_IMAGE_REF: ghcr.io/${{ env.REPO_LC }}/backend
          KRAFT_WEB_IMAGE_REF:     ghcr.io/${{ env.REPO_LC }}/web
          KRAFT_BACKEND_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          KRAFT_WEB_IMAGE_TAG:     ${{ github.event.workflow_run.head_sha }}
          DEPLOY_BACKEND_CHANGED: ${{ steps.deployment-plan.outputs.backend }}
          DEPLOY_WEB_CHANGED:     ${{ steps.deployment-plan.outputs.web }}
          DEPLOY_INFRA_CHANGED:   ${{ steps.deployment-plan.outputs.infra }}
          # DB / 서비스 시크릿
          # KRAFT_DB_URL, KRAFT_DB_USERNAME 은 .env.prod.example에 하드코딩됨
          # (Docker Compose는 shell env가 --env-file보다 우선하므로 shell에서 제외)
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          MARIADB_PASSWORD:      ${{ secrets.MARIADB_PASSWORD }}
          KRAFT_DB_PASSWORD:     ${{ secrets.KRAFT_DB_PASSWORD }}
          KRAFT_OPS_TOKEN:       ${{ secrets.KRAFT_OPS_TOKEN }}
          KRAFT_REVALIDATE_SECRET: ${{ secrets.KRAFT_REVALIDATE_SECRET }}
          KRAFT_WEB_OBSERVABILITY_SECRET: ${{ secrets.KRAFT_WEB_OBSERVABILITY_SECRET }}
          # 도메인 / 네트워크
          KRAFT_PUBLIC_BASE_URL:             ${{ secrets.KRAFT_PUBLIC_BASE_URL }}
          KRAFT_DOMAIN:                      ${{ secrets.KRAFT_DOMAIN }}
          KRAFT_ADMIN_DOMAIN:                ${{ secrets.KRAFT_ADMIN_DOMAIN }}
          KRAFT_OPS_ALLOWED_HOST:            ${{ secrets.KRAFT_ADMIN_DOMAIN }}
          KRAFT_ADMIN_ALLOWED_CIDR:          ${{ secrets.KRAFT_ADMIN_ALLOWED_CIDR }}
          # 관리자 콘솔 부트스트랩 (admin_users 비어있을 때만 1회성 생성)
          KRAFT_ADMIN_BOOTSTRAP_USERNAME: ${{ secrets.KRAFT_ADMIN_BOOTSTRAP_USERNAME }}
          KRAFT_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.KRAFT_ADMIN_BOOTSTRAP_PASSWORD }}
          # 외부 API
          KRAFT_EXTERNAL_LOTTO_URL_TEMPLATE: ${{ secrets.KRAFT_EXTERNAL_LOTTO_URL_TEMPLATE }}
          # 커뮤니티 OAuth2 — provider별 ID/secret을 모두 넣으면 활성화되고, 모두 비우면
          # 비활성화된다. 한쪽만 설정된 경우 validate-env.sh가 기동 전에 배포를 차단한다.
          KRAFT_COMMUNITY_GOOGLE_CLIENT_ID: ${{ secrets.KRAFT_COMMUNITY_GOOGLE_CLIENT_ID }}
          KRAFT_COMMUNITY_GOOGLE_CLIENT_SECRET: ${{ secrets.KRAFT_COMMUNITY_GOOGLE_CLIENT_SECRET }}
          KRAFT_COMMUNITY_NAVER_CLIENT_ID: ${{ secrets.KRAFT_COMMUNITY_NAVER_CLIENT_ID }}
          KRAFT_COMMUNITY_NAVER_CLIENT_SECRET: ${{ secrets.KRAFT_COMMUNITY_NAVER_CLIENT_SECRET }}
          # 모니터링
          GRAFANA_ADMIN_PASSWORD:         ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          ALERTMANAGER_DISCORD_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_DISCORD_WEBHOOK_URL }}
          KRAFT_HEARTBEAT_URL: ${{ secrets.KRAFT_HEARTBEAT_URL }}
          # GHCR 인증 (private 이미지 pull)
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER:  ${{ github.repository_owner }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          envs: >-
            DEPLOY_SHA,
            KRAFT_BACKEND_IMAGE_REF,KRAFT_WEB_IMAGE_REF,
            KRAFT_BACKEND_IMAGE_TAG,KRAFT_WEB_IMAGE_TAG,
            DEPLOY_BACKEND_CHANGED,DEPLOY_WEB_CHANGED,DEPLOY_INFRA_CHANGED,
            MARIADB_ROOT_PASSWORD,MARIADB_PASSWORD,
            KRAFT_DB_PASSWORD,
            KRAFT_OPS_TOKEN,KRAFT_REVALIDATE_SECRET,KRAFT_WEB_OBSERVABILITY_SECRET,
            KRAFT_PUBLIC_BASE_URL,KRAFT_DOMAIN,KRAFT_ADMIN_DOMAIN,KRAFT_OPS_ALLOWED_HOST,KRAFT_ADMIN_ALLOWED_CIDR,
            KRAFT_ADMIN_BOOTSTRAP_USERNAME,KRAFT_ADMIN_BOOTSTRAP_PASSWORD,
            KRAFT_EXTERNAL_LOTTO_URL_TEMPLATE,
            KRAFT_COMMUNITY_GOOGLE_CLIENT_ID,KRAFT_COMMUNITY_GOOGLE_CLIENT_SECRET,
            KRAFT_COMMUNITY_NAVER_CLIENT_ID,KRAFT_COMMUNITY_NAVER_CLIENT_SECRET,
            GRAFANA_ADMIN_PASSWORD,ALERTMANAGER_DISCORD_WEBHOOK_URL,KRAFT_HEARTBEAT_URL,
            GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/kraft

            # OPS-CD-01(docs/improvement.md): 배포 실패는 예전엔 GitHub Actions 로그
            # 주석(::error::)뿐이었다 — 런타임 경보는 34개 규칙 모두 Discord로 나가는데
            # 배포 실패는 안 나갔다. 이미 있는 ALERTMANAGER_DISCORD_WEBHOOK_URL을 그대로
            # 쓴다(Discord 웹훅 URL은 Alertmanager 전용이 아니라 일반 POST도 받는다).
            # 조용한 자동 롤백(성공)도 알린다 — 안 그러면 다음 배포에서 같은 실패가
            # 반복돼도 아무도 모른다.
            notify_discord() {
              local message="$1"
              if [[ -z "${ALERTMANAGER_DISCORD_WEBHOOK_URL:-}" ]]; then
                echo "  (ALERTMANAGER_DISCORD_WEBHOOK_URL 미설정 — Discord 알림 생략)" >&2
                return 0
              fi
              curl -fsS -X POST -H "Content-Type: application/json" \
                -d "$(printf '{"content":"%s"}' "$message")" \
                "$ALERTMANAGER_DISCORD_WEBHOOK_URL" >/dev/null \
                || echo "  Discord 알림 전송 실패(무시하고 계속)" >&2
            }

            echo "==> [1/6] GHCR 인증"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> [2/6] 배포 전 현재 상태 저장 (롤백용)"
            PREV_SHA=$(git rev-parse HEAD)
            PREV_BACKEND=$(docker inspect --format '{{.Config.Image}}' kraft-backend 2>/dev/null || echo "")
            PREV_WEB=$(docker inspect --format '{{.Config.Image}}'    kraft-web     2>/dev/null || echo "")
            echo "  이전 SHA:     $PREV_SHA"
            echo "  이전 backend: ${PREV_BACKEND:-없음}"
            echo "  이전 web:     ${PREV_WEB:-없음}"

            echo "==> [3/6] 코드 업데이트 (SHA: ${DEPLOY_SHA})"
            git fetch --depth=1 origin main
            git reset --hard "$DEPLOY_SHA"

            echo "==> [4/6] 환경 설정 렌더링"
            bash scripts/deploy/render-env.sh .env.prod.example .env.prod
            bash scripts/deploy/render-alertmanager.sh

            echo "==> [5/6] 이미지 풀 및 서비스 재기동"
            if ! bash scripts/deploy/pull-and-up.sh; then
              echo "==> [FAIL] 배포 실패 — 롤백 시작" >&2

              # Caddyfile-only rollback first: cheap (~seconds, no image pull, no
              # backend cold-start wait) and fixes the common case where the new
              # commit's Caddyfile itself is the problem, not the app images.
              if [[ "$PREV_SHA" != "$DEPLOY_SHA" ]] && bash scripts/deploy/rollback-caddy.sh "$PREV_SHA" && bash scripts/deploy/smoke-test.sh; then
                echo "==> Caddyfile 롤백만으로 복구 완료 — 이미지 롤백 불필요"
                notify_discord "⚠️ Kraft 배포 실패 (SHA \`${DEPLOY_SHA}\`) — Caddyfile만 이전 SHA로 롤백해 자동 복구됨. 이 커밋의 Caddyfile 변경분을 확인하세요."
                exit 1
              fi

              echo "==> Caddyfile 롤백으로 해결 안 됨 — 이미지 롤백 진행" >&2
              ROLLBACK_FAILED=0
              if [[ -n "$PREV_BACKEND" ]]; then
                echo "롤백 backend → $PREV_BACKEND"
                bash scripts/deploy/rollback.sh backend "$PREV_BACKEND" || ROLLBACK_FAILED=1
              fi
              if [[ -n "$PREV_WEB" ]]; then
                echo "롤백 web → $PREV_WEB"
                bash scripts/deploy/rollback.sh web "$PREV_WEB" || ROLLBACK_FAILED=1
              fi
              if [[ "$ROLLBACK_FAILED" -eq 1 ]]; then
                echo "==> [FAIL] 롤백 자체가 실패함 — 수동 개입 필요" >&2
                notify_discord "🚨 Kraft 배포 실패 (SHA \`${DEPLOY_SHA}\`) — 자동 롤백도 실패했습니다. 수동 개입이 필요합니다: \`bash scripts/deploy/rollback.sh <service> <image-ref>\`"
              else
                echo "==> 롤백 완료 (이전 버전으로 복구됨)" >&2
                notify_discord "⚠️ Kraft 배포 실패 (SHA \`${DEPLOY_SHA}\`) — 이전 이미지로 자동 롤백 완료. 이 커밋을 확인하세요."
              fi
              exit 1
            fi

            echo "==> [6/6] 배포 완료 (SHA: ${DEPLOY_SHA})"
            bash scripts/deploy/save-known-good.sh
            docker logout ghcr.io

      - name: Notify failure
        if: failure()
        # OPS-CD-01(docs/improvement.md): 위 배포 스크립트가 이미 실행됐다면 그 안의
        # notify_discord()가 정확히 어느 단계에서 실패했는지(Caddy 롤백만/이미지
        # 롤백 완료/롤백도 실패) Discord로 먼저 보낸다 — 여기 로그 주석은 SSH 연결
        # 자체가 안 돼 원격 스크립트가 아예 못 돈 경우까지 잡는 최후 백스톱이다.
        run: |
          echo "::error::Production deploy failed for SHA ${{ github.event.workflow_run.head_sha }}"
          echo "::error::Check Discord for the specific failure stage (Caddy-only rollback / image rollback / rollback failure)."
          echo "::error::Run rollback manually if needed: bash scripts/deploy/rollback.sh <service> <image-ref>"
