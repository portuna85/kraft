name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      web_next: ${{ steps.scope.outputs.web_next }}
      infra: ${{ steps.scope.outputs.infra }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 2
      - name: Detect affected components
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/detect-changes.sh "$BASE_SHA" "$GITHUB_SHA"
      - name: Record deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BACKEND_CHANGED: ${{ steps.scope.outputs.backend }}
          WEB_CHANGED: ${{ steps.scope.outputs.web }}
          INFRA_CHANGED: ${{ steps.scope.outputs.infra }}
        run: |
          {
            echo "DEPLOY_BACKEND_CHANGED=$BACKEND_CHANGED"
            echo "DEPLOY_WEB_CHANGED=$WEB_CHANGED"
            echo "DEPLOY_INFRA_CHANGED=$INFRA_CHANGED"
          } > deployment-plan.env
      - name: Upload deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-plan
          path: deployment-plan.env
          retention-days: 1

  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/caddy:/etc/caddy" \
            -e KRAFT_DOMAIN=kraft.io.kr \
            -e KRAFT_ADMIN_DOMAIN=admin.kraft.io.kr \
            caddy:2-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2 \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate active shell scripts
        run: |
          mapfile -t ACTIVE_SCRIPTS < <(find scripts -name '*.sh' -not -path 'scripts/archive/*')
          shellcheck "${ACTIVE_SCRIPTS[@]}"
      - name: Run repository policy guards
        run: |
          bash scripts/check-no-removed-features.sh
          bash scripts/check-env-drift.sh
          node scripts/check-container-hardening.mjs
          node scripts/check-photo-asset-metadata.mjs

  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "25"
          distribution: temurin
      - name: Restore Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build, test, and verify coverage
        run: >-
          ./gradlew test jacocoTestCoverageVerification bootJar
          -PstrictCoverage=true
          -PtestWorkers=2
          --build-cache
          --no-daemon
      - name: Upload verified backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-boot-jar
          path: build/libs/kraft-backend.jar
          if-no-files-found: error
          retention-days: 1
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Run backend static analysis
        run: >-
          ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest
          -PstrictStatic=true
          --build-cache
          --no-daemon

  web-build-test:
    name: Web Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-legacy/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload web diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-diagnostics
          path: web-legacy/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # 재작성 중인 새 프론트엔드(web/)의 자체 게이트. 아직 배포 대상이 아니라 이미지 빌드·
  # 배포로 이어지지 않는다 — improvement_fe.md Phase 1.
  web-next-build-test:
    name: Web Next Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build standalone application
        run: npm run build
        env:
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:59999
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      # 예산은 Phase 1부터 게이트다 — 나중에 붙이면 이미 초과한 상태에서 시작하게 된다(R-2).
      - run: npm run budget:bundle
      - name: Upload web-next diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-diagnostics
          path: |
            web/coverage/
            web/scripts/bundle-results.json
          if-no-files-found: ignore
          retention-days: 7

  # CSP nonce와 /ops 게이트는 셸과 함께 검증해야 한다 — 나중에 붙이면 전 페이지
  # 하이드레이션이 깨진 상태를 늦게 발견한다(improvement_fe.md R-3, Phase 2).
  web-next-e2e-proxy:
    name: Web Next E2E (CSP·/ops 게이트)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build proxy-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-proxy
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4110
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3110
      - run: npm run test:e2e:proxy
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-proxy
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # 픽스처 백엔드를 상시 가동한 주요 사용자 흐름 — Phase 7(테스트 피라미드 완성),
  # improvement_fe.md §21. 레거시의 default/content 2트랙 분리를 따르지 않는다
  # (playwright.default.config.ts 상단 주석 참고).
  web-next-e2e-default:
    name: Web Next E2E (주요 흐름)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build default-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-default
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4111
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3111
      - run: npm run test:e2e:default
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-default
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # axe 자동 검사 + 키보드 흐름 — Phase 7, improvement_fe.md §21.4.
  web-next-e2e-a11y:
    name: Web Next E2E (접근성)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build a11y-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-a11y
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4112
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3112
      - run: npm run test:e2e:a11y
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-a11y
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  web-build-artifacts:
    name: Web Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            dist_dir: .next
            archive: web-build-default.tar.gz
            backend_url: http://127.0.0.1:59999
            public_url: http://127.0.0.1:3100
            sticky_unit: ""
          - variant: content
            dist_dir: .next-content
            archive: web-build-content.tar.gz
            backend_url: http://127.0.0.1:4101
            public_url: http://127.0.0.1:3101
            sticky_unit: ""
          - variant: visual
            dist_dir: .next-visual
            archive: web-build-visual.tar.gz
            backend_url: http://127.0.0.1:4102
            public_url: http://127.0.0.1:3102
            sticky_unit: ""
          - variant: ad-overlay
            dist_dir: .next-ad-overlay
            archive: web-build-ad-overlay.tar.gz
            backend_url: http://127.0.0.1:59999
            public_url: http://127.0.0.1:3105
            sticky_unit: DAN-ci-ad-overlay-test
          - variant: proxy
            dist_dir: .next-proxy
            archive: web-build-proxy.tar.gz
            backend_url: http://127.0.0.1:4103
            public_url: http://127.0.0.1:8180
            sticky_unit: ""
    defaults:
      run:
        working-directory: web-legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-legacy/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build standalone application once
        run: npm run build
        env:
          NEXT_DIST_DIR: ${{ matrix.dist_dir }}
          NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY: ${{ matrix.sticky_unit }}
          KRAFT_BACKEND_INTERNAL_URL: ${{ matrix.backend_url }}
          KRAFT_PUBLIC_BASE_URL: ${{ matrix.public_url }}
          NEXT_PUBLIC_UNDO_WINDOW_MS: "200"
      - name: Package reusable build output
        run: >-
          tar
          --exclude="${{ matrix.dist_dir }}/cache"
          --exclude="${{ matrix.dist_dir }}/dev"
          -czf "../${{ matrix.archive }}"
          "${{ matrix.dist_dir }}"
      - name: Upload reusable build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build-${{ matrix.variant }}
          path: ${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  web-e2e:
    name: Web E2E (${{ matrix.suite }}, ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    needs: [changes, web-build-artifacts]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: default
            shard: 1/3
            shard_id: 1-of-3
            command: test:e2e
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: default
            shard: 2/3
            shard_id: 2-of-3
            command: test:e2e
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: default
            shard: 3/3
            shard_id: 3-of-3
            command: test:e2e
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: content
            shard: 1/3
            shard_id: 1-of-3
            command: test:e2e:content
            artifact: web-build-content
            archive: web-build-content.tar.gz
          - suite: content
            shard: 2/3
            shard_id: 2-of-3
            command: test:e2e:content
            artifact: web-build-content
            archive: web-build-content.tar.gz
          - suite: content
            shard: 3/3
            shard_id: 3-of-3
            command: test:e2e:content
            artifact: web-build-content
            archive: web-build-content.tar.gz
          - suite: cross-browser
            shard: 1/2
            shard_id: firefox-1-of-2
            project: firefox
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: cross-browser
            shard: 2/2
            shard_id: firefox-2-of-2
            project: firefox
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: cross-browser
            shard: 1/2
            shard_id: webkit-1-of-2
            project: webkit
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: cross-browser
            shard: 2/2
            shard_id: webkit-2-of-2
            project: webkit
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: visual
            shard: 1/2
            shard_id: 1-of-2
            command: test:e2e:visual
            artifact: web-build-visual
            archive: web-build-visual.tar.gz
          - suite: visual
            shard: 2/2
            shard_id: 2-of-2
            command: test:e2e:visual
            artifact: web-build-visual
            archive: web-build-visual.tar.gz
          - suite: ad-overlay
            shard: 1/1
            shard_id: 1-of-1
            command: test:e2e:ad-overlay
            artifact: web-build-ad-overlay
            archive: web-build-ad-overlay.tar.gz
          # RW-P1-07: content 트랙(실콘텐츠·픽스처 백엔드 전제)이 지금까지 Firefox/WebKit에서
          # 한 번도 실행되지 않았다 — playwright.content.cross-browser.config.ts는 만들어져
          # 있었지만 어디에도 연결돼 있지 않았다. KF-10이 지적한 CI 팽창을 반복하지 않도록
          # 반응형/오버플로/시각 계약에 실제로 민감한 스펙 몇 개만 골라(설정 파일의
          # testMatch 참고) 샤딩 없이 한 잡에서 Firefox+WebKit을 순차 실행한다.
          - suite: content-cross-browser
            shard: 1/1
            shard_id: 1-of-1
            command: test:e2e:content:cross-browser
            artifact: web-build-content
            archive: web-build-content.tar.gz
    defaults:
      run:
        working-directory: web-legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Restore npm package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web-legacy/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download prebuilt application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: web-legacy/.ci-artifacts
      - name: Restore prebuilt application
        run: tar -xzf ".ci-artifacts/${{ matrix.archive }}"
      - name: Run balanced Playwright shard
        if: matrix.suite != 'cross-browser'
        run: npm run ${{ matrix.command }} -- --shard=${{ matrix.shard }}
        env:
          HOME: /root
      - name: Run balanced cross-browser shard
        if: matrix.suite == 'cross-browser'
        run: npm run ${{ matrix.command }} -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          HOME: /root
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.shard_id }}
          path: |
            web-legacy/test-results/
            web-legacy/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      # KF-10: 실측 없이 정해온 샤드 수를 재조정할 근거를 쌓는다 — 성공/실패 무관하게
      # 항상 업로드(pass 케이스의 소요시간도 재조정 판단에 필요).
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timing-${{ matrix.suite }}-${{ matrix.shard_id }}
          path: web-legacy/playwright-timing.json
          if-no-files-found: ignore
          retention-days: 14

  web-e2e-proxy:
    name: Web E2E (Caddy proxy gateway)
    # KF-06: web-legacy/src/lib/backend-proxy.ts와 23개 Next 라우트 핸들러 삭제 이후,
    # caddy/Caddyfile.local이 그 역할(쿠키·CSRF·기기토큰·응답헤더 전달, 타임아웃,
    # /api/revalidate 차단)을 대신 지키는지 실제 Caddy 컨테이너로 검증한다. 이 잡은
    # web-e2e와 달리 Playwright 컨테이너 안에서 돌지 않는다 — docker-in-docker 없이
    # 실 Caddy 컨테이너를 띄우려면 러너에 직접 도커가 있어야 한다.
    runs-on: ubuntu-latest
    needs: [changes, web-build-artifacts]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-legacy/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Download prebuilt application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build-proxy
          path: web-legacy/.ci-artifacts
      - name: Restore prebuilt application
        run: tar -xzf ".ci-artifacts/web-build-proxy.tar.gz"
      - name: Run Caddy proxy gateway E2E
        run: npm run test:e2e:proxy
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-proxy
          path: |
            web-legacy/test-results/
            web-legacy/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timing-proxy
          path: web-legacy/playwright-timing.json
          if-no-files-found: ignore
          retention-days: 14

  web-performance-budget:
    name: Web Performance Budget
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    needs: [changes, web-build-artifacts]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Restore npm package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web-legacy/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download default build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build-default
          path: web-legacy/.ci-artifacts/default
      - name: Download fixture-backed build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build-content
          path: web-legacy/.ci-artifacts/content
      - name: Restore build outputs
        run: |
          tar -xzf .ci-artifacts/default/web-build-default.tar.gz
          tar -xzf .ci-artifacts/content/web-build-content.tar.gz
      - name: Run bundle and Lighthouse budgets
        run: bash ../scripts/ci/run-web-performance.sh .
        env:
          PERF_BASE_URL: http://127.0.0.1:3101
      - name: Upload budget diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-budget-diagnostics
          path: |
            web-legacy/scripts/bundle-results.json
            web-legacy/scripts/lighthouse-results.json
          if-no-files-found: ignore
          retention-days: 7

  api-types-drift-guard:
    name: API Types Drift Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-legacy/package-lock.json
      - name: Install web dependencies reproducibly
        working-directory: web-legacy
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Start local-profile backend
        run: |
          ./gradlew bootRun --args="--spring.profiles.active=local" --build-cache --no-daemon > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Verify generated API types
        working-directory: web-legacy
        run: npm run verify:api-types
        env:
          KRAFT_BACKEND_INTERNAL_URL: http://localhost:8080
      - name: Upload API drift diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-types-drift-diagnostics
          path: backend.log
          retention-days: 7

  docker-publish-backend:
    name: Docker Publish (backend)
    runs-on: ubuntu-latest
    needs: [changes, backend-build-test, static-analysis, repository-guards]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-guards.result == 'success' &&
      (needs.backend-build-test.result == 'success' || needs.backend-build-test.result == 'skipped') &&
      (needs.static-analysis.result == 'success' || needs.static-analysis.result == 'skipped')
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Verify required deployment secrets
        env:
          CHECK_DB_PASSWORD: ${{ secrets.KRAFT_DB_PASSWORD }}
          CHECK_REVALIDATE_SECRET: ${{ secrets.KRAFT_REVALIDATE_SECRET }}
          CHECK_OPS_TOKEN: ${{ secrets.KRAFT_OPS_TOKEN }}
        run: |
          missing=()
          [ -z "$CHECK_DB_PASSWORD" ] && missing+=("KRAFT_DB_PASSWORD")
          [ -z "$CHECK_REVALIDATE_SECRET" ] && missing+=("KRAFT_REVALIDATE_SECRET")
          [ -z "$CHECK_OPS_TOKEN" ] && missing+=("KRAFT_OPS_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required secrets are missing: ${missing[*]}"
            exit 1
          fi
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.changes.outputs.backend == 'true'
      - name: Download verified bootJar
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-boot-jar
          path: build/libs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.changes.outputs.backend == 'true'
      # backend-verified 태그: 이 커밋에서 실제로 빌드·푸시가 성공했다는 사실만 기록하는
      # 태그다 — 이 잡 자체의 결과와 무관하게(예: 다른 컴포넌트의 E2E가 나중에 실패해도)
      # 항상 "가장 최근에 실제로 빌드된 백엔드 소스"를 가리킨다. promote 잡은 오직 전체
      # quality-gate 통과 시에만 :latest를 전진시키므로, 만약 재사용(reuse) 스텝이 예전처럼
      # :latest를 그대로 복제했다면 — 백엔드가 실제로 바뀐 어떤 커밋이 이미지 빌드에는
      # 성공했지만 그 실행의 quality-gate가 무관한 이유로 실패해 promote가 안 됐을 경우 —
      # 그 이후 backend=false인 커밋들이 전부 그 멈춘 :latest만 영원히 복제해 SHA 태그가
      # 실제 소스와 어긋난 채 굳어버린다(실제로 겪음: 운영 DB가 V31 마이그레이션 이전
      # 이미지에 멈춰 배포 실패). backend-verified는 quality-gate 결과와 완전히 분리돼
      # 있어 이 정체를 근본적으로 막는다.
      - name: Assemble and push verified backend artifact
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: prebuilt
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:backend-verified
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime
      - name: Reuse previously verified backend image
        if: needs.changes.outputs.backend != 'true'
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$IMAGE:backend-verified"

  docker-publish-web:
    name: Docker Publish (web)
    runs-on: ubuntu-latest
    needs: [changes, web-build-test, repository-guards]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-guards.result == 'success' &&
      (needs.web-build-test.result == 'success' || needs.web-build-test.result == 'skipped')
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.changes.outputs.web == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.changes.outputs.web == 'true'
      # web-verified 태그: backend와 동일한 이유(quality-gate 결과와 무관하게 "실제로
      # 최근에 빌드된 소스"를 계속 정확히 가리키기 위함)로 둔다.
      - name: Build and push web image
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: web-legacy
          file: web-legacy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:web-verified
          build-args: |
            KRAFT_PUBLIC_BASE_URL=${{ secrets.KRAFT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY_DESKTOP=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY_DESKTOP }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY }}
            NEXT_PUBLIC_AD_NETWORK=${{ vars.NEXT_PUBLIC_AD_NETWORK || 'adfit' }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_UNIT_SIDEBAR=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_SIDEBAR }}
            NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY }}
            NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY_MOBILE=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY_MOBILE }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Reuse previously verified web image
        if: needs.changes.outputs.web != 'true'
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$IMAGE:web-verified"

  security-scan:
    name: Security Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [changes, docker-publish-backend, docker-publish-web]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-publish-backend.result == 'success' &&
      needs.docker-publish-web.result == 'success'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            changed: ${{ needs.changes.outputs.backend }}
          - component: web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - name: Set image name
        if: matrix.changed == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Scan once for all reportable severities
        if: matrix.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-results.json
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
      - name: Report MEDIUM and block fixable HIGH/CRITICAL
        if: matrix.changed == 'true'
        run: |
          echo "Vulnerability counts:"
          jq -r '
            [.Results[]?.Vulnerabilities[]?]
            | group_by(.Severity)
            | map({severity: .[0].Severity, count: length})
            | .[]
            | "  \(.severity): \(.count)"
          ' trivy-results.json

          echo "MEDIUM findings:"
          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(.Severity == "MEDIUM")
            | "  \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) fixed=\(.FixedVersion // "")"
          ' trivy-results.json

          blocking="$(jq '
            [
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length
          ' trivy-results.json)"
          if (( blocking > 0 )); then
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
              | "::error::\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"
            ' trivy-results.json
            exit 1
          fi
      - name: Reused image already passed its immutable-SHA scan
        if: matrix.changed != 'true'
        run: echo "No component changes; the previously scanned image digest was reused."

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - repository-guards
      - backend-build-test
      - static-analysis
      - web-build-test
      - web-next-build-test
      - web-next-e2e-proxy
      - web-next-e2e-default
      - web-next-e2e-a11y
      - web-build-artifacts
      - web-e2e
      - web-e2e-proxy
      - web-performance-budget
      - api-types-drift-guard
      - docker-publish-backend
      - docker-publish-web
      - security-scan
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify every affected quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          WEB_NEXT_CHANGED: ${{ needs.changes.outputs.web_next }}
          GUARDS_RESULT: ${{ needs.repository-guards.result }}
          BACKEND_RESULT: ${{ needs.backend-build-test.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          API_RESULT: ${{ needs.api-types-drift-guard.result }}
          WEB_TEST_RESULT: ${{ needs.web-build-test.result }}
          WEB_NEXT_RESULT: ${{ needs.web-next-build-test.result }}
          WEB_NEXT_PROXY_RESULT: ${{ needs.web-next-e2e-proxy.result }}
          WEB_NEXT_DEFAULT_RESULT: ${{ needs.web-next-e2e-default.result }}
          WEB_NEXT_A11Y_RESULT: ${{ needs.web-next-e2e-a11y.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build-artifacts.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          WEB_E2E_PROXY_RESULT: ${{ needs.web-e2e-proxy.result }}
          WEB_PERF_RESULT: ${{ needs.web-performance-budget.result }}
          BACKEND_IMAGE_RESULT: ${{ needs.docker-publish-backend.result }}
          WEB_IMAGE_RESULT: ${{ needs.docker-publish-web.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name result is $result"
              exit 1
            fi
          }

          require_success "Repository guards" "$GUARDS_RESULT"
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            require_success "Backend" "$BACKEND_RESULT"
            require_success "Static analysis" "$STATIC_RESULT"
            require_success "API type drift" "$API_RESULT"
          fi
          if [[ "$WEB_CHANGED" == "true" ]]; then
            require_success "Web tests" "$WEB_TEST_RESULT"
            require_success "Web builds" "$WEB_BUILD_RESULT"
            require_success "Web E2E" "$WEB_E2E_RESULT"
            require_success "Web E2E (Caddy proxy gateway)" "$WEB_E2E_PROXY_RESULT"
            require_success "Web performance" "$WEB_PERF_RESULT"
          fi
          if [[ "$WEB_NEXT_CHANGED" == "true" ]]; then
            require_success "Web Next (재작성 중인 프론트엔드)" "$WEB_NEXT_RESULT"
            require_success "Web Next E2E (CSP·/ops 게이트)" "$WEB_NEXT_PROXY_RESULT"
            require_success "Web Next E2E (주요 흐름)" "$WEB_NEXT_DEFAULT_RESULT"
            require_success "Web Next E2E (접근성)" "$WEB_NEXT_A11Y_RESULT"
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            require_success "Backend image" "$BACKEND_IMAGE_RESULT"
            require_success "Web image" "$WEB_IMAGE_RESULT"
            require_success "Image security scans" "$SECURITY_RESULT"
          fi

  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-publish-backend, docker-publish-web]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality-gate.result == 'success'
    timeout-minutes: 8
    permissions:
      packages: write
    steps:
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both immutable images in parallel
        run: |
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:$GITHUB_SHA" &
          backend_pid=$!
          docker buildx imagetools create \
            --tag "$WEB_IMAGE:latest" "$WEB_IMAGE:$GITHUB_SHA" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
