name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      infra: ${{ steps.scope.outputs.infra }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 2
      - name: Detect affected components
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/detect-changes.sh "$BASE_SHA" "$GITHUB_SHA"
      - name: Record deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BACKEND_CHANGED: ${{ steps.scope.outputs.backend }}
          WEB_CHANGED: ${{ steps.scope.outputs.web }}
          INFRA_CHANGED: ${{ steps.scope.outputs.infra }}
        run: |
          {
            echo "DEPLOY_BACKEND_CHANGED=$BACKEND_CHANGED"
            echo "DEPLOY_WEB_CHANGED=$WEB_CHANGED"
            echo "DEPLOY_INFRA_CHANGED=$INFRA_CHANGED"
          } > deployment-plan.env
      - name: Upload deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-plan
          path: deployment-plan.env
          retention-days: 1

  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/caddy:/etc/caddy" \
            -e KRAFT_DOMAIN=kraft.io.kr \
            -e KRAFT_ADMIN_DOMAIN=admin.kraft.io.kr \
            caddy:2-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2 \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate active shell scripts
        run: |
          mapfile -t ACTIVE_SCRIPTS < <(find scripts -name '*.sh' -not -path 'scripts/archive/*')
          shellcheck "${ACTIVE_SCRIPTS[@]}"
      - name: Run repository policy guards
        run: |
          bash scripts/check-no-removed-features.sh
          bash scripts/check-env-drift.sh
          node scripts/check-container-hardening.mjs
          node scripts/check-photo-asset-metadata.mjs

  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "25"
          distribution: temurin
      - name: Restore Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build, test, and verify coverage
        run: >-
          ./gradlew test jacocoTestCoverageVerification bootJar
          -PstrictCoverage=true
          -PtestWorkers=2
          --build-cache
          --no-daemon
      - name: Upload verified backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-boot-jar
          path: build/libs/kraft-backend.jar
          if-no-files-found: error
          retention-days: 1
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Run backend static analysis
        run: >-
          ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest
          -PstrictStatic=true
          --build-cache
          --no-daemon

  web-build-test:
    name: Web Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload web diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-diagnostics
          path: web/coverage/
          if-no-files-found: ignore
          retention-days: 7

  web-build-artifacts:
    name: Web Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            dist_dir: .next
            archive: web-build-default.tar.gz
            backend_url: http://127.0.0.1:59999
            public_url: http://127.0.0.1:3100
            sticky_unit: ""
          - variant: content
            dist_dir: .next-content
            archive: web-build-content.tar.gz
            backend_url: http://127.0.0.1:4101
            public_url: http://127.0.0.1:3101
            sticky_unit: ""
          - variant: visual
            dist_dir: .next-visual
            archive: web-build-visual.tar.gz
            backend_url: http://127.0.0.1:4102
            public_url: http://127.0.0.1:3102
            sticky_unit: ""
          - variant: ad-overlay
            dist_dir: .next-ad-overlay
            archive: web-build-ad-overlay.tar.gz
            backend_url: http://127.0.0.1:59999
            public_url: http://127.0.0.1:3103
            sticky_unit: DAN-ci-ad-overlay-test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build standalone application once
        run: npm run build
        env:
          NEXT_DIST_DIR: ${{ matrix.dist_dir }}
          NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY: ${{ matrix.sticky_unit }}
          KRAFT_BACKEND_INTERNAL_URL: ${{ matrix.backend_url }}
          KRAFT_PUBLIC_BASE_URL: ${{ matrix.public_url }}
          NEXT_PUBLIC_UNDO_WINDOW_MS: "200"
      - name: Package reusable build output
        run: >-
          tar
          --exclude="${{ matrix.dist_dir }}/cache"
          --exclude="${{ matrix.dist_dir }}/dev"
          -czf "../${{ matrix.archive }}"
          "${{ matrix.dist_dir }}"
      - name: Upload reusable build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build-${{ matrix.variant }}
          path: ${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  web-e2e:
    name: Web E2E (${{ matrix.suite }}, ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      options: --ipc=host
    needs: [changes, web-build-artifacts]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: default
            shard: 1/3
            shard_id: 1-of-3
            command: test:e2e
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: default
            shard: 2/3
            shard_id: 2-of-3
            command: test:e2e
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: default
            shard: 3/3
            shard_id: 3-of-3
            command: test:e2e
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: content
            shard: 1/3
            shard_id: 1-of-3
            command: test:e2e:content
            artifact: web-build-content
            archive: web-build-content.tar.gz
          - suite: content
            shard: 2/3
            shard_id: 2-of-3
            command: test:e2e:content
            artifact: web-build-content
            archive: web-build-content.tar.gz
          - suite: content
            shard: 3/3
            shard_id: 3-of-3
            command: test:e2e:content
            artifact: web-build-content
            archive: web-build-content.tar.gz
          - suite: cross-browser
            shard: 1/3
            shard_id: 1-of-3
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: cross-browser
            shard: 2/3
            shard_id: 2-of-3
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: cross-browser
            shard: 3/3
            shard_id: 3-of-3
            command: test:e2e:cross-browser
            artifact: web-build-default
            archive: web-build-default.tar.gz
          - suite: visual
            shard: 1/2
            shard_id: 1-of-2
            command: test:e2e:visual
            artifact: web-build-visual
            archive: web-build-visual.tar.gz
          - suite: visual
            shard: 2/2
            shard_id: 2-of-2
            command: test:e2e:visual
            artifact: web-build-visual
            archive: web-build-visual.tar.gz
          - suite: ad-overlay
            shard: 1/1
            shard_id: 1-of-1
            command: test:e2e:ad-overlay
            artifact: web-build-ad-overlay
            archive: web-build-ad-overlay.tar.gz
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Restore npm package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download prebuilt application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: web/.ci-artifacts
      - name: Restore prebuilt application
        run: tar -xzf ".ci-artifacts/${{ matrix.archive }}"
      - name: Run balanced Playwright shard
        run: npm run ${{ matrix.command }} -- --shard=${{ matrix.shard }}
        env:
          HOME: /root
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.shard_id }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  web-performance-budget:
    name: Web Performance Budget
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      options: --ipc=host
    needs: [changes, web-build-artifacts]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Restore npm package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download default build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build-default
          path: web/.ci-artifacts/default
      - name: Download fixture-backed build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build-content
          path: web/.ci-artifacts/content
      - name: Restore build outputs
        run: |
          tar -xzf .ci-artifacts/default/web-build-default.tar.gz
          tar -xzf .ci-artifacts/content/web-build-content.tar.gz
      - name: Run bundle and Lighthouse budgets
        run: bash ../scripts/ci/run-web-performance.sh .
        env:
          PERF_BASE_URL: http://127.0.0.1:3101
      - name: Upload budget diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-budget-diagnostics
          path: |
            web/scripts/bundle-results.json
            web/scripts/lighthouse-results.json
          if-no-files-found: ignore
          retention-days: 7

  api-types-drift-guard:
    name: API Types Drift Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies reproducibly
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Start local-profile backend
        run: |
          ./gradlew bootRun --args="--spring.profiles.active=local" --build-cache --no-daemon > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Verify generated API types
        working-directory: web
        run: npm run verify:api-types
        env:
          KRAFT_BACKEND_INTERNAL_URL: http://localhost:8080
      - name: Upload API drift diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-types-drift-diagnostics
          path: backend.log
          retention-days: 7

  docker-publish-backend:
    name: Docker Publish (backend)
    runs-on: ubuntu-latest
    needs: [changes, backend-build-test, static-analysis, repository-guards]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-guards.result == 'success' &&
      (needs.backend-build-test.result == 'success' || needs.backend-build-test.result == 'skipped') &&
      (needs.static-analysis.result == 'success' || needs.static-analysis.result == 'skipped')
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Verify required deployment secrets
        env:
          CHECK_DB_PASSWORD: ${{ secrets.KRAFT_DB_PASSWORD }}
          CHECK_REVALIDATE_SECRET: ${{ secrets.KRAFT_REVALIDATE_SECRET }}
          CHECK_OPS_TOKEN: ${{ secrets.KRAFT_OPS_TOKEN }}
        run: |
          missing=()
          [ -z "$CHECK_DB_PASSWORD" ] && missing+=("KRAFT_DB_PASSWORD")
          [ -z "$CHECK_REVALIDATE_SECRET" ] && missing+=("KRAFT_REVALIDATE_SECRET")
          [ -z "$CHECK_OPS_TOKEN" ] && missing+=("KRAFT_OPS_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required secrets are missing: ${missing[*]}"
            exit 1
          fi
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.changes.outputs.backend == 'true'
      - name: Download verified bootJar
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-boot-jar
          path: build/libs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.changes.outputs.backend == 'true'
      - name: Assemble and push verified backend artifact
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: prebuilt
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime
      - name: Reuse previously verified backend image
        if: needs.changes.outputs.backend != 'true'
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"

  docker-publish-web:
    name: Docker Publish (web)
    runs-on: ubuntu-latest
    needs: [changes, web-build-test, repository-guards]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-guards.result == 'success' &&
      (needs.web-build-test.result == 'success' || needs.web-build-test.result == 'skipped')
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.changes.outputs.web == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.changes.outputs.web == 'true'
      - name: Build and push web image
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            KRAFT_PUBLIC_BASE_URL=${{ secrets.KRAFT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY_DESKTOP=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY_DESKTOP }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY }}
            NEXT_PUBLIC_AD_NETWORK=${{ vars.NEXT_PUBLIC_AD_NETWORK || 'adfit' }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_UNIT_SIDEBAR=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_SIDEBAR }}
            NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY }}
            NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY_MOBILE=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY_MOBILE }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Reuse previously verified web image
        if: needs.changes.outputs.web != 'true'
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"

  security-scan:
    name: Security Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [changes, docker-publish-backend, docker-publish-web]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-publish-backend.result == 'success' &&
      needs.docker-publish-web.result == 'success'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            changed: ${{ needs.changes.outputs.backend }}
          - component: web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - name: Set image name
        if: matrix.changed == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Scan once for all reportable severities
        if: matrix.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-results.json
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
      - name: Report MEDIUM and block fixable HIGH/CRITICAL
        if: matrix.changed == 'true'
        run: |
          echo "Vulnerability counts:"
          jq -r '
            [.Results[]?.Vulnerabilities[]?]
            | group_by(.Severity)
            | map({severity: .[0].Severity, count: length})
            | .[]
            | "  \(.severity): \(.count)"
          ' trivy-results.json

          echo "MEDIUM findings:"
          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(.Severity == "MEDIUM")
            | "  \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) fixed=\(.FixedVersion // "")"
          ' trivy-results.json

          blocking="$(jq '
            [
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length
          ' trivy-results.json)"
          if (( blocking > 0 )); then
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
              | "::error::\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"
            ' trivy-results.json
            exit 1
          fi
      - name: Reused image already passed its immutable-SHA scan
        if: matrix.changed != 'true'
        run: echo "No component changes; the previously scanned image digest was reused."

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - repository-guards
      - backend-build-test
      - static-analysis
      - web-build-test
      - web-build-artifacts
      - web-e2e
      - web-performance-budget
      - api-types-drift-guard
      - docker-publish-backend
      - docker-publish-web
      - security-scan
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify every affected quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          GUARDS_RESULT: ${{ needs.repository-guards.result }}
          BACKEND_RESULT: ${{ needs.backend-build-test.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          API_RESULT: ${{ needs.api-types-drift-guard.result }}
          WEB_TEST_RESULT: ${{ needs.web-build-test.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build-artifacts.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          WEB_PERF_RESULT: ${{ needs.web-performance-budget.result }}
          BACKEND_IMAGE_RESULT: ${{ needs.docker-publish-backend.result }}
          WEB_IMAGE_RESULT: ${{ needs.docker-publish-web.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name result is $result"
              exit 1
            fi
          }

          require_success "Repository guards" "$GUARDS_RESULT"
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            require_success "Backend" "$BACKEND_RESULT"
            require_success "Static analysis" "$STATIC_RESULT"
            require_success "API type drift" "$API_RESULT"
          fi
          if [[ "$WEB_CHANGED" == "true" ]]; then
            require_success "Web tests" "$WEB_TEST_RESULT"
            require_success "Web builds" "$WEB_BUILD_RESULT"
            require_success "Web E2E" "$WEB_E2E_RESULT"
            require_success "Web performance" "$WEB_PERF_RESULT"
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            require_success "Backend image" "$BACKEND_IMAGE_RESULT"
            require_success "Web image" "$WEB_IMAGE_RESULT"
            require_success "Image security scans" "$SECURITY_RESULT"
          fi

  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-publish-backend, docker-publish-web]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality-gate.result == 'success'
    timeout-minutes: 8
    permissions:
      packages: write
    steps:
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both immutable images in parallel
        run: |
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:$GITHUB_SHA" &
          backend_pid=$!
          docker buildx imagetools create \
            --tag "$WEB_IMAGE:latest" "$WEB_IMAGE:$GITHUB_SHA" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
