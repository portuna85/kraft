name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      infra: ${{ steps.scope.outputs.infra }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 2
      - name: Detect affected components
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/detect-changes.sh "$BASE_SHA" "$GITHUB_SHA"
      - name: Record deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BACKEND_CHANGED: ${{ steps.scope.outputs.backend }}
          WEB_CHANGED: ${{ steps.scope.outputs.web }}
          INFRA_CHANGED: ${{ steps.scope.outputs.infra }}
        run: |
          {
            echo "DEPLOY_BACKEND_CHANGED=$BACKEND_CHANGED"
            echo "DEPLOY_WEB_CHANGED=$WEB_CHANGED"
            echo "DEPLOY_INFRA_CHANGED=$INFRA_CHANGED"
          } > deployment-plan.env
      - name: Upload deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-plan
          path: deployment-plan.env
          retention-days: 1

  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/caddy:/etc/caddy" \
            -e KRAFT_DOMAIN=kraft.io.kr \
            -e KRAFT_ADMIN_DOMAIN=admin.kraft.io.kr \
            caddy:2-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2 \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Prometheus alert rules
        # TD-007: docker-compose.prod.yml/docker-compose.yml에 이미 고정된 Prometheus 버전과
        # 다이제스트를 재사용해, 실제 배포되는 버전과 다른 promtool로 검증하는 드리프트를 막는다.
        run: |
          docker run --rm \
            -v "$PWD/infra/prometheus/rules:/rules" \
            --entrypoint promtool \
            prom/prometheus:v3.4.0@sha256:78ed1f9050eb9eaf766af6e580230b1c4965728650e332cd1ee918c0c4699775 \
            check rules /rules/kraft_alerts.yml
      - name: Validate active shell scripts
        run: |
          mapfile -t ACTIVE_SCRIPTS < <(find scripts -name '*.sh' -not -path 'scripts/archive/*')
          shellcheck "${ACTIVE_SCRIPTS[@]}"
      - name: Run validate-env.sh regression tests
        run: bash scripts/deploy/validate-env.test.sh
      - name: Run resolve-trusted-proxy-cidr.sh regression tests
        run: bash scripts/deploy/resolve-trusted-proxy-cidr.test.sh
      - name: Run repository policy guards
        run: |
          bash scripts/check-no-removed-features.sh
          bash scripts/check-env-drift.sh
          bash scripts/check-visual-baseline-platform.sh
          node scripts/check-container-hardening.mjs
          node scripts/check-env-anchor-drift.mjs
          node scripts/check-photo-asset-metadata.mjs
          node scripts/check-css-layer.mjs

  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: temurin
      - name: Restore Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build, test, and verify coverage
        run: >-
          ./gradlew test jacocoTestCoverageVerification bootJar
          -PstrictCoverage=true
          -PtestWorkers=2
          --build-cache
          --no-daemon
      - name: Upload verified backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-boot-jar
          path: build/libs/kraft-backend.jar
          if-no-files-found: error
          retention-days: 1
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-diagnostics
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run backend static analysis
        run: >-
          ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest
          -PstrictStatic=true
          --build-cache
          --no-daemon

  web-next-build-test:
    name: Web Next Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # I-06: npm ci 자체는 --no-audit로 빠르게 설치만 하고, 취약점 스캔은 별도
      # 단계로 분리해 실패 메시지를 명확히 구분한다(설치 실패 vs 취약점 발견).
      - name: Audit npm dependencies (high/critical only)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build standalone application
        run: npm run build
        env:
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:59999
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      # 예산은 Phase 1부터 게이트다 — 나중에 붙이면 이미 초과한 상태에서 시작하게 된다(R-2).
      - run: npm run budget:bundle
      - name: Upload web-next diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-diagnostics
          path: |
            web/coverage/
            web/scripts/bundle-results.json
          if-no-files-found: ignore
          retention-days: 7

  # CSP nonce와 /ops 게이트는 셸과 함께 검증해야 한다 — 나중에 붙이면 전 페이지
  # 하이드레이션이 깨진 상태를 늦게 발견한다(R-3, Phase 2).
  web-next-e2e-proxy:
    name: Web Next E2E (CSP·/ops 게이트)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build proxy-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-proxy
          # REF-05: Caddy 없이 standalone 서버만 띄우는 트랙이라 필요하다(next.config.ts 참고).
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4110
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3110
      - run: npm run test:e2e:proxy
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-proxy
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # 픽스처 백엔드를 상시 가동한 주요 사용자 흐름 — Phase 7(테스트 피라미드 완성),
  # 레거시의 default/content 2트랙 분리를 따르지 않는다
  # (playwright.default.config.ts 상단 주석 참고).
  web-next-e2e-default:
    name: Web Next E2E (주요 흐름)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build default-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-default
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4111
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3111
      - run: npm run test:e2e:default
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-default
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # axe 자동 검사 + 키보드 흐름 — Phase 7.
  web-next-e2e-a11y:
    name: Web Next E2E (접근성)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build a11y-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-a11y
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4112
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3112
      - run: npm run test:e2e:a11y
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-a11y
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # 픽셀 스크린샷 회귀 — Phase 7. 베이스라인은
  # playwright.visual.config.ts 상단 주석대로 CI(Linux)가 만든 actual.png를 채택한다
  # ([[project_visual_baseline_ci_adopt]]) — 로컬에서 만든 파일을 commit하지 않는다.
  web-next-e2e-visual:
    name: Web Next E2E (시각 회귀)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build visual-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-visual
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4113
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3113
      - run: npm run test:e2e:visual
        env:
          # Desktop Firefox 프로젝트가 root로 실행되는 컨테이너에서 $HOME
          # 소유자가 pwuser라 launch 자체를 거부한다 — cross-browser 잡과
          # 같은 workaround(Playwright 공식 안내).
          HOME: /root
      - name: Upload failure traces and actual screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-visual
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Firefox·WebKit에서 a11y 트랙 스펙 + default 트랙(핵심 흐름)을 재사용해 브라우저
  # 호환성을 재검증한다 — Phase 7 + docs/improvement.md 12단계(cross-browser testDir 확장).
  web-next-e2e-cross-browser:
    name: Web Next E2E (크로스브라우저)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build cross-browser-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-cross-browser
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4114
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3114
      - run: npm run test:e2e:cross-browser
        env:
          # 컨테이너가 root로 실행되는데 $HOME(/github/home)의 소유자가 pwuser라
          # Firefox가 launch 자체를 거부한다 — web-legacy의 cross-browser 샤드와
          # 같은 workaround(Playwright 공식 안내).
          HOME: /root
      - run: npm run test:e2e:cross-browser:default
        env:
          HOME: /root
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-cross-browser
          path: |
            web/test-results/
            web/playwright-report/
            web/test-results-cross-browser-default/
            web/playwright-report-cross-browser-default/
          if-no-files-found: ignore
          retention-days: 7

  # 경계 뷰포트·확대·고정 UI 가림을 프로그래매틱 단언으로 검증 — Phase 1
  # (docs/improvement_claude_fe.md §7.3, docs/improvement_codex_fe.md §8.1).
  web-next-e2e-responsive:
    name: Web Next E2E (반응형 단언)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build responsive-track application
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-responsive
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4115
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3115
      - run: npm run test:e2e:responsive
        env:
          # KF-03(docs/improvement.md): 이 트랙에 firefox 프로젝트가 추가되면서
          # cross-browser 트랙과 같은 문제가 생겼다 — 컨테이너가 root로 실행되는데
          # $HOME(/github/home)의 소유자가 pwuser라 Firefox가 launch 자체를
          # 거부한다(Playwright 공식 안내 workaround).
          HOME: /root
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-playwright-responsive
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # 번들·Lighthouse 예산 게이트 P-5·P-11 검증.
  # web-legacy의 web-performance-budget과 달리 별도 빌드 아티팩트 공유 잡이 없다 —
  # 다른 web-next-e2e-* 잡처럼 이 잡 안에서 직접 빌드한다(NEXT_DIST_DIR 기본값 .next).
  web-next-performance-budget:
    name: Web Next Performance Budget
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_ENABLE_STANDALONE_REWRITES: "true"
          KRAFT_BACKEND_INTERNAL_URL: http://127.0.0.1:4101
          KRAFT_PUBLIC_BASE_URL: http://127.0.0.1:3101
      - name: Run bundle and Lighthouse budgets
        run: bash ../scripts/ci/run-web-performance.sh .
        env:
          APP_DIST_DIR: .next
          PERF_BASE_URL: http://127.0.0.1:3101
          FIXTURE_BACKEND_URL: http://127.0.0.1:4101
          # run-web-performance.sh는 "npm run e2e:fixture"를 PORT 오버라이드 없이
          # 그냥 실행한다(레거시의 픽스처는 E2E_FIXTURE_BACKEND_PORT를 쓰고 기본값이
          # 이미 4101이라 이 문제가 없었다) — web/의 e2e/fixtures/backend.mjs는 PORT를
          # 읽고 기본값이 4110이라, 여기서 PORT를 명시하지 않으면 FIXTURE_BACKEND_URL과
          # 어긋난 포트에서 뜬다. 이 값은 스크립트가 나중에 3101로 다시 export하므로
          # e2e:serve(앱)에는 영향이 없다 — e2e:fixture에만 쓰인다.
          PORT: "4101"
          # 픽스처 백엔드가 항상 id=1 글을 심어 둔다(e2e/fixtures/backend.mjs,
          # e2e/default/community-and-status.spec.ts와 동일 데이터) — 로컬
          # --save-baseline도 이 id로 저장했다.
          PERF_POST_ID: "1"
      - name: Upload budget diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-next-performance-budget-diagnostics
          path: |
            web/scripts/bundle-results.json
            web/scripts/lighthouse-results.json
          if-no-files-found: ignore
          retention-days: 7

  # k6 부하 테스트 — §7 이월 "테스트 갭"(k6를 CI 성능 회귀 트랙에 통합). Lighthouse 예산과
  # 달리 임계값이 아직 실측으로 검증되지 않았으므로 당분간 정보 제공용이다 — 임계값을
  # 넘어도 이 잡은 실패하지 않고 k6 요약을 아티팩트로만 남긴다. 몇 주 실측치를 본 뒤
  # Quality Gate에 편입할지 결정한다. PR마다 돌리기엔 무겁고 노이즈가 커서 main 푸시에서만
  # 돈다. scripts/load-test/recommend-and-community.js는 X-Device-Token만 쓰고 OAuth
  # 세션이 필요 없어 CI에서 바로 돌릴 수 있다.
  backend-load-test:
    name: Backend Load Test (k6, informational)
    runs-on: ubuntu-latest
    needs: [changes, backend-build-test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.7@sha256:fcc7fcd7114adb5d41f14d116b8aac45f94280d2babfbbb71b4782922ee6d8d4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kraft_lotto
          MARIADB_USER: kraft_lotto
          MARIADB_PASSWORD: kraft_lotto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: temurin
      - name: Download verified bootJar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-boot-jar
          path: build/libs
      # winning_numbers 테이블 자체가 Flyway 마이그레이션 산출물이라 부팅 전에는 심을 수
      # 없다(먼저 시도했다가 "Table doesn't exist"로 확인) — 부팅부터 한다.
      - name: Start backend
        env:
          KRAFT_DB_URL: "jdbc:mariadb://127.0.0.1:3306/kraft_lotto?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
          KRAFT_DB_USERNAME: kraft_lotto
          KRAFT_DB_PASSWORD: kraft_lotto
          KRAFT_FLYWAY_ENABLED: "true"
          KRAFT_JPA_DDL_AUTO: validate
        run: |
          nohup java -jar build/libs/kraft-backend.jar --server.port=8080 > backend.log 2>&1 &
          echo $! > backend.pid
      # readiness 그룹에는 recommendationHistory 인디케이터가 포함돼 있고(application.yml),
      # 그 ready()는 roundCount>0을 요구한다 — 시드 전에는 영원히 DOWN이라 이 시점 신호로
      # 못 쓴다(로컬 실측으로 확인). liveness는 그 커스텀 인디케이터가 없어 앱이 뜨자마자
      # UP이 된다 — "스키마까지 만들어졌다"만 확인하면 되는 지금 목적에 맞는 신호다.
      - name: Wait for backend readiness
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::백엔드가 준비되지 않았다"
          cat backend.log
          exit 1
      # 테이블이 이제 존재하므로 여기서 심는다. 러너에 DB 클라이언트를 설치하는 대신 같은
      # mariadb 이미지를 일회성 클라이언트로 쓴다.
      - name: Seed winning-number history
        run: |
          docker run --rm --network=host \
            -v "${{ github.workspace }}/scripts/load-test:/seed" \
            mariadb:11.7@sha256:fcc7fcd7114adb5d41f14d116b8aac45f94280d2babfbbb71b4782922ee6d8d4 \
            sh -c "mariadb -h127.0.0.1 -uroot -proot kraft_lotto < /seed/seed-history.sql"
      # 이 시점 스냅샷은 부팅 시점(빈 이력)에 멈춰 있다 — 시드가 DB 버전을 올렸으므로 다음
      # 추천 호출은 fail-closed 503으로 스냅샷을 갱신만 하고 끝난다(의도된 동작, 로컬 실측
      # 확인됨). k6가 이 워밍업 요청까지 측정하지 않도록 결과를 버리는 별도 호출로 미리
      # 태운다.
      - name: Warm up recommendation history snapshot
        run: |
          curl -s -o /dev/null -X POST http://127.0.0.1:8080/api/v1/numbers/recommend \
            -H "Content-Type: application/json" \
            -d '{"count":1,"strategy":"balanced"}' || true
      - name: Run k6 load test (informational — thresholds do not fail the build)
        run: |
          docker run --rm --network=host \
            -v "${{ github.workspace }}/scripts/load-test:/scripts" \
            grafana/k6:0.54.0 run --env BASE_URL=http://127.0.0.1:8080 \
            --summary-export=/scripts/k6-summary.json \
            /scripts/recommend-and-community.js || true
      - name: Stop backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-load-test-summary
          path: scripts/load-test/k6-summary.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-load-test-log
          path: backend.log
          if-no-files-found: ignore
          retention-days: 7

  api-types-drift-guard:
    name: API Types Drift Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies reproducibly
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Start local-profile backend
        run: |
          ./gradlew bootRun --args="--spring.profiles.active=local" --build-cache --no-daemon > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Verify generated API types
        working-directory: web
        run: npm run verify:api-types
        env:
          KRAFT_BACKEND_INTERNAL_URL: http://localhost:8080
      - name: Upload API drift diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-types-drift-diagnostics
          path: backend.log
          retention-days: 7

  docker-publish-backend:
    name: Docker Publish (backend)
    runs-on: ubuntu-latest
    needs: [changes, backend-build-test, static-analysis, repository-guards]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-guards.result == 'success' &&
      (needs.backend-build-test.result == 'success' || needs.backend-build-test.result == 'skipped') &&
      (needs.static-analysis.result == 'success' || needs.static-analysis.result == 'skipped')
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Verify required deployment secrets
        env:
          CHECK_DB_PASSWORD: ${{ secrets.KRAFT_DB_PASSWORD }}
          CHECK_REVALIDATE_SECRET: ${{ secrets.KRAFT_REVALIDATE_SECRET }}
          CHECK_OPS_TOKEN: ${{ secrets.KRAFT_OPS_TOKEN }}
        run: |
          missing=()
          [ -z "$CHECK_DB_PASSWORD" ] && missing+=("KRAFT_DB_PASSWORD")
          [ -z "$CHECK_REVALIDATE_SECRET" ] && missing+=("KRAFT_REVALIDATE_SECRET")
          [ -z "$CHECK_OPS_TOKEN" ] && missing+=("KRAFT_OPS_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required secrets are missing: ${missing[*]}"
            exit 1
          fi
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.changes.outputs.backend == 'true'
      - name: Download verified bootJar
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-boot-jar
          path: build/libs
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: needs.changes.outputs.backend == 'true'
      # backend-verified 태그: 이 커밋에서 실제로 빌드·푸시가 성공했다는 사실만 기록하는
      # 태그다 — 이 잡 자체의 결과와 무관하게(예: 다른 컴포넌트의 E2E가 나중에 실패해도)
      # 항상 "가장 최근에 실제로 빌드된 백엔드 소스"를 가리킨다. promote 잡은 오직 전체
      # quality-gate 통과 시에만 :latest를 전진시키므로, 만약 재사용(reuse) 스텝이 예전처럼
      # :latest를 그대로 복제했다면 — 백엔드가 실제로 바뀐 어떤 커밋이 이미지 빌드에는
      # 성공했지만 그 실행의 quality-gate가 무관한 이유로 실패해 promote가 안 됐을 경우 —
      # 그 이후 backend=false인 커밋들이 전부 그 멈춘 :latest만 영원히 복제해 SHA 태그가
      # 실제 소스와 어긋난 채 굳어버린다(실제로 겪음: 운영 DB가 V31 마이그레이션 이전
      # 이미지에 멈춰 배포 실패). backend-verified는 quality-gate 결과와 완전히 분리돼
      # 있어 이 정체를 근본적으로 막는다.
      - name: Assemble and push verified backend artifact
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: prebuilt
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:backend-verified
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime
      # backend-released: 위 backend-verified와 다르다. verified는 "이 소스로 빌드가
      # 성공했다"는 사실만 기록하는 태그라, 이 잡의 needs에 E2E가 없는 이상(의도된
      # 병렬화 — docker-publish-web 주석 참고) 게이트를 통과하지 못한 이미지도 가리킬
      # 수 있다. 그 상태에서 backend=false인 다음 커밋이 verified를 복제하면, 게이트에
      # 떨어진 이미지가 그 커밋의 SHA 태그가 되고 promote를 타고 :latest까지 올라갔다.
      # released는 quality-gate가 "그 컴포넌트 자신의" 게이트만 보고 판정해 advance-
      # released-tags 잡에서만 전진하므로, 재사용 대상은 항상 게이트를 통과한 이미지다.
      # 무관한 컴포넌트의 실패로 태그가 정체되던 예전 :latest 복제 방식의 문제(운영 DB가
      # V31 마이그레이션 이전 이미지에 멈춘 사고)도 함께 피한다 — 판정이 컴포넌트별로
      # 갈라져 있어 web이 깨져도 backend-released는 계속 전진한다.
      - name: Reuse previously released backend image
        if: needs.changes.outputs.backend != 'true'
        run: |
          source="$IMAGE:backend-released"
          if ! docker buildx imagetools inspect "$source" > /dev/null 2>&1; then
            # 부트스트랩(이 태그 도입 후 첫 실행에만 해당). :latest는 정의상 "마지막으로
            # 전체 quality-gate를 통과한 이미지"라 released의 올바른 초기값이다.
            echo "::notice::backend-released가 없어 :latest에서 부트스트랩합니다."
            source="$IMAGE:latest"
          fi
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$source"

  docker-publish-web:
    name: Docker Publish (web)
    runs-on: ubuntu-latest
    # Phase 10 컷오버: web-legacy 대신 web/(재작성 결과물)을 배포 이미지로 빌드한다.
    # 게이트는 backend와 같은 수준(빌드+단위 테스트)으로 좁게 둔다 — e2e까지 기다리지
    # 않는다(docker-publish-backend의 needs와 동일한 패턴). 통합 문제는 CD의
    # smoke-test.sh + 롤백 스크립트가 배포 시점에 잡는다.
    needs: [changes, web-next-build-test, repository-guards]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-guards.result == 'success' &&
      (needs.web-next-build-test.result == 'success' || needs.web-next-build-test.result == 'skipped')
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.changes.outputs.web == 'true'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: needs.changes.outputs.web == 'true'
      # web-verified 태그: backend와 동일한 이유(quality-gate 결과와 무관하게 "실제로
      # 최근에 빌드된 소스"를 계속 정확히 가리키기 위함)로 둔다.
      - name: Build and push web image
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:web-verified
          build-args: |
            KRAFT_PUBLIC_BASE_URL=${{ secrets.KRAFT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY_DESKTOP=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_FREQUENCY_DESKTOP }}
            NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY=${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_STICKY }}
            NEXT_PUBLIC_AD_NETWORK=${{ vars.NEXT_PUBLIC_AD_NETWORK || 'adfit' }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_UNIT_SIDEBAR=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_SIDEBAR }}
            NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY }}
            NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY_MOBILE=${{ secrets.NEXT_PUBLIC_ADSENSE_UNIT_FREQUENCY_MOBILE }}
            NEXT_PUBLIC_ADSENSE_RESERVE_PLACEHOLDER=${{ vars.NEXT_PUBLIC_ADSENSE_RESERVE_PLACEHOLDER || '' }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # web-released: backend-released와 같은 이유·같은 구조다(위 주석 참고).
      # 이 잡의 needs에 E2E 6트랙이 빠져 있는 것은 파이프라인을 짧게 유지하려는
      # 의도적 선택이므로 그대로 두고, "게이트를 통과했는가"는 별도 태그로 표현한다.
      - name: Reuse previously released web image
        if: needs.changes.outputs.web != 'true'
        run: |
          source="$IMAGE:web-released"
          if ! docker buildx imagetools inspect "$source" > /dev/null 2>&1; then
            echo "::notice::web-released가 없어 :latest에서 부트스트랩합니다."
            source="$IMAGE:latest"
          fi
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$source"

  security-scan:
    name: Security Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [changes, docker-publish-backend, docker-publish-web]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-publish-backend.result == 'success' &&
      needs.docker-publish-web.result == 'success'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            changed: ${{ needs.changes.outputs.backend }}
          - component: web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - name: Set image name
        if: matrix.changed == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Scan once for all reportable severities
        if: matrix.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-results.json
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
      - name: Report MEDIUM and block fixable HIGH/CRITICAL
        if: matrix.changed == 'true'
        run: |
          echo "Vulnerability counts:"
          jq -r '
            [.Results[]?.Vulnerabilities[]?]
            | group_by(.Severity)
            | map({severity: .[0].Severity, count: length})
            | .[]
            | "  \(.severity): \(.count)"
          ' trivy-results.json

          echo "MEDIUM findings:"
          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(.Severity == "MEDIUM")
            | "  \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) fixed=\(.FixedVersion // "")"
          ' trivy-results.json

          blocking="$(jq '
            [
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length
          ' trivy-results.json)"
          if (( blocking > 0 )); then
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
              | "::error::\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"
            ' trivy-results.json
            exit 1
          fi
      - name: Reused image already passed its immutable-SHA scan
        if: matrix.changed != 'true'
        run: echo "No component changes; the previously scanned image digest was reused."

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - repository-guards
      - backend-build-test
      - static-analysis
      - web-next-build-test
      - web-next-e2e-proxy
      - web-next-e2e-default
      - web-next-e2e-a11y
      - web-next-e2e-cross-browser
      - web-next-e2e-visual
      - web-next-e2e-responsive
      - web-next-performance-budget
      - api-types-drift-guard
      - docker-publish-backend
      - docker-publish-web
      - security-scan
    if: always()
    timeout-minutes: 5
    # 컴포넌트별 릴리스 판정을 advance-released-tags 잡에 넘긴다. 이 잡이 실패해도
    # (예: web E2E가 깨져 아래 Verify 스텝이 exit 1) 이미 실행을 마친 스텝의 출력은
    # 그대로 남으므로, backend만 통과한 경우 backend-released는 계속 전진할 수 있다 —
    # 무관한 컴포넌트의 실패가 남의 태그를 정체시키지 않게 하는 것이 이 분리의 목적이다.
    outputs:
      backend_released: ${{ steps.release-status.outputs.backend_released }}
      web_released: ${{ steps.release-status.outputs.web_released }}
    steps:
      # 판정과 강제를 두 스텝으로 나눈다 — 한 스텝에서 exit 1로 끝내면 그 뒤에
      # 출력을 쓸 기회가 없다. 이 스텝은 어떤 경우에도 성공으로 끝난다.
      - name: Evaluate per-component release status
        id: release-status
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          GUARDS_RESULT: ${{ needs.repository-guards.result }}
          BACKEND_RESULT: ${{ needs.backend-build-test.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          API_RESULT: ${{ needs.api-types-drift-guard.result }}
          WEB_NEXT_RESULT: ${{ needs.web-next-build-test.result }}
          WEB_NEXT_PROXY_RESULT: ${{ needs.web-next-e2e-proxy.result }}
          WEB_NEXT_DEFAULT_RESULT: ${{ needs.web-next-e2e-default.result }}
          WEB_NEXT_A11Y_RESULT: ${{ needs.web-next-e2e-a11y.result }}
          WEB_NEXT_CROSS_BROWSER_RESULT: ${{ needs.web-next-e2e-cross-browser.result }}
          WEB_NEXT_VISUAL_RESULT: ${{ needs.web-next-e2e-visual.result }}
          WEB_NEXT_RESPONSIVE_RESULT: ${{ needs.web-next-e2e-responsive.result }}
          WEB_NEXT_PERF_RESULT: ${{ needs.web-next-performance-budget.result }}
          BACKEND_IMAGE_RESULT: ${{ needs.docker-publish-backend.result }}
          WEB_IMAGE_RESULT: ${{ needs.docker-publish-web.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          all_success() {
            local result
            for result in "$@"; do
              [[ "$result" == "success" ]] || return 1
            done
            return 0
          }

          # 컴포넌트가 안 바뀐 커밋에서는 재사용 이미지가 곧 직전 released라, released를
          # 그 SHA로 다시 붙이는 것이 같은 digest를 가리키는 멱등 연산이다. 그래서
          # "변경 없음"도 released=true로 둔다 — 태그가 커밋마다 끊기지 않게 하려는 것이다.
          backend_released=false
          if all_success "$GUARDS_RESULT" "$BACKEND_IMAGE_RESULT" "$SECURITY_RESULT"; then
            if [[ "$BACKEND_CHANGED" != "true" ]] \
              || all_success "$BACKEND_RESULT" "$STATIC_RESULT" "$API_RESULT"; then
              backend_released=true
            fi
          fi

          # web은 자기 E2E 6트랙 + 성능 예산까지 통과해야 released다 — docker-publish-web이
          # 이들을 needs로 갖지 않고 먼저 push하기 때문에 여기서 따로 확인해야 한다.
          web_released=false
          if all_success "$GUARDS_RESULT" "$WEB_IMAGE_RESULT" "$SECURITY_RESULT"; then
            if [[ "$WEB_CHANGED" != "true" ]] \
              || all_success "$WEB_NEXT_RESULT" "$WEB_NEXT_PROXY_RESULT" \
                "$WEB_NEXT_DEFAULT_RESULT" "$WEB_NEXT_A11Y_RESULT" \
                "$WEB_NEXT_CROSS_BROWSER_RESULT" "$WEB_NEXT_VISUAL_RESULT" \
                "$WEB_NEXT_RESPONSIVE_RESULT" "$WEB_NEXT_PERF_RESULT"; then
              web_released=true
            fi
          fi

          # push가 아니면(PR) 이미지 자체가 없으므로 태그를 옮길 대상도 없다.
          if [[ "$EVENT_NAME" != "push" ]]; then
            backend_released=false
            web_released=false
          fi

          echo "Release status: backend=$backend_released web=$web_released"
          {
            echo "backend_released=$backend_released"
            echo "web_released=$web_released"
          } >> "$GITHUB_OUTPUT"

      - name: Verify every affected quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          GUARDS_RESULT: ${{ needs.repository-guards.result }}
          BACKEND_RESULT: ${{ needs.backend-build-test.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          API_RESULT: ${{ needs.api-types-drift-guard.result }}
          WEB_NEXT_RESULT: ${{ needs.web-next-build-test.result }}
          WEB_NEXT_PROXY_RESULT: ${{ needs.web-next-e2e-proxy.result }}
          WEB_NEXT_DEFAULT_RESULT: ${{ needs.web-next-e2e-default.result }}
          WEB_NEXT_A11Y_RESULT: ${{ needs.web-next-e2e-a11y.result }}
          WEB_NEXT_CROSS_BROWSER_RESULT: ${{ needs.web-next-e2e-cross-browser.result }}
          WEB_NEXT_VISUAL_RESULT: ${{ needs.web-next-e2e-visual.result }}
          WEB_NEXT_RESPONSIVE_RESULT: ${{ needs.web-next-e2e-responsive.result }}
          WEB_NEXT_PERF_RESULT: ${{ needs.web-next-performance-budget.result }}
          BACKEND_IMAGE_RESULT: ${{ needs.docker-publish-backend.result }}
          WEB_IMAGE_RESULT: ${{ needs.docker-publish-web.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name result is $result"
              exit 1
            fi
          }

          require_success "Repository guards" "$GUARDS_RESULT"
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            require_success "Backend" "$BACKEND_RESULT"
            require_success "Static analysis" "$STATIC_RESULT"
            require_success "API type drift" "$API_RESULT"
          fi
          if [[ "$WEB_CHANGED" == "true" ]]; then
            require_success "Web (재작성 프론트엔드)" "$WEB_NEXT_RESULT"
            require_success "Web E2E (CSP·/ops 게이트)" "$WEB_NEXT_PROXY_RESULT"
            require_success "Web E2E (주요 흐름)" "$WEB_NEXT_DEFAULT_RESULT"
            require_success "Web E2E (접근성)" "$WEB_NEXT_A11Y_RESULT"
            require_success "Web E2E (크로스브라우저)" "$WEB_NEXT_CROSS_BROWSER_RESULT"
            require_success "Web E2E (시각 회귀)" "$WEB_NEXT_VISUAL_RESULT"
            require_success "Web E2E (반응형 단언)" "$WEB_NEXT_RESPONSIVE_RESULT"
            require_success "Web Performance Budget" "$WEB_NEXT_PERF_RESULT"
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            require_success "Backend image" "$BACKEND_IMAGE_RESULT"
            require_success "Web image" "$WEB_IMAGE_RESULT"
            require_success "Image security scans" "$SECURITY_RESULT"
          fi

  advance-released-tags:
    name: Advance released tags
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-publish-backend, docker-publish-web]
    # quality-gate가 실패해도(= :latest는 전진하지 않아도) 돌아야 한다. web E2E 하나가
    # 깨졌을 때 backend-released까지 같이 멈추면, 그 뒤 backend=false 커밋들이 계속
    # 낡은 backend 이미지를 복제하는 정체가 다시 생긴다(ci.yml의 backend-verified 주석이
    # 기록한 V31 사고와 같은 형태). 그래서 promote와 달리 quality-gate 결과를 조건에
    # 넣지 않고, 컴포넌트별 판정(quality-gate outputs)만 보고 각자 전진시킨다.
    # promote 잡 주석의 다이아몬드 needs 이슈가 여기에도 그대로 적용돼 always()가 필수다.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-publish-backend.result == 'success' &&
      needs.docker-publish-web.result == 'success'
    timeout-minutes: 8
    permissions:
      packages: write
    steps:
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance backend-released
        if: needs.quality-gate.outputs.backend_released == 'true'
        run: docker buildx imagetools create --tag "$BACKEND_IMAGE:backend-released" "$BACKEND_IMAGE:$GITHUB_SHA"
      - name: Advance web-released
        if: needs.quality-gate.outputs.web_released == 'true'
        run: docker buildx imagetools create --tag "$WEB_IMAGE:web-released" "$WEB_IMAGE:$GITHUB_SHA"

  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-publish-backend, docker-publish-web]
    # quality-gate도 docker-publish-backend·docker-publish-web을 needs로 가진 다이아몬드
    # 구조인 데다 quality-gate가 always()로 뜬다 — 이 조합에서 GitHub Actions가 이 잡의
    # 암묵적 success() 평가(needs 전체가 성공해야 한다는 기본 규칙)를 잘못 계산해, 세
    # needs가 실제로는 모두 success인데도 이 잡이 skipped로 떨어지는 것을 여러 차례
    # 실측했다(needs.*.result가 API상 전부 "success"인데도). always()를 명시해 기본
    # 암묵적 success() 검사에 기대지 않고, 세 needs를 직접 다 확인한다.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality-gate.result == 'success' &&
      needs.docker-publish-backend.result == 'success' &&
      needs.docker-publish-web.result == 'success'
    timeout-minutes: 8
    permissions:
      packages: write
    steps:
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both immutable images in parallel
        run: |
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:$GITHUB_SHA" &
          backend_pid=$!
          docker buildx imagetools create \
            --tag "$WEB_IMAGE:latest" "$WEB_IMAGE:$GITHUB_SHA" &
          web_pid=$!
          wait "$backend_pid"
          wait "$web_pid"
