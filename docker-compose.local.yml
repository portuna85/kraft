services:
  mariadb:
    ports:
      - "3306:3306"

  backend:
    ports:
      - "8080:8080"
    # OAuth 로그인을 로컬에서 켜려면 SPRING_PROFILES_ACTIVE와 4개 client id/secret 변수를
    # .env에서 설정한다(docker-compose.yml의 backend-common-env가 이미 전달함) — .env.example 참고.
    environment:
      KRAFT_PUBLIC_BASE_URL: ${KRAFT_PUBLIC_BASE_URL:-http://localhost}

  web:
    ports:
      - "3000:3000"
    environment:
      KRAFT_PUBLIC_BASE_URL: ${KRAFT_PUBLIC_BASE_URL:-http://localhost}

  # 로컬 OAuth2 로그인 개발용 동일 출처(same-origin) 진입점(§4.5). backend:8080/web:3000을
  # http://localhost 하나로 묶는다 — Next 라우트 핸들러 프록시(backend-proxy.ts)는
  # Set-Cookie를 전달하지 않아 이 경로로는 세션 쿠키가 확정적으로 소실되기 때문이다.
  caddy:
    image: caddy:2-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    container_name: kraft-caddy-local
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - "/tmp:size=16m,noexec,nosuid"
      - "/data:size=16m"
      - "/config:size=16m"
    # 80 바인드에 NET_BIND_SERVICE가 필요하다(docker-compose.prod.yml의 caddy와 동일 근거,
    # 실측 확인됨). 로컬 전용이라 /data·/config는 인증서 영속화가 필요 없어 tmpfs로 충분하다.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
