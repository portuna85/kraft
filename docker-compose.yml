# 개발용 MariaDB만 띄운다. 앱은 호스트에서 직접 실행한다(.\gradlew.bat bootRun).
#   docker compose up -d --wait
# 접속 정보는 .env에서 환경변수로 주입한다(.env.example 참고). gradlew test는 이 컨테이너와
# 무관하다 — test 프로파일이 H2 인메모리를 쓴다(application-test.yml, build.gradle.kts).
name: kraft

services:
  mariadb:
    # 기존 볼륨이 사용하던 버전을 유지한다. 업그레이드는 백업·호환성 검증 후 별도로 진행한다.
    image: mariadb:11.7.2
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - kraft-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 40s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  kraft-mariadb-data:
    # 기존 Compose 볼륨을 그대로 연결한다.
    name: kraft_kraft-mariadb-data
