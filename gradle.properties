org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# CI-MAINT-01(docs/improvement.md): Gradle 데몬/클라이언트 JVM 자체의 힙을 지정하지
# 않으면 플랫폼 기본값에 맡겨진다 — build.gradle.kts:138의 테스트 워커 maxHeapSize=2g와
# 별개 예산이다(테스트 워커는 forked JVM, 이건 빌드를 orchestration하는 JVM). CI가
# -PtestWorkers=2로 테스트 워커를 최대 2개 병렬 포크하므로(2g×2=4g) 이 값을 그 이상으로
# 올리지 않는다 — 7GB 러너에서 4g(워커) + 2g(이 값) 조합이면 여유가 남는다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
