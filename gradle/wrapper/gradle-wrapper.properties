distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# validateDistributionUrl만으로는 그 URL이 내려주는 바이트가 변조되지 않았음을 보장하지
# 못한다(O07). Gradle 공식 체크섬(https://gradle.org/release-checksums/,
# services.gradle.org/distributions/gradle-9.7.1-bin.zip.sha256 두 곳에서 대조해 일치를
# 확인한 값)을 더해, 다운로드한 배포물의 SHA-256이 어긋나면 빌드가 거부되게 한다.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
