global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "kraft-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: kraft-backend

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # OBS-PROM-01(docs/improvement.md): 이전에는 mariadb를 직접 스크랩하지 않았다 —
  # DB 커넥션 포화·쿼리 지연을 Caddy 엣지 카운터로만 간접 추정할 수 있었다.
  - job_name: "mariadb"
    static_configs:
      - targets: ["mariadb-exporter:9104"]

  - job_name: "caddy"
    static_configs:
      # 2020: Caddyfile의 전용 metrics-only 리스너(admin API 2019는 loopback 전용으로 유지).
      - targets: ["caddy:2020"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
