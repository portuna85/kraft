groups:
  - name: kraft_backend
    rules:
      - alert: BackendDown
        expr: up{job="kraft-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          title: "백엔드 다운"
          summary: "KRAFT 백엔드가 응답하지 않습니다"
          description: "백엔드가 1분 이상 응답하지 않고 있습니다."
          runbook: "docker compose -f docker-compose.prod.yml logs --tail=200 backend; docker compose -f docker-compose.prod.yml ps backend"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..",job="kraft-backend"}[5m]))
          / sum(rate(http_server_requests_seconds_count{job="kraft-backend"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          title: "5xx 에러율 급증"
          summary: "5xx 에러율이 높습니다 ({{ $value | humanizePercentage }})"
          description: "백엔드 5xx 에러율이 5%를 초과한 상태가 2분 이상 지속되고 있습니다."
          runbook: "docker compose -f docker-compose.prod.yml logs --tail=200 backend | grep -i error; Grafana에서 status=~\"5..\" 대시보드로 어느 경로가 원인인지 확인"

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{job="kraft-backend"}[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "응답 지연"
          summary: "P95 응답 시간이 2초를 초과했습니다"
          description: "95번째 백분위 응답 시간이 5분 이상 2초를 초과하고 있습니다."
          runbook: "Grafana에서 어느 경로/DB 쿼리가 느려졌는지 확인; HikariCP 커넥션 풀 포화(kraft_ops 대시보드) 여부 확인"

      - alert: HighHeapUsage
        expr: |
          jvm_memory_used_bytes{area="heap",job="kraft-backend"}
          / jvm_memory_max_bytes{area="heap",job="kraft-backend"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "JVM 힙 사용량 과다"
          summary: "JVM 힙 사용량이 85%를 초과했습니다"
          description: "JVM 힙 메모리 사용률이 5분 이상 85%를 초과하고 있습니다."
          runbook: "GC 로그·heap dump 확인 필요 시 docker compose exec backend jcmd 1 GC.heap_info; 지속되면 backend 재기동 고려"

      - alert: KraftLottoDataStale
        expr: kraft_lotto_data_stale_days{job="kraft-backend"} >= 1
        for: 30m
        labels:
          severity: critical
        annotations:
          title: "로또 회차 데이터 지연"
          summary: "KRAFT Lotto 데이터가 최신 회차보다 지연됨"
          description: "kraft_lotto_data_stale_days가 1일 이상 지속됨. 최신 회차={{ $labels.instance }}, 자동 수집 또는 외부 소스 점검 필요."
          # TD-007: scripts/server에는 수집 스케줄러가 없다. 자동 수집은 backend 컨테이너 내부
          # Spring @Scheduled 빈(WinningNumberAutoCollectScheduler)이라 로그도 backend 애플리케이션
          # 로그에 남는다.
          runbook: "kraft_lotto_external_collect_failures_total 추이 확인; docker compose -f docker-compose.prod.yml logs backend | grep WinningNumberAutoCollectScheduler로 자동 수집 로그 확인 후 필요 시 /ops에서 수동 수집(POST /ops/collect/latest) 트리거"

      - alert: KraftLottoWinningDataMissing
        expr: kraft_lotto_winning_data_present{job="kraft-backend"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          title: "당첨번호 데이터 누락"
          summary: "로또 당첨번호 DB가 완전히 비어 있음"
          description: "kraft_lotto_winning_data_present가 15분 이상 0을 유지함. staleDays가 0으로 나와 겉으로는 최신처럼 보이므로 이 지표로만 감지된다 — 초기 시딩 실패 또는 DB 손상 가능성."
          runbook: "SELECT COUNT(*) FROM winning_numbers로 실제 DB 상태 확인; 비어있다면 scripts/db-restore-drill.sh로 최근 백업 복원 가능성부터 확인"

      - alert: KraftLottoStatisticsLagging
        expr: kraft_lotto_latest_round{job="kraft-backend"} - kraft_lotto_statistics_projected_round{job="kraft-backend"} >= 1
        for: 6h
        labels:
          severity: warning
        annotations:
          title: "통계 요약 지연"
          summary: "통계 summary가 최신 회차보다 뒤처짐"
          description: "kraft_lotto_latest_round와 kraft_lotto_statistics_projected_round의 차이가 6시간 이상 1 이상 유지됨. 수동 보정 이벤트 발행 실패나 재조정 스케줄러 점검 필요."
          # TD-007: /ops에는 summary 재구축 엔드포인트가 없다(의도적으로 두지 않음). 재조정은
          # StatisticsReconciliationScheduler가 매주 일요일 07:35(Asia/Seoul) 자동 수집 직후
          # 자동으로 수행한다 — self-service 수동 트리거는 없으므로 즉시 조치가 필요하면
          # 엔지니어링 에스컬레이션이 필요하다.
          runbook: "statistics_summary_rebuild_total{outcome=\"failure\"} 확인; 재조정은 매주 일요일 07:35(Asia/Seoul)에 자동 실행됨(StatisticsReconciliationScheduler) — self-service 수동 트리거는 없으므로 즉시 조치가 필요하면 엔지니어링에 에스컬레이션"

      - alert: KraftLottoExternalCollectFailing
        expr: increase(kraft_lotto_external_collect_failures_total{job="kraft-backend"}[1h]) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "외부 회차 수집 실패"
          summary: "외부 회차 수집이 반복 실패 중"
          description: "최근 1시간 동안 외부 회차 수집 실패가 3회 이상 발생함."
          runbook: "docker compose -f docker-compose.prod.yml logs backend | grep -i 'external.*collect'; 외부 소스 URL·응답 스키마 변경 여부 확인"

  - name: kraft_recommend
    rules:
      - alert: KraftLottoHistoryNotReady
        expr: kraft_lotto_history_ready{job="kraft-backend"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          title: "추천 이력 미준비"
          summary: "추천 이력 데이터가 준비되지 않음"
          description: "kraft_lotto_history_ready가 10분 이상 0을 유지함. 추천 API가 503으로 거절 중일 수 있음. kraft_lotto_history_data_present가 0이면 이력이 완전히 비어 있는 것이고, 1이면 1회부터 최신까지 중간에 누락된 회차가 있는 것이다."
          # TD-007: 등록된 메트릭명은 kraft_lotto_first_missing_round다(history_ 접두어 없음,
          # LottoRecommendationService에서 등록).
          runbook: "kraft_lotto_history_data_present와 kraft_lotto_first_missing_round 확인해 완전 결손인지 부분 누락인지 판별 후 백필 필요 여부 결정"

      # kraft_lotto_history_snapshot_age_seconds는 재기동 또는 당첨번호 수집 이벤트에서만
      # 갱신된다 — 회차 추첨은 주 1회라 정상 운영 중에도 이 값은 며칠씩 쌓인다. 예전 규칙은
      # 이 값에 15분 임계값을 걸어, 배포·재기동 직후 15분만 지나면 항상 발화하는 상시
      # 오탐이었다(2026-08-12 배포 직후 실측 확인). 이 규칙이 실제로 잡으려던 것(runbook의
      # "db_version과 snapshot_version을 비교"가 원래 의도)은 나이가 아니라 "DB에는 새
      # 버전이 있는데 메모리 스냅샷이 못 따라간 상태"(비동기 리스너가 조용히 실패)다 —
      # 두 버전을 직접 비교한다. db_version < 0(DB 조회 자체 실패)은 별도 인프라 경보가
      # 이미 다루므로 여기서는 제외해 중복 발화를 피한다.
      - alert: KraftLottoHistorySnapshotStale
        expr: |
          kraft_lotto_history_db_version{job="kraft-backend"} >= 0
          and
          kraft_lotto_history_db_version{job="kraft-backend"} != kraft_lotto_history_snapshot_version{job="kraft-backend"}
        for: 30m
        labels:
          severity: warning
        annotations:
          title: "추천 이력 스냅샷 버전 불일치"
          summary: "추천 이력 스냅샷이 DB 최신 버전을 따라가지 못함"
          description: "kraft_lotto_history_db_version과 kraft_lotto_history_snapshot_version이 30분 이상 다름. DB에는 새 당첨 이력이 반영됐는데 메모리 스냅샷이 갱신되지 않은 상태 — 수집 이벤트 리스너(WinningNumbersCollectedEvent)가 조용히 실패했을 수 있음."
          runbook: "docker compose -f docker-compose.prod.yml logs --tail=200 backend에서 이력 갱신 실패 원인을 확인; 수집 재호출은 변경 없는 회차의 스냅샷을 갱신하지 않으므로 즉시 복구가 필요하면 docker compose -f docker-compose.prod.yml restart backend 후 readiness와 두 버전 지표가 일치하는지 확인"

      - alert: KraftLottoRecommendHighErrorRate
        expr: |
          sum(rate(kraft_lotto_recommend_failures_total{job="kraft-backend"}[10m]))
          / sum(rate(kraft_lotto_recommend_requests_total{job="kraft-backend"}[10m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "추천 API 실패율 급증"
          summary: "추천 API 실패율 5% 초과"
          description: "최근 10분 추천 요청 대비 실패 비율이 5%를 넘는 상태가 5분 이상 지속됨."
          runbook: "kraft_lotto_history_ready와 함께 확인 — 이력 미준비로 인한 fail-closed 거부인지, 다른 원인인지 구분"

      - alert: KraftLottoRecommendHighCollisionRate
        expr: rate(kraft_lotto_recommend_historical_collisions_total{job="kraft-backend"}[10m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          title: "추천 1등 충돌 급증"
          summary: "추천 생성 시 과거 1등 충돌이 급증"
          description: "과거 1등 조합과의 충돌율이 높음. 제외 번호 조건이 지나치게 좁을 가능성이 있음."
          runbook: "요청 패턴(제외 번호 개수 분포) 확인 — 클라이언트가 비정상적으로 많은 번호를 제외 요청하는지 점검"

      - alert: KraftLottoRevalidateFailing
        expr: increase(kraft_lotto_revalidate_failures_total{job="kraft-backend"}[1h]) >= 5
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "ISR 재검증 실패"
          summary: "ISR revalidation 요청이 반복 실패 중"
          description: "최근 1시간 동안 revalidation 요청 실패가 5회 이상 발생함. web 컨테이너 또는 revalidate secret 점검 필요."
          runbook: "docker compose -f docker-compose.prod.yml logs web | grep -i revalidate; KRAFT_REVALIDATE_SECRET 양쪽(backend/web) 일치 여부 확인"

  - name: kraft_ops
    rules:
      - alert: KraftStatisticsSummaryRebuildFailing
        expr: increase(statistics_summary_rebuild_total{job="kraft-backend",outcome="failure"}[1h]) >= 1
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "통계 재구축 실패"
          summary: "통계 summary 재구축이 실패함"
          description: "최근 1시간 동안 summary rebuild가 실패로 기록됨."
          runbook: "docker compose -f docker-compose.prod.yml logs backend | grep -i 'summary.*rebuild'로 예외 스택 확인"

      - alert: KraftAdminLockoutSpike
        expr: increase(kraft_admin_lockout_total{job="kraft-backend"}[15m]) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "관리자 로그인 잠금 급증"
          summary: "관리자 로그인 lockout이 급증"
          description: "최근 15분 동안 lockout으로 거부된 로그인 시도가 3회 이상 발생함. brute-force 시도 가능성."
          runbook: "admin_audit_log에서 실패 시도 IP·계정 확인; 필요 시 KRAFT_ADMIN_ALLOWED_CIDR로 접근 자체를 더 좁힘"

      - alert: KraftBackupStale
        expr: time() - kraft_backup_last_success_timestamp_seconds > 90000
        for: 0m
        labels:
          severity: critical
        annotations:
          title: "DB 백업 지연"
          summary: "DB 백업이 25시간 이상 성공하지 못함"
          description: "kraft_backup_last_success_timestamp_seconds 기준 마지막 성공 백업이 25시간을 초과함."
          runbook: "crontab -l로 백업 스케줄 등록 확인; bash scripts/db-backup.sh를 서버에서 직접 실행해 실패 원인(디스크 공간 등) 확인"

      - alert: KraftBackupRemoteStale
        expr: time() - kraft_backup_last_remote_success_timestamp_seconds > 90000
        for: 0m
        labels:
          severity: critical
        annotations:
          title: "오프사이트 백업 지연"
          summary: "오프사이트 DB 백업 사본이 25시간 이상 갱신되지 않음"
          description: "kraft_backup_last_remote_success_timestamp_seconds 기준 마지막 성공 원격 복사가 25시간을 초과함. 로컬 백업(KraftBackupStale)은 정상일 수 있음 — 이 경보는 오프사이트 사본만 본다."
          runbook: "BACKUP_REMOTE_DEST가 /etc/kraft/backup.env에 설정돼 있는지, rclone이 설치돼 있는지 서버에서 확인; bash scripts/db-backup.sh를 직접 실행해 [FAIL]/[WARN] 로그로 원인 파악"

      # H-06: KraftBackupStale/KraftBackupRemoteStale은 plain `>` 비교라, 메트릭이 한 번도
      # 안 찍히면(예: node-exporter textfile collector 미설정, 첫 배포 직후 백업이 한 번도
      # 성공한 적 없음) 시계열 자체가 없어 조용히 무경보였다. absent()는 "오래됨"과 "한
      # 번도 없음"을 구분해야 운영자가 원인(지연 vs 미설정)을 헷갈리지 않으므로 별도
      # sibling 규칙으로 둔다(기존 Stale 규칙의 의미는 그대로 보존).
      - alert: KraftBackupMetricMissing
        expr: absent(kraft_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
        annotations:
          title: "DB 백업 메트릭 없음"
          summary: "kraft_backup_last_success_timestamp_seconds 메트릭이 전혀 수집되지 않음"
          description: "node-exporter textfile collector 미설정이거나 db-backup.sh가 한 번도 실행/완료되지 않았을 수 있음."
          runbook: "서버에서 NODE_EXPORTER_TEXTFILE_DIR 설정 확인; crontab -l로 db-backup.sh 스케줄 등록 확인; bash scripts/db-backup.sh 직접 실행"

      - alert: KraftBackupRemoteMetricMissing
        expr: absent(kraft_backup_last_remote_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          title: "오프사이트 DB 백업 메트릭 없음"
          summary: "kraft_backup_last_remote_success_timestamp_seconds 메트릭이 전혀 수집되지 않음"
          description: "BACKUP_MODE=local-only(오프사이트 미사용)이면 정상적으로 이 시계열이 없다. offsite-required로 설정했는데도 이 경보가 뜨면 원격 업로드가 한 번도 성공한 적 없다는 뜻."
          runbook: "/etc/kraft/backup.env의 BACKUP_MODE·BACKUP_REMOTE_DEST 확인; bash scripts/db-backup.sh 직접 실행해 [FAIL]/[WARN] 로그 확인"

      - alert: KraftBackupFailed
        expr: kraft_backup_last_status == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          title: "DB 백업 실패"
          summary: "가장 최근 DB 백업 시도가 실패함"
          description: "kraft_backup_last_status가 0 — 25시간 stale 임계값을 기다리지 않고 마지막 시도 실패를 즉시 알린다."
          runbook: "bash scripts/db-backup.sh를 서버에서 직접 실행해 실패 원인(디스크 공간, mariadb-dump 오류 등) 확인"

      - alert: KraftCaddyDataBackupRemoteStale
        expr: time() - kraft_caddy_data_backup_last_remote_success_timestamp_seconds > 90000
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "오프사이트 Caddy 데이터 백업 지연"
          summary: "오프사이트 caddy-data(ACME 인증서) 백업 사본이 25시간 이상 갱신되지 않음"
          description: "kraft_caddy_data_backup_last_remote_success_timestamp_seconds 기준 마지막 성공 원격 복사가 25시간을 초과함."
          runbook: "BACKUP_REMOTE_DEST/BACKUP_MODE 확인 후 bash scripts/caddy-data-backup.sh 직접 실행해 [FAIL]/[WARN] 로그 확인"

      - alert: KraftCaddyDataBackupRemoteMetricMissing
        expr: absent(kraft_caddy_data_backup_last_remote_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          title: "오프사이트 Caddy 데이터 백업 메트릭 없음"
          summary: "kraft_caddy_data_backup_last_remote_success_timestamp_seconds 메트릭이 전혀 수집되지 않음"
          description: "BACKUP_MODE=local-only면 정상. offsite-required인데도 뜨면 caddy-data 원격 업로드가 한 번도 성공한 적 없다는 뜻."
          runbook: "/etc/kraft/backup.env 확인; bash scripts/caddy-data-backup.sh 직접 실행"

      # M-13: 복원 드릴(scripts/db-restore-drill.sh)은 배포 호스트에서 수동/주기 실행될
      # 때만 메트릭을 남긴다(GitHub Actions 실행 환경은 textfile collector 디렉터리가 없어
      # 자연히 건너뜀). 이 드릴은 아직 cron으로 강제 스케줄링하지 않은 선택 기능이라
      # H-06의 백업 메트릭과 달리 absent() "한 번도 안 찍힘" 알림은 두지 않는다 — 정기
      # 실행을 설정하지 않은 서버에서까지 계속 울리는 알림이 되어 버린다. 대신 실제로
      # 드릴을 돌렸는데 실패한 경우만 알린다.
      - alert: KraftRestoreDrillFailed
        expr: kraft_backup_restore_drill_last_status == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          title: "복원 드릴 실패"
          summary: "가장 최근 DB 복원 드릴이 실패함"
          description: "kraft_backup_restore_drill_last_status가 0 — 백업이 실제로 복원 가능한지 확인이 실패했다."
          runbook: "bash scripts/db-restore-drill.sh를 서버에서 직접 실행해 실패 원인(스키마 손상, Flyway 버전 불일치 등) 확인"

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          title: "node-exporter 다운"
          summary: "node-exporter가 응답하지 않음"
          description: "node-exporter가 2분 이상 scrape 실패. 이 익스포터가 죽으면 KraftBackupStale/KraftBackupRemoteStale/NodeFilesystemLowSpace가 데이터 없이 조용히 무경보 상태가 될 수 있다."
          runbook: "docker compose -f docker-compose.prod.yml logs --tail=200 node-exporter; docker compose -f docker-compose.prod.yml ps node-exporter로 컨테이너 상태 확인"

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          title: "감시 파이프라인 생존 신호(Watchdog)"
          summary: "Alertmanager/Prometheus 경보 파이프라인 생존 확인용 상시 발화 경보"
          description: "이 경보는 항상 발화 상태다. heartbeat 수신자로만 라우팅되며, 외부 heartbeat 서비스가 일정 시간 이 경보를 못 받으면 그쪽에서 별도로 알린다. Prometheus/Alertmanager가 동시에 죽으면 다른 어떤 경보도 전달되지 않으므로 이 경로가 마지막 안전망이다."
          runbook: "이 경보가 Discord 채널 대신 heartbeat 채널에만 뜨는지 확인(alertmanager.yml.tmpl의 라우팅); 외부 heartbeat 서비스 대시보드에서 최근 핑 수신 시각 확인"

      - alert: NodeFilesystemLowSpace
        expr: |
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
          / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          title: "디스크 여유 공간 부족"
          summary: "서버 디스크 여유 공간이 10% 미만"
          description: "루트 파일시스템 여유 공간이 10% 미만인 상태가 15분 이상 지속됨."
          runbook: "docker system df && du -sh /var/backups/kraft — 오래된 이미지/백업 정리(백업 보존 정책은 db-backup.sh의 RETENTION_DAYS)"

      - alert: CaddyDown
        expr: up{job="caddy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          title: "Caddy 다운"
          summary: "Caddy가 응답하지 않음"
          description: "Caddy admin metrics endpoint가 2분 이상 scrape 실패."
          runbook: "docker compose -f docker-compose.prod.yml logs --tail=200 caddy; Caddyfile 문법 오류 여부 확인(가장 흔한 원인)"

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          title: "Prometheus 다운"
          summary: "Prometheus self-scrape 실패"
          description: "Prometheus 자체 /metrics가 2분 이상 응답하지 않음."
          runbook: "docker compose -f docker-compose.prod.yml logs prometheus; 이 경보가 안 오면 Grafana에서 직접 up{job=\"prometheus\"} 확인"

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          title: "Alertmanager 다운"
          summary: "Alertmanager가 응답하지 않음"
          description: "Alertmanager가 2분 이상 scrape 실패. 이 경보 자체가 전달되지 않을 수 있으니 별도 채널로 상태를 확인해야 함."
          runbook: "docker compose -f docker-compose.prod.yml logs alertmanager; Discord webhook URL 만료 여부 별도 확인(이 경보로는 전달 안 될 수 있음)"

  - name: kraft_community
    rules:
      - alert: KraftCommunityOAuthLoginFailureSpike
        expr: increase(kraft_community_oauth_login_total{job="kraft-backend",outcome="failure"}[15m]) >= 10
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "커뮤니티 OAuth 로그인 실패 급증"
          summary: "커뮤니티 OAuth 로그인 실패가 급증"
          description: "최근 15분 동안 OAuth 로그인 실패가 10회 이상 발생함. provider({{ $labels.provider }}) 장애나 misconfiguration 가능성."
          runbook: "provider 상태 페이지 확인(Google/Naver); KRAFT_COMMUNITY_*_CLIENT_ID/SECRET 만료·변경 여부 확인"

      - alert: KraftCommunityWriteAbuseSuspected
        expr: |
          increase(kraft_community_csrf_rejected_total{job="kraft-backend"}[15m]) >= 20
          or increase(kraft_community_post_version_conflict_total{job="kraft-backend"}[15m]) >= 30
        for: 0m
        labels:
          severity: warning
        annotations:
          title: "커뮤니티 쓰기 어뷰징 의심"
          summary: "커뮤니티 쓰기 API에서 비정상 트래픽 의심"
          description: "CSRF 거부 또는 낙관적 잠금 409가 짧은 시간에 급증함. 어뷰징 시도이거나 클라이언트 버그일 수 있음."
          runbook: "출처 IP 분포 확인(Grafana); 심하면 CommunityWriteRateLimitFilter의 writeRateLimitPerMinute 임시 하향 조정"

  # Phase 10 컷오버 관찰용(§24.4 롤백 트리거) — web:3000·backend:8080이 Caddy 안에서
  # 같은 서버 블록을 공유해 앱별로 못 나눈다. 사이트 전체 값이라 backend 쪽 문제로도
  # 울릴 수 있지만, 컷오버 직후 그 시점엔 backend 이미지가 그대로이므로 이 알림이
  # 뜨면 web/ 배포를 먼저 의심한다.
  - name: kraft_edge
    rules:
      - alert: EdgeHighErrorRate
        expr: |
          sum(rate(caddy_http_requests_total{job="caddy",code=~"5.."}[5m]))
          / sum(rate(caddy_http_requests_total{job="caddy"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          title: "엣지 5xx 에러율 급증"
          summary: "Caddy가 보는 사이트 전체 5xx 에러율이 높습니다 ({{ $value | humanizePercentage }})"
          description: "사이트 전체(web+backend) 5xx 에러율이 5%를 초과한 상태가 2분 이상 지속되고 있습니다."
          runbook: "Grafana 엣지 패널로 backend HighErrorRate와 동시에 뜨는지 확인 — 아니라면 web/ 배포가 원인일 가능성이 높다. 필요시 scripts/deploy/rollback.sh web <이전 이미지>."

      - alert: EdgeSlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(caddy_http_request_duration_seconds_bucket{job="caddy"}[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "엣지 응답 지연"
          summary: "Caddy가 보는 사이트 전체 P95 응답 시간이 2초를 초과했습니다"
          description: "95번째 백분위 응답 시간이 5분 이상 2초를 초과하고 있습니다."
          runbook: "Grafana 엣지 패널로 backend SlowResponseTime과 동시에 뜨는지 확인 — 아니라면 web/ 배포가 원인일 가능성이 높다."
