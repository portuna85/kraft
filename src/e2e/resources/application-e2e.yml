# Playwright E2E 전용 프로파일. Docker(MariaDB)도 SMTP도 없이 떠야 하므로 H2 인메모리와 가짜 메일 발송기를 쓴다. --spring.profiles.active=e2e로 명시할 때만 활성화되고,
# 이 프로파일에만 있는 빈(E2eDataInitializer, RecordingEmailSender, E2eMailController)은 @Profile("e2e")로 잠갔다. test 프로파일을 재사용하지 않는 이유: application-test.yml은
# 테스트 런타임 클래스패스에만 있어 java -jar로 띄운 JAR에서는 보이지 않는다. 이 설정과 시드·가짜 메일 빈은 bootE2eJar에만 들어가고 운영 bootJar에는 없다.
server:
  # 개발 중 띄워 둔 bootRun(기본 8080)과 부딪히지 않게 한 칸 옆으로 둔다.
  port: 8081

spring:
  datasource:
    # DB_CLOSE_DELAY=-1: 마지막 커넥션이 닫혀도 JVM이 살아 있는 동안 DB를 유지한다. MODE=MariaDB가 흉내 내지 못하는 것은 application-test.yml 주석 참고.
    url: jdbc:h2:mem:kraft-e2e;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  session:
    jdbc:
      # H2용 세션 스키마를 Spring Session이 알아서 잡는다(local의 MariaDB 전용 지정과 무관).
      initialize-schema: always

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: warn

app:
  # playwright.config.js의 baseURL과 호스트 문자열까지 맞춘다 — "localhost"와 "127.0.0.1"은 브라우저에 다른 출처라, 메일 링크가 다르면 로그인 세션 쿠키가 실리지 않아
  # 인증 성공이 세션 권한을 즉시 갱신하는 흐름을 검증하지 못한다.
  base-url: http://127.0.0.1:8081
  # 여러 spec이 같은 IP(로컬 호스트)에서 로그인·가입을 반복하므로 꺼 둔다.
  auth:
    min-response-millis: 0
    rate-limit:
      enabled: false
  # 같은 이유 — 여러 spec이 게시글·댓글·업로드·검색을 반복한다.
  write:
    rate-limit:
      enabled: false
  upload:
    dir: build/e2e-uploads
    # 주기 정리 작업이 테스트 도중 업로드 파일을 치우면 검증이 흔들린다.
    cleanup-enabled: false
  verification:
    purge-enabled: false
  security:
    email-encryption-key: e2e-only-key-not-a-secret
    email-hash-pepper: e2e-only-hash-pepper-not-a-secret
  recommend:
    # 이 스케줄러는 절대 시각(cron)이라 initial-delay로 미룰 수 없다 — 겹치면 e2e 도중 외부 동행복권 사이트로 실제 요청을 보낸다.
    auto-fetch:
      enabled: false
