# Docker(docker-compose.yml)로 띄운 실제 MariaDB에 연결해 로컬 브라우저로 직접 검증하기 위한
# 프로파일. `local`(H2 인메모리)과 달리 진짜 MariaDB를 쓰고, 이메일도 SmtpEmailSender로 실제
# 발송한다(2026-09-11부터) — DB와 마찬가지로 "실제 서비스처럼" 눈으로 검증하기 위해서다.
#
# 실행 전: docker compose up -d 로 MariaDB를 먼저 띄우고, .env의 값을 셸 환경변수로 로드한 뒤
# (`set -a; source .env; set +a`) --spring.profiles.active=docker로 bootRun 한다.
# `prod`와 달리 ddl-auto: create-drop을 써서 매 실행마다 스키마를 새로 만든다 — 운영 스키마
# 마이그레이션 없이 빠르게 눈으로 확인하는 용도이므로, 이 프로파일을 실제 운영에 쓰면 안 된다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: false

  session:
    jdbc:
      initialize-schema: always

  thymeleaf:
    cache: false

  # 실제 SMTP로 인증 메일을 보낸다(SmtpEmailSender). 값이 없으면 발송 시점에만 실패하고
  # 기동 자체는 실패하지 않는다(JavaMailSenderImpl은 연결을 지연 생성한다) — DB_URL과 달리
  # 이 값이 빠졌다고 앱이 죽지는 않으니, 회원가입 후 로그에서 발송 실패를 직접 확인해야 한다.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY}
  base-url: ${APP_BASE_URL}
