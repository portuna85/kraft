# Docker(docker-compose.yml)로 띄운 실제 MariaDB에 연결해 로컬 브라우저로 직접 검증하기 위한
# 프로파일. `local`(H2 인메모리)과 달리 진짜 MariaDB를 쓴다는 점만 다르고, 나머지는 로컬 개발
# 편의(스키마 자동 생성, Thymeleaf 캐시 끔, ConsoleEmailSender 재사용)를 그대로 따른다.
#
# 실행 전: docker compose up -d 로 MariaDB를 먼저 띄우고, .env의 값을 셸 환경변수로 로드한 뒤
# (`set -a; source .env; set +a`) --spring.profiles.active=docker로 bootRun 한다.
# `prod`와 달리 ddl-auto: create-drop을 써서 매 실행마다 스키마를 새로 만든다 — 운영 스키마
# 마이그레이션 없이 빠르게 눈으로 확인하는 용도이므로, 이 프로파일을 실제 운영에 쓰면 안 된다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: false

  session:
    jdbc:
      initialize-schema: always

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY}
  base-url: ${APP_BASE_URL}
