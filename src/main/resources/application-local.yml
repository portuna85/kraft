# 로컬 개발 프로파일. spring.profiles.default=local이라 ./gradlew bootRun만 해도 적용된다. 운영과 같은 DB 엔진으로 검증하도록
# docker-compose.yml의 MariaDB를 쓴다(gradlew test는 test 프로파일의 H2 인메모리).
#
# 실행 전: 루트 .env를 준비하고 docker compose up -d --wait mariadb 로 DB를 띄운 뒤 ./gradlew bootRun. local만 .env를 자동으로
# 읽으며 같은 이름의 OS 환경변수가 우선한다.
#
# 운영과 같은 Flyway + validate 경로를 쓴다(ddl-auto: update는 삭제·타입 변경·시드 행·트리거를 반영하지 못해, V20의
# recommendation_history_state 시드 행이 없는 새 로컬 DB에서 RecommendationHistoryImporter가 즉시 실패했다). 스키마를 바꾸려면
# db/migration에 새 V파일을 추가한다. Flyway 도입 전 Hibernate가 만든 기존 볼륨은 자동 baseline하지 않아 flyway_schema_history가
# 없으면 기동이 실패한다 — 임의 버전으로 baseline하면 DDL을 다시 실행하거나 건너뛸 수 있으니, 기존 데이터가 있으면 이력과 실제
# 스키마 상태를 먼저 확인한다.
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  session:
    jdbc:
      # Flyway가 세션 테이블(V3)까지 관리하므로 즉석에서 만들 필요가 없다(운영과 동일).
      initialize-schema: never

  thymeleaf:
    cache: false

logging:
  level:
    # show-sql은 System.out에 SQL을 따로 찍어 이 로거와 함께 켜면 두 번 출력되므로 로거 하나로 합쳤다(application-test.yml과 동일).
    org.hibernate.SQL: debug

app:
  security:
    # 로컬 개발 전용 키. 운영에서는 EMAIL_ENCRYPTION_KEY 환경변수로 덮어쓴다(application-prod.yml).
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY:local-dev-only-email-key-do-not-use-in-prod}
    email-hash-pepper: ${EMAIL_HASH_PEPPER:local-dev-only-hash-pepper-do-not-use-in-prod}
  base-url: ${APP_BASE_URL:http://localhost:8080}
