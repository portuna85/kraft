# 로컬 개발 프로파일. spring.profiles.default=local(application.yml)이므로 별도 지정 없이
# ./gradlew bootRun을 실행하면 자동으로 이 설정이 적용된다.
#
# 로컬에서도 운영과 같은 DB 엔진으로 검증하도록 docker-compose.yml의 MariaDB를 쓴다.
# gradlew test는 test 프로파일을 활성화해 src/test/resources/application-test.yml의
# H2 인메모리를 쓴다(build.gradle.kts 참고).
#
# 실행 전: 루트 .env를 준비하고 docker compose up -d --wait mariadb 로 DB를 띄운 뒤,
# 프로젝트 루트에서 ./gradlew bootRun을 실행한다. local만 .env를 자동으로 읽으며,
# 같은 이름의 OS 환경변수가 있으면 그 값이 우선한다(README.md 참고).
#
# 로컬도 운영과 같은 Flyway + validate 경로를 쓴다(B05). 예전에는 ddl-auto: update였는데,
# 이는 컬럼·테이블 추가만 반영하고 삭제·타입 변경·제약 변경·데이터 삽입·트리거 생성은 전혀
# 하지 못한다 — V20이 만드는 recommendation_history_state 시드 행과 버전 갱신 트리거는 순수
# SQL 구성물이라 Hibernate 스키마 생성으로는 만들 수 없고, 그 결과 새 로컬 DB에서는
# RecommendationHistoryImporter가 HISTORY_STATE_MISSING으로 즉시 실패했다.
#
# 스키마를 바꾸려면 이제 엔티티만 고치는 것으로 끝나지 않는다 — db/migration에 새 V파일을
# 추가해야 한다(운영과 동일한 워크플로). docker 볼륨은 기동 사이에 유지되므로 계정·게시글은
# 그대로 남는다.
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  session:
    jdbc:
      # Flyway가 V3__spring_session.sql을 포함해 전체 스키마를 관리하므로 애플리케이션이
      # 즉석에서 세션 테이블을 만들 필요가 없다(운영과 동일).
      initialize-schema: never

  thymeleaf:
    cache: false

logging:
  level:
    # O06: show-sql은 System.out에 별도로 SQL을 찍는다 — 이 로거와 함께 켜 두면 같은 SQL이
    # 두 번 출력된다. 로거 하나로 합쳤다(application-test.yml과 동일).
    org.hibernate.SQL: debug

app:
  security:
    # 로컬 개발 전용 키. 운영에서는 반드시 EMAIL_ENCRYPTION_KEY 환경변수로 덮어써야 한다
    # (application-prod.yml 참고 — 기본값이 없어 지정하지 않으면 기동 자체가 실패한다).
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY:local-dev-only-email-key-do-not-use-in-prod}
  base-url: ${APP_BASE_URL:http://localhost:8080}
