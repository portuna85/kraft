# 로컬 개발 프로파일. spring.profiles.default=local(application.yml)이므로 별도 지정 없이
# ./gradlew bootRun을 실행하면 자동으로 이 설정이 적용된다.
#
# 로컬에서도 운영과 같은 DB 엔진으로 검증하도록 docker-compose.yml의 MariaDB를 쓴다.
# gradlew test는 test 프로파일을 활성화해 src/test/resources/application-test.yml의
# H2 인메모리를 쓴다(build.gradle.kts 참고).
#
# 실행 전: 루트 .env를 준비하고 docker compose up -d --wait mariadb 로 DB를 띄운 뒤,
# 프로젝트 루트에서 ./gradlew bootRun을 실행한다. local만 .env를 자동으로 읽으며,
# 같은 이름의 OS 환경변수가 있으면 그 값이 우선한다(README.md 참고).
# ddl-auto: update를 써서 docker 볼륨의 데이터를 기동 사이에 유지한다. 계정·게시글을 만들어
# 두고 앱을 다시 띄워도 그대로 남는다(create-drop은 매 기동마다 전체 drop·재생성이라 매번
# 비워졌다). 어느 쪽이든 운영에는 쓰면 안 된다 — 운영은 prod 프로파일 + Flyway + validate다.
#
# update의 한계: 컬럼·테이블 추가는 반영하지만 삭제·타입 변경·제약 변경은 반영하지 않는다.
# 엔티티에서 필드를 지우거나 타입을 바꿨다면 데이터를 백업하고 명시적인 SQL로 변경한다.
# (운영 스키마의 정합성은 이 설정이 아니라 db/migration의 Flyway 마이그레이션이 책임진다.
#  마이그레이션을 새로 추가했다면 docs/04-implementation-plan.md §11의 배포 전 점검 절차로
#  운영과 같은 경로를 한 번 리허설할 것.)
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false

  session:
    jdbc:
      initialize-schema: always
      # 기본 schema-mysql.sql은 IF NOT EXISTS가 없어서, 볼륨에 세션 테이블이 이미 있으면
      # 매 기동마다 "already exists"/"Duplicate key name" WARN 5줄이 찍힌다. 멱등 버전으로
      # 바꿔 조용히 넘어가게 한다(파일 주석 참고).
      schema: classpath:session/schema-mariadb.sql

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    # 로컬 개발 전용 키. 운영에서는 반드시 EMAIL_ENCRYPTION_KEY 환경변수로 덮어써야 한다
    # (application-prod.yml 참고 — 기본값이 없어 지정하지 않으면 기동 자체가 실패한다).
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY:local-dev-only-email-key-do-not-use-in-prod}
  base-url: ${APP_BASE_URL:http://localhost:8080}
