# 로컬 개발 프로파일. spring.profiles.default=local(application.yml)이므로 별도 지정 없이
# ./gradlew bootRun을 실행하면 자동으로 이 설정이 적용된다.
#
# 로컬에서도 운영과 같은 DB 엔진으로 검증하도록 docker-compose.yml의 MariaDB를 쓴다.
# gradlew test는 test 프로파일을 활성화해 src/test/resources/application-test.yml의
# H2 인메모리를 쓴다(build.gradle.kts 참고).
#
# 실행 전: 루트 .env를 준비하고 docker compose up -d 로 MariaDB를 띄운 뒤,
# 프로젝트 루트에서 ./gradlew bootRun을 실행한다. local만 .env를 자동으로 읽으며,
# 같은 이름의 OS 환경변수가 있으면 그 값이 우선한다(README.md 참고).
# ddl-auto: create-drop을 써서 매 실행마다 스키마를 새로 만든다 — 운영 스키마 마이그레이션
# 없이 빠르게 눈으로 확인하는 용도이므로, 이 설정을 실제 운영에 쓰면 안 된다(운영은 prod
# 프로파일 + Flyway).
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: false

  session:
    jdbc:
      initialize-schema: always
      # 기본 schema-mysql.sql은 IF NOT EXISTS가 없어서, 볼륨에 세션 테이블이 이미 있으면
      # 매 기동마다 "already exists"/"Duplicate key name" WARN 5줄이 찍힌다. 멱등 버전으로
      # 바꿔 조용히 넘어가게 한다(파일 주석 참고).
      schema: classpath:session/schema-mariadb.sql

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    # 로컬 개발 전용 키. 운영에서는 반드시 EMAIL_ENCRYPTION_KEY 환경변수로 덮어써야 한다
    # (application-prod.yml 참고 — 기본값이 없어 지정하지 않으면 기동 자체가 실패한다).
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY:local-dev-only-email-key-do-not-use-in-prod}
  base-url: ${APP_BASE_URL:http://localhost:8080}
