# 로컬 개발 프로파일. spring.profiles.default=local(application.yml)이므로
# 별도 지정 없이 ./gradlew bootRun / test를 실행하면 자동으로 이 설정이 적용된다.
spring:
  datasource:
    url: jdbc:h2:mem:kraft;MODE=MariaDB
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true

  session:
    jdbc:
      initialize-schema: always

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug
