server:
  servlet:
    session:
      cookie:
        # OAuth2 authorization callback은 외부 provider에서 돌아오는 top-level GET이므로
        # SameSite=Strict이면 기존 세션의 state를 복원하지 못한다. Lax는 이 왕복을 허용하면서
        # cross-site subrequest에는 쿠키를 보내지 않으며, 쓰기 요청은 CSRF 토큰으로 보호한다.
        secure: true
        same-site: lax
        http-only: true
  tomcat:
    # BE-OPS-01(docs/improvement.md): 가상 스레드(spring.threads.virtual.enabled)는 Tomcat의
    # 워커 스레드 상한을 사실상 없앤다 — threads.max가 요청 수용을 더 이상 못 막으므로,
    # 대신 이 두 값이 accept 단계에서 backpressure를 건다. Hikari maximum-pool-size(15)의
    # 배수로 잡아, 풀보다 훨씬 많은 요청이 들어와도 각자 connection-timeout(30초)을 기다리며
    # 한꺼번에 타임아웃 나는 대신 accept 단계에서 빠르게 거절되게 한다.
    # ⚠ 아직 부하테스트로 확정한 값이 아니다 — scripts/load-test/recommend-and-community.js를
    # VU 계단식으로 올려 p95가 이 한도 근처에서 완만히 거절로 전환되는지 재측정한 뒤 조정한다.
    max-connections: 150
    accept-count: 50

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${KRAFT_DB_URL}
    username: ${KRAFT_DB_USERNAME}
    password: ${KRAFT_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # connection-timeout은 application.yml 기본 설정과 같은 값(30000ms)이라 여기서
      # 다시 적지 않는다(BE-OPS-01 — 프로파일 간 값이 갈라져 있던 것을 정리했다).
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 600000
  jpa:
    # ddl-auto: validate, hibernate.jdbc.time_zone, sql.init.mode·batch_size·order_inserts·
    # order_updates는 application.yml 기본 설정에서 상속(BE-CFG-01 — 예전엔 이 파일에만 있어
    # persistInternal의 배치 동작이 로컬·테스트에서 한 번도 실행되지 않았다).
    properties:
      hibernate:
        jdbc:
          fetch_size: 50
        format_sql: false

logging:
  level:
    root: warn
    com.kraft: info

springdoc:
  swagger-ui:
    enabled: false
  # FE-API-02: prod에서는 ops 계약을 문서로 내보내지 않는다. OpenApiConfig의 ops 그룹 빈은
  # @Profile("!prod")로 이미 빠지지만, 그룹을 안 붙인 /v3/api-docs는 전역 필터가 없으면
  # 스캔된 모든 경로(= /ops 포함)를 담는다. api-docs 자체는 prod에서도 켜져 있으므로
  # (swagger-ui만 껐다) 여기서 전역 필터를 다시 걸어 공개 계약만 남긴다.
  # 기본 프로파일에 두면 ops 그룹 문서까지 /api/**로 걸러져 비어 버린다(application.yml 주석 참고).
  pathsToMatch: /api/**
