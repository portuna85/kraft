# 운영 프로파일. --spring.profiles.active=prod 로 명시적으로 활성화해야 한다.
# 자격 증명은 파일에 하드코딩하지 않고 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD)로 주입한다.
# 값이 없으면 플레이스홀더 "${DB_URL}" 문자열이 그대로 드라이버에 전달되어 컨텍스트 기동
# 시점에 실패한다(실측: "Driver org.mariadb.jdbc.Driver claims to not accept jdbcUrl,
# ${DB_URL}") — 운영 자격 증명 없이는 절대 기동되지 않는 의도된 fail-fast 동작이다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 운영 스키마는 마이그레이션 도구나 수동 DDL로 관리한다. 애플리케이션이 스키마를 만들거나
      # 지우지 않는다 — 스키마가 엔티티 매핑과 불일치하면 기동 자체가 실패한다(의도된 동작).
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      # 로컬 전용 기능이므로 운영에서는 완전히 비활성화한다. SecurityConfig의
      # /h2-console/** permitAll·CSRF 예외는 이 콘솔이 꺼지면 가리킬 대상이 없어 무해해진다.
      enabled: false

  session:
    jdbc:
      # 운영 DB의 세션 테이블은 애플리케이션이 즉석에서 만들지 않는다(사전에 준비되어 있어야 함).
      initialize-schema: never

  thymeleaf:
    cache: true
