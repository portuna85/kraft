# 운영 프로파일(--spring.profiles.active=prod 로 명시적으로 활성화). 자격 증명은 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD)로만 받는다 —
# 값이 없으면 플레이스홀더 문자열이 드라이버에 전달되어 기동 시점에 실패한다(의도된 fail-fast).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # 기본값(풀 10, 대기 30초)에서는 after-commit 콜백(AfterCommit 참고)과 가상 스레드가 겹친 버스트에 풀이 고갈될 수 있다.
      # 대기 시간을 5초로 줄여 정체를 빨리 실패로 드러낸다.
      maximum-pool-size: 20
      connection-timeout: 5000
      # max-lifetime(기본 30분)이 운영 MariaDB의 wait_timeout보다 짧아야 서버가 먼저 끊은 죽은 커넥션을 내주지 않는다. [확인 필요]
      # SHOW VARIABLES LIKE 'wait_timeout'으로 확인해, 기본값이 더 짧지 않다면 이 항목을 그보다 짧게 명시한다.

  jpa:
    hibernate:
      # 운영 스키마는 Flyway가 관리하고 애플리케이션은 만들지도 지우지도 않는다 — 엔티티 매핑과 불일치하면 기동이 실패한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        session:
          events:
            log:
              # 이 값(ms)보다 느린 쿼리만 남긴다(매 쿼리를 남기는 show-sql과 달리 상시 켤 수 있다).
              LOG_QUERIES_SLOWER_THAN_MS: 200

  flyway:
    enabled: true
    # 운영 DB는 이미 baseline을 마쳤다. baseline-on-migrate를 켜 두면 DB_URL이 이력 테이블 없는 다른 DB를 가리킬 때 그 DB를 V1로
    # baseline하고 V2부터 적용해 버리므로 끈다(이력 테이블이 없으면 기동 실패). 빈 DB는 V1부터 그대로 실행된다.
    baseline-on-migrate: false

  session:
    jdbc:
      # 운영 DB의 세션 테이블은 애플리케이션이 즉석에서 만들지 않는다(사전에 준비되어 있어야 함).
      initialize-schema: never

  thymeleaf:
    cache: true

  # SMTP 설정(spring.mail.*)은 모든 프로파일이 공유하는 application.yml에 있다.

server:
  servlet:
    session:
      cookie:
        # forward-headers-strategy 덕에 프록시 뒤에서도 isSecure()가 실제 프로토콜을 반영하므로 Secure를 강제해도 로컬(HTTP)에는
        # 영향이 없다. server.servlet 아래여야 바인딩된다.
        secure: true

app:
  # 이메일 인증 링크의 실제 배포 도메인. 환경변수로 지정해야 한다(기본값 없음 — 빠뜨리면 링크에 "${APP_BASE_URL}"이 그대로 들어가 눈에 띄게 실패한다).
  base-url: ${APP_BASE_URL}
  metrics:
    # 상태 이상 메일을 받을 관리자 주소. 기본값은 빈 문자열이라 설정하지 않아도 기동하고 알림만 꺼진다(METRICS_ALERT_EMAIL로 채운다).
    alert-email: ${METRICS_ALERT_EMAIL:}
  security:
    # User.email AES 암호화 키. 기본값 없음 — 없으면 기동 실패(fail-fast). 유출되면 저장된 모든 이메일을 복호화할 수 있으므로
    # DB_URL·MAIL_HOST와 같은 등급의 비밀이다. 이 값만 바꾸면 안 된다 — 기존 암호문을 못 읽는데 조회는 email_hmac로 하므로
    # 로그인은 되어 한참 뒤에야 깨진 걸 안다. 교체는 앱을 내리고 rekey 프로파일로 재암호화한다(application-rekey.yml).
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY}
    # 이메일 조회용 HMAC-SHA256 pepper. 기본값 없음. 암호화 키와 다른 값을 쓰고 백업과 분리해 보관하며, 잃으면 이메일 조회가 안 되므로
    # 키와 같은 등급이다. 바꾸려면 hmac-backfill 도구로 다시 채운다.
    email-hash-pepper: ${EMAIL_HASH_PEPPER}
