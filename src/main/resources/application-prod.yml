# 운영 프로파일. --spring.profiles.active=prod 로 명시적으로 활성화해야 한다.
# 자격 증명은 파일에 하드코딩하지 않고 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD)로 주입한다.
# 값이 없으면 플레이스홀더 "${DB_URL}" 문자열이 그대로 드라이버에 전달되어 컨텍스트 기동
# 시점에 실패한다(실측: "Driver org.mariadb.jdbc.Driver claims to not accept jdbcUrl,
# ${DB_URL}") — 운영 자격 증명 없이는 절대 기동되지 않는 의도된 fail-fast 동작이다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 운영 스키마는 마이그레이션 도구나 수동 DDL로 관리한다. 애플리케이션이 스키마를 만들거나
      # 지우지 않는다 — 스키마가 엔티티 매핑과 불일치하면 기동 자체가 실패한다(의도된 동작).
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      # 로컬 전용 기능이므로 운영에서는 완전히 비활성화한다. SecurityConfig의
      # /h2-console/** permitAll·CSRF 예외는 이 콘솔이 꺼지면 가리킬 대상이 없어 무해해진다.
      enabled: false

  session:
    jdbc:
      # 운영 DB의 세션 테이블은 애플리케이션이 즉석에서 만들지 않는다(사전에 준비되어 있어야 함).
      initialize-schema: never

  thymeleaf:
    cache: true

  # SMTP 자격 증명도 DataSource와 동일하게 환경변수로 주입한다. 다만 DataSource와 달리
  # JavaMailSenderImpl은 빈 생성 시점에 실제로 연결을 시도하지 않고 send() 호출 시점에만
  # 연결하므로, 값이 없어도 기동 자체는 실패하지 않고 "이메일 발송 시점"에만 실패한다
  # (DB_URL과 다른 실패 시점이라는 점을 알고 있어야 한다).
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # 이메일 인증 링크에 사용할 실제 배포 도메인. 반드시 환경변수로 지정해야 한다(기본값 없음 —
  # 지정하지 않으면 인증 링크에 "${APP_BASE_URL}" 문자열이 그대로 들어가는 명백한 오류가 되어
  # 눈에 띄게 실패한다).
  base-url: ${APP_BASE_URL}
  security:
    # User.email 컬럼 AES 암호화 키. 기본값 없음 — 지정하지 않으면 기동 자체가 실패한다
    # (의도된 fail-fast). 유출되면 저장된 모든 이메일을 복호화할 수 있으므로 DB_URL·MAIL_HOST와
    # 동일한 등급의 비밀로 취급해 관리한다. 이 키를 바꾸면 기존에 암호화된 이메일은 복호화할 수
    # 없게 되므로(재암호화 마이그레이션 없이는) 운영 중 절대 변경하지 않는다.
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY}
