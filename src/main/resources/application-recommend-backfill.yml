# 추천 이력 백필 전용 프로파일(--spring.profiles.active=recommend-backfill 로만 활성화). 실행 방법은 RecommendationBackfillRunner
# javadoc을 본다. 한 번 수행하고 종료 코드를 남기며 내려간다.
server:
  port: -1

app:
  # 백필이 도는 동안 무관한 주기 작업은 끈다(application-rekey.yml과 같은 원칙).
  mail:
    enabled: false
    # 발송과 별개로 보관기간 정리는 enabled와 무관하게 돌므로(OutboxMailWorker) 따로 끈다.
    retention-enabled: false
  upload:
    cleanup-enabled: false
    reconcile-enabled: false
  metrics:
    enabled: false
  verification:
    sweep-enabled: false
    purge-enabled: false
  session-revocation:
    enabled: false
    # 같은 이유로 세션 폐기 태스크의 보관기간 정리도 끈다(SessionRevocationWorker).
    retention-enabled: false
  recommend:
    # 이 실행이 이력을 채우는 작업이라, 자동 수집이 같은 테이블로 동시에 돌면 진행 상황이 엉킨다.
    auto-fetch:
      enabled: false
  post:
    purge-enabled: false
