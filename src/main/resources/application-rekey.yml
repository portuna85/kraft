# 이메일 암호화 키 교체 전용 프로파일(--spring.profiles.active=rekey 로만 활성화).
#
#   java -jar kraft.jar --spring.profiles.active=rekey
#
# EMAIL_ENCRYPTION_KEY(새 키)와 EMAIL_ENCRYPTION_KEY_OLD(옛 키)를 함께 지정해야 하며 같으면 아무것도 하지 않고 실패한다. 모든
# 이메일을 다시 쓰므로 DB 백업(deploy/backup.sh)을 먼저 받는다. 한 번 수행하고 종료 코드를 남기며 내려간다(EmailRekeyRunner).
spring:
  # 호스트에서 직접 실행하므로 local과 같은 방식으로 .env를 읽는다. OS 환경변수가 우선한다.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 스키마를 건드리지 않는다. 이 도구가 바꾸는 것은 users.email의 값뿐이다.
      ddl-auto: validate
    show-sql: false

  # 마이그레이션은 평소 기동이 할 일이다. 키 교체와 스키마 변경을 한 실행에 섞지 않는다.
  flyway:
    enabled: false

  session:
    jdbc:
      initialize-schema: never

# HTTP 포트를 열지 않는다(운영 앱과 포트가 부딪히지 않게 — 다만 앱을 내린 상태에서 돌리는 것이 전제다).
server:
  port: -1

app:
  security:
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY}
    # 저장된 이메일의 HMAC(email_hmac)과 대조하는 데 쓴다. 암호화 키와 다른 pepper다.
    email-hash-pepper: ${EMAIL_HASH_PEPPER}
    # 지금 DB에 저장된 암호문을 만든 키. 이 프로파일에서만 쓴다.
    old-email-encryption-key: ${EMAIL_ENCRYPTION_KEY_OLD:}

  # 데이터를 통째로 다시 쓰는 동안 끼어들 주기 작업은 전부 끈다(무관한 스케줄러를 한 실행에 섞지 않는다).
  mail:
    enabled: false
    # outbox_mails 보관기간 정리는 enabled와 무관하게 돌므로(OutboxMailWorker.cleanupOldTerminal) 따로 끈다.
    retention-enabled: false
  upload:
    cleanup-enabled: false
    reconcile-enabled: false
  metrics:
    enabled: false
  # GuestVerificationSweeper는 User를 읽으며 email을 즉시 복호화하므로 옛 키로 남은 GUEST 행에서 실패할 수 있고,
  # SessionRevocationWorker도 계정 상태가 바뀌는 중에 끼어들 이유가 없어 끈다(다음 평소 기동부터 다시 켜진다).
  verification:
    sweep-enabled: false
    purge-enabled: false
  session-revocation:
    enabled: false
    # cleanupOldTerminal도 enabled와 무관하게 돈다(SessionRevocationWorker). 위험하진 않지만 같은 원칙으로 끈다.
    retention-enabled: false
  recommend:
    # 동행복권 자동 수집도 같은 원칙으로 끈다(users만 건드리는 작업이라 직접 위험하진 않다).
    auto-fetch:
      enabled: false
  post:
    # 소프트 삭제된 글 영구 삭제도 같은 이유로 끈다.
    purge-enabled: false
