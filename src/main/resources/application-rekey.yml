# 이메일 암호화 키 교체 전용 프로파일. --spring.profiles.active=rekey 로만 활성화된다.
#
#   java -jar kraft.jar --spring.profiles.active=rekey
#
# EMAIL_ENCRYPTION_KEY(새 키)와 EMAIL_ENCRYPTION_KEY_OLD(옛 키)를 함께 지정해야 하며, 둘이
# 같으면 EmailRekeyService가 아무것도 하지 않고 실패한다. 저장된 모든 이메일을 다시 쓰는
# 작업이므로 README "백업·복구"의 절차대로 DB 백업을 먼저 받는다.
#
# 한 번 수행하고 종료 코드를 남기며 내려간다(EmailRekeyRunner). 서비스로 남지 않는다.
spring:
  # 호스트에서 직접 실행하므로 local과 같은 방식으로 .env를 읽는다. OS 환경변수가 우선한다.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 스키마를 건드리지 않는다. 이 도구가 바꾸는 것은 users.email의 값뿐이다.
      ddl-auto: validate
    show-sql: false

  # 마이그레이션은 평소 기동이 할 일이다. 키 교체와 스키마 변경을 한 실행에 섞지 않는다.
  flyway:
    enabled: false

  session:
    jdbc:
      initialize-schema: never

# HTTP 포트를 열지 않는다. 운영 중인 앱을 내리지 않고 실행하더라도 포트가 부딪히지 않는다.
# (다만 이 도구는 앱을 내린 상태에서 돌리는 것을 전제로 한다 — README 절차 참고.)
server:
  port: -1

app:
  security:
    email-encryption-key: ${EMAIL_ENCRYPTION_KEY}
    # 저장된 이메일의 HMAC(email_hmac)과 대조하는 데 쓴다. 암호화 키와 다른 pepper다.
    email-hash-pepper: ${EMAIL_HASH_PEPPER}
    # 지금 DB에 저장된 암호문을 만든 키. 이 프로파일에서만 쓴다.
    old-email-encryption-key: ${EMAIL_ENCRYPTION_KEY_OLD:}

  # 데이터를 통째로 다시 쓰는 동안 주기 작업이 끼어들 이유가 없다. 전부 끈다.
  mail:
    enabled: false
    # 발송 자체와 별개로 outbox_mails 보관기간 정리는 enabled 플래그와 무관하게 항상 돈다
    # (OutboxMailWorker.cleanupOldTerminal, OBS-05). "무관한 스케줄러를 한 실행에 섞지
    # 않는다"는 이 파일의 원칙을 지키려면 이 창에서는 이것도 따로 꺼야 한다(전체 리뷰
    # 2026-09-26 OPS-02).
    retention-enabled: false
  upload:
    cleanup-enabled: false
    reconcile-enabled: false
  metrics:
    enabled: false
  # GuestVerificationSweeper는 User 엔티티를 읽으면서 email을 즉시 복호화한다(O07) — 아직
  # 옛 키로 남은 GUEST 행이 섞이면 rekeyAll이 미처 돌기 전에 복호화 실패로 멈출 수 있다.
  # SessionRevocationWorker도 같은 이유로 끈다(O02) — 키 교체 창에서 계정 상태가 바뀌는 중에
  # 세션 폐기 태스크가 끼어들 이유가 없다. 이 워커는 다음 평소 기동부터 다시 켜진다.
  verification:
    sweep-enabled: false
    purge-enabled: false
  session-revocation:
    enabled: false
    # cleanupOldTerminal도 enabled와 무관하게 항상 돈다(SessionRevocationWorker, OBS-05).
    # 그 자체로 위험하지는 않지만(상태·시각 기준 bulk delete다), 무관한 스케줄러를 한 실행에
    # 섞지 않는다는 원칙대로 이 창에서는 끈다.
    retention-enabled: false
  recommend:
    # 동행복권 자동 수집도 이 창에서 돌 이유가 없다(개선 보고서 OBS-05) — users 테이블만
    # 건드리는 작업이라 직접 위험하진 않지만, 한 실행에 무관한 스케줄러를 섞지 않는다는
    # 원칙은 다른 항목들과 같다.
    auto-fetch:
      enabled: false
  post:
    # 소프트 삭제된 글 영구 삭제도 같은 이유로 끈다.
    purge-enabled: false
