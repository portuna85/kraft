spring:
  application:
    name: kraft

  profiles:
    default: local

  jpa:
    open-in-view: false

  session:
    store-type: jdbc

  servlet:
    multipart:
      # 게시글 사진 업로드의 실제 수신 한도. 설정이 없으면 Spring Boot 기본값이
      # max-file-size=1MB로 적용되어, PostImageService의 5MB 검사와 화면 안내("최대 5MB")에
      # 닿기도 전에 1MB 초과 파일이 컨테이너에서 거절된다(용량 안내 대신 알 수 없는 오류).
      #
      # 값을 5MB로 "딱 맞추지" 않는 이유: 경계값에서 컨테이너가 먼저 거절하면 서비스가 내는
      # "파일 크기는 5MB를 초과할 수 없습니다."와 다른 경로의 오류가 섞인다. 컨테이너 한도를
      # 한 단계 위에 두어 5MB 규칙의 판정자를 PostImageService 하나로 일원화한다.
      # 그보다 큰 요청은 ApiExceptionHandler가 413으로 받아낸다.
      max-file-size: 6MB
      max-request-size: 7MB
      # 파싱을 컨트롤러가 파일 파라미터에 실제로 접근하는 시점까지 미룬다. 이게 없으면
      # DispatcherServlet이 핸들러 진입 전에 멀티파트 전체를 즉시 읽다가 한도를 넘겨 커넥션이
      # 리셋되고, ApiExceptionHandler가 413을 내려주기도 전에 클라이언트는 본문 없는 응답만
      # 받는다(로컬 실측으로 확인 — ApiExceptionHandler.handleUploadTooLarge() 주석 참고).
      resolve-lazily: true

  threads:
    virtual:
      # 가상 스레드(Java 21+ Project Loom) 활성화. 톰캣 요청 처리·@Async 등 Spring Boot가
      # 관리하는 실행기를 플랫폼 스레드 풀 대신 가상 스레드로 구동한다. 이 프로젝트는
      # Java 25 툴체인을 쓰므로(build.gradle.kts) 별도 준비 없이 바로 켤 수 있다.
      enabled: true

app:
  upload:
    # 게시글 사진 업로드 저장 경로(상대 경로는 애플리케이션 실행 위치 기준). 운영 환경에서
    # 컨테이너 재배포 시 파일이 유실될 수 있으므로(임시 파일시스템), 영구 볼륨을 마운트하거나
    # 오브젝트 스토리지로 교체하는 것을 권장한다(이번 범위에서는 로컬 디스크로 구현).
    dir: uploads/images
  # 이메일 인증 링크를 만들 때 붙일 기본 URL. 운영에서는 실제 배포 도메인으로 덮어써야 한다
  # (application-prod.yml 참고).
  base-url: http://localhost:8080
