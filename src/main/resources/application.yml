spring:
  application:
    name: kraft-lotto
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  jackson:
    time-zone: Asia/Seoul
    locale: ko-KR
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${KRAFT_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          # BE-CFG-01(docs/improvement.md): 예전엔 prod 프로파일에만 있어
          # RecommendationSetHistoryService.persistInternal(:86-88)이 기대는 배치 동작이
          # 로컬·테스트에서 한 번도 실행되지 않았다. 모든 프로파일에서 같은 코드 경로가
          # 돈다 — 다만 모든 엔티티가 GeneratedValue(IDENTITY)라 Hibernate는 insert를
          # 배치하지 못한다(생성 키를 즉시 받아야 해서), 그래서 이 설정은 지금 update만
          # 배치한다. IDENTITY를 시퀀스로 바꾸는 것은 마이그레이션이 필요한 별도 결정이다.
          batch_size: 25
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: never
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 1800000
      keepalive-time: 30000
      # BE-OPS-01(docs/improvement.md): prod에만 있었다. Hikari 자체 기본값(30000ms)과
      # 같은 값을 명시해 "그 프로파일에만 있다"는 사실 자체를 없앤다(동작 변화 없음).
      connection-timeout: 30000
  flyway:
    enabled: true
  profiles:
    default: local
  # rate-limit-backend=in-memory(기본값)면 이 커넥션은 아예 쓰이지 않는다 — LettuceConnectionFactory는
  # 빈 생성 시점에 실제로 연결을 열지 않으므로(validate-connection 기본값 false), Redis가 없어도
  # 기동·테스트에 영향이 없다. rate-limit-backend=redis로 전환할 때만 아래 값이 실제로 쓰인다.
  data:
    redis:
      host: ${KRAFT_REDIS_HOST:localhost}
      port: ${KRAFT_REDIS_PORT:6379}


# Google/Naver 등록을 조건부 문서로 분리한 이유(2026-07-24): 위 spring: 블록에 이 등록을
# 무조건 넣어두면, client-id 환경변수가 비어 있어도 스프링 부트의
# OAuth2ClientProperties.validate()가 "Client id of registration 'google' must not be
# empty"로 기동 자체를 막는다. config-data 문서가 지원하는 profile 조건을 사용하고,
# render-env.sh가 ID/secret이 모두 채워진 provider profile만 SPRING_PROFILES_INCLUDE에
# 넣는다. 자격 증명이 없으면 해당 profile을 포함하지 않아 registration 문서도 로드되지 않는다.
---
spring:
  config:
    activate:
      on-profile: community-google-oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${KRAFT_COMMUNITY_GOOGLE_CLIENT_ID}
            client-secret: ${KRAFT_COMMUNITY_GOOGLE_CLIENT_SECRET}
            # openid 스코프를 넣지 않는다 — 포함 시 Spring Security가 OIDC 플로우(OidcUserService)로
            # 전환해 아래 CommunityOAuth2UserService(plain OAuth2UserService)가 호출되지 않는다.
            # Naver와 동일한 커스텀 서비스로 처리하기 위해 의도적으로 plain OAuth2를 유지한다.
            # 커뮤니티는 표시 이름만 사용하며 이메일은 수집·저장하지 않는다.
            scope: profile
---
spring:
  config:
    activate:
      on-profile: community-naver-oauth
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${KRAFT_COMMUNITY_NAVER_CLIENT_ID}
            client-secret: ${KRAFT_COMMUNITY_NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            # Naver 명세상 scope는 내부 구분값이라 전송할 필요가 없다. 제공 정보는 개발자
            # 콘솔에서 별명만 허용하며, 애플리케이션은 이메일·회원이름을 수집하지 않는다.
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
---
server:
  port: 8080
  forward-headers-strategy: framework
  # BE-OPS-01(docs/improvement.md): graceful은 인플라이트 요청이 끝날 때까지 기다린 뒤
  # 종료한다 — AsyncConfig의 두 executor가 이미 setWaitForTasksToCompleteOnShutdown(true)로
  # 같은 정책을 쓰므로 서버 레벨에서도 맞춘다. 상한(timeout-per-shutdown-phase)이 없으면
  # 느린 요청 하나가 재배포를 무한정 붙잡는다.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  file:
    path: ${KRAFT_LOG_PATH:logs}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,recommendationHistory
  health:
    # rate-limit-backend=in-memory(기본값)일 때는 Redis를 쓰지 않는데도 헬스 인디케이터가
    # 자동 등록돼 연결 실패 WARN 로그만 남긴다 — 기능에 영향 없는 소음이라 비활성화.
    redis:
      enabled: false

# 계약(B-01): 노출 범위는 패키지가 아닌 경로 기준으로 잡는다 — 근거와 실제 필터는
# OpenApiConfig의 GroupedOpenApi 빈에 있다(FE-API-02로 여기 pathsToMatch에서 옮겼다).
# public 그룹은 /v3/api-docs/public, ops 그룹은 /v3/api-docs/ops로 나간다.
#
# 여기에 springdoc.pathsToMatch를 두면 **그룹 설정보다 우선해서** ops 그룹까지 /api/**로
# 걸러 버린다(실측: /v3/api-docs/ops가 공개 경로 37개를 그대로 반환했다). 그래서 전역
# 필터는 비워 두고 그룹이 범위를 정한다. 대신 그룹을 안 붙인 /v3/api-docs는 필터가 없어
# 두 그룹의 합집합이 되는데, prod에서는 application-prod.yml이 이 전역 필터를 다시 켜서
# 공개 계약만 남긴다(ops 그룹 빈 자체도 @Profile("!prod")로 빠진다 — 이중 방어).
springdoc:
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      externalLotto:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
  retry:
    instances:
      externalLotto:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

kraft:
  public-base-url: ${KRAFT_PUBLIC_BASE_URL:}
  external-lotto:
    url-template: ${KRAFT_EXTERNAL_LOTTO_URL_TEMPLATE:}
    auto-collect-cron: ${KRAFT_EXTERNAL_LOTTO_AUTO_COLLECT_CRON:0 30/15 21-23 * * SAT}
    referer: ${KRAFT_EXTERNAL_LOTTO_REFERER:https://www.dhlottery.co.kr/lt645/result}
    requested-with: ${KRAFT_EXTERNAL_LOTTO_REQUESTED_WITH:XMLHttpRequest}

  ops:
    token: ${KRAFT_OPS_TOKEN:}
  saved:
    max-per-client: ${KRAFT_SAVED_MAX_PER_CLIENT:100}
  community:
    write-rate-limit-per-minute: ${KRAFT_COMMUNITY_WRITE_RATE_LIMIT_PER_MINUTE:20}
  security:
    trusted-proxy-cidr: ${KRAFT_SECURITY_TRUSTED_PROXY_CIDR:172.28.0.0/16}
    rate-limit-per-minute: ${KRAFT_SECURITY_RATE_LIMIT_PER_MINUTE:120}
    rate-limit-max-keys: ${KRAFT_SECURITY_RATE_LIMIT_MAX_KEYS:10000}
    # in-memory(Caffeine, 기본값): 단일 인스턴스 전용. redis: 다중 인스턴스에서도 카운터를
    # 공유한다 — 스케일아웃 시에만 전환(RedisRateLimitCounter는 Redis 장애 시 fail-open,
    # 즉 그 요청은 무제한 통과시킨다 — 레이트리밋 장애가 전체 장애로 번지지 않게 하는 게
    # 가용성 관점에서 더 중요하다고 판단).
    rate-limit-backend: ${KRAFT_RATE_LIMIT_BACKEND:in-memory}
  revalidate:
    secret: ${KRAFT_REVALIDATE_SECRET:}
    web-url: ${KRAFT_REVALIDATE_WEB_URL:http://web:3000}
  web-observability:
    secret: ${KRAFT_WEB_OBSERVABILITY_SECRET:}
  retention:
    operation-log-days: ${KRAFT_RETENTION_OPERATION_LOG_DAYS:30}
    admin-audit-log-days: ${KRAFT_RETENTION_ADMIN_AUDIT_LOG_DAYS:90}
    saved-number-lock-orphan-days: ${KRAFT_RETENTION_SAVED_NUMBER_LOCK_ORPHAN_DAYS:30}
