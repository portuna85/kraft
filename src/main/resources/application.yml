# 텍스트 계열만 gzip으로 압축한다(이미지·폰트는 이미 압축돼 있고, 1KB 미만은 오버헤드가 더 크다).
server:
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1024
  # TLS는 앞단 리버스 프록시가 종단한다. native 전략은 톰캣 RemoteIpValve로 X-Forwarded-*를 internal-proxies에서 온 것만 신뢰해
  # request.getRemoteAddr()/isSecure()가 실제 클라이언트 값을 주고 "IP당" 제한이 실제 IP 단위로 걸린다. internal-proxies는
  # 배포 환경의 프록시 주소로 맞춘다(기본값은 사설망 대역 — 신뢰 범위를 넓히면 클라이언트가 헤더를 위조할 수 있다).
  forward-headers-strategy: native
  servlet:
    session:
      # 긴 글을 쓰는 동안 세션이 끊겨 등록 시점에야 403이 나지 않게 기본값(30분)을 늘린다. server.servlet 아래여야 한다
      # (spring.servlet.session.timeout은 없는 프로퍼티라 무시된다). Spring Session JDBC도 이 값을 쓴다.
      timeout: 2h
  tomcat:
    remoteip:
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}

spring:
  application:
    name: kraft

  profiles:
    default: local

  # 인기글처럼 요청마다 다시 계산할 필요가 없는 값을 짧게 캐시한다(모든 캐시의 기본 스펙). 45초는 "낡은 인기글을 보이지 않는다"와
  # "DB를 매번 두드리지 않는다" 사이의 절충이고, 고정 글(pinnedPosts)은 글을 쓰거나 고칠 때 바로 비운다.
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=45s

  jpa:
    open-in-view: false
    properties:
      hibernate:
        # IN(:ids) 크기가 요청마다 달라지면 쿼리 플랜 캐시가 어긋난다 — 패딩으로 크기를 맞춰 재사용한다.
        query:
          in_clause_parameter_padding: true
        # 지연 로딩 연관(post.user 등)을 엔티티마다 조회하는 대신 배치로 묶는 안전망(fetch join된 경로엔 영향 없음).
        default_batch_fetch_size: 50
        # 시간은 KST로 고정한다(KraftApplication.ZONE_ID). JDBC도 같은 시간대를 써 서버·DB 세션 시간대와 무관하게 저장값이 같다.
        jdbc:
          time_zone: Asia/Seoul

  data:
    web:
      pageable:
        # 클라이언트가 size=로 임의의 큰 페이지를 요청하지 못하게 상한을 둔다.
        max-page-size: 50

  flyway:
    # 기본은 끔이다. test(H2, create-drop)는 Hibernate가 스키마를 만들므로 두 스키마 관리자가 같은 DB를 건드리지 않게 끈다.
    # local(Docker MariaDB)과 운영은 각자 true로 덮어써 Flyway + validate를 쓴다 — 같은 DB 엔진이라 관리 방식도 같아야 한다.
    enabled: false

  session:
    store-type: jdbc

  web:
    resources:
      # 정적 자원을 URL 버전으로 구분해 장기 캐시한다. /js/**는 빌드마다 바뀌는 고정 버전(build.gradle.kts의 buildVersion, 보통 git SHA)을
      # 경로 접두사로 받는다 — Vue 산출물은 파일명에 해시를 넣지 않고, 콘텐츠 해시 방식은 JS 내부 import 지정자를 재작성하지 못해 쓸 수
      # 없다. /css/**는 콘텐츠 해시로 충분하다. 템플릿은 th:href/th:src의 @{...}로 링크를 만들어야 ResourceUrlEncodingFilter가
      # 버전 URL로 치환한다(하드코딩한 href="/js/..."는 타지 않는다).
      chain:
        enabled: true
        # 빌드가 만든 .gz(build.gradle.kts의 processResources)를 클라이언트가 gzip을 받을 때 그대로
        # 내려준다. 없는 파일은 원본을 보내고, server.compression이 필요하면 동적으로 압축한다.
        compressed: true
        strategy:
          fixed:
            enabled: true
            version: "@buildVersion@"
            paths: /js/**
          content:
            enabled: true
            paths: /css/**
      cache:
        use-last-modified: true
        cachecontrol:
          max-age: 365d
          cache-public: true
          immutable: true

  # 모든 프로파일이 실제 SMTP로 인증 메일을 보낸다(SmtpEmailSender). 값에 기본값을 둔 이유: spring.mail.host는 JavaMailSender 자동
  # 구성 조건에 쓰이는데, 값 없는 플레이스홀더는 조건 평가 시점에 PlaceholderResolutionException을 던진다. 기본값(localhost)이면
  # 빈은 항상 만들어지고 실제 연결은 메일을 보낼 때만 하므로, 값이 틀리면 그때서야 실패가 드러난다. 로컬에서 받아보려면
  # MAIL_HOST/PORT/USERNAME/PASSWORD를 OS 환경변수로 지정한다(.env.example 참고).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

  servlet:
    multipart:
      # 사진 업로드의 실제 수신 한도. 설정이 없으면 기본 1MB라 PostImageService의 5MB 검사·화면 안내("최대 5MB")에 닿기 전에 컨테이너가
      # 거절한다. 5MB로 딱 맞추지 않고 한 단계 위(6MB)로 둬 5MB 규칙의 판정자를 PostImageService 하나로 일원화하고, 더 큰 요청은
      # ApiExceptionHandler가 413으로 받는다.
      max-file-size: 6MB
      max-request-size: 7MB
      # 파싱을 파일 파라미터 접근 시점까지 미룬다 — 아니면 한도를 넘길 때 핸들러 진입 전에 연결이 리셋되어 413 본문 없이 끊긴다.
      resolve-lazily: true

  task:
    scheduling:
      shutdown:
        # 재배포 때 systemctl restart가 진행 중인 예약 작업(outbox 발송, 이미지 정리 등)을 끊지 않고 끝나길 기다린다.
        # deploy/kraft.service의 TimeoutStopSec(30s)보다 짧게 잡아 SIGKILL로 넘어가지 않게 한다.
        await-termination: true
        await-termination-period: 25s

  threads:
    virtual:
      # 가상 스레드: 톰캣 요청 처리·@Async 등 Spring Boot 실행기를 플랫폼 스레드 풀 대신 가상 스레드로 구동한다(Java 25 툴체인).
      enabled: true

app:
  # 이 jar를 만든 커밋(buildVersion, 보통 짧은 git SHA). /healthz가 X-Kraft-Build로 내려주고 CI의 배포 후 확인이 비교한다.
  build-version: "@buildVersion@"
  mail:
    # 발신 주소(From). 비우면 spring.mail.username을 쓴다. SPF/DMARC가 맞는 도메인이어야 스팸함으로 덜 간다.
    from: ${MAIL_FROM:}
    # 메일 발송은 DB 트랜잭션 밖에서 한다(OutboxMailWorker): 가입·재발송 직후 한 번, 실패했거나 앱이 내려가 있던 것은 주기 작업이 다시.
    enabled: true
    batch-size: 20
    max-attempts: 5
    drain-initial-delay-ms: 30000
    drain-interval-ms: 60000
    # 이 시간 넘게 "발송 중"이면 도중에 중단된 것으로 보고 대기열로 되돌린다.
    stuck-after-ms: 300000
    # 한 배치 안에서 동시에 SMTP로 보내는 최대 개수.
    max-concurrent-sends: 5
    # 종료 상태(SENT/FAILED) 행의 보관 기한과 정리 주기(코드 기본값과 같은 값을 적어 운영값을 이 파일에서 보이게).
    retention-days: 30
    retention-initial-delay-ms: 60000
    retention-interval-ms: 86400000

  verification:
    # 만료된 인증 토큰 정리 주기(ExpiredTokenPurger, 코드 기본값과 같은 값).
    purge-enabled: true
    purge-initial-delay-ms: 900000
    purge-interval-ms: 86400000
    # 가입 직후 인증 메일 대기열 등록이 누락된 GUEST를 복구하는 최후 수단(GuestVerificationSweeper). 진행 중인 가입을 건드리지 않게 유예시간을 둔다.
    sweep-grace-minutes: 10
    sweep-batch-size: 50
    sweep-initial-delay-ms: 600000
    sweep-interval-ms: 1800000

  post:
    # 소프트 삭제된 글을 이 기간 뒤 영구 삭제한다(PostPurger, 그동안 관리자가 복구할 수 있다). 코드 기본값과 같은 값.
    purge-retention-days: 30
    purge-enabled: true
    purge-batch-size: 100
    purge-initial-delay-ms: 1800000
    purge-interval-ms: 86400000

  session-revocation:
    # 세션 폐기를 영속 태스크로 남긴다. 대부분 커밋 직후 빠른 경로에서 끝나고, 실패했거나 프로세스가 죽은 것만 이 주기 작업이
    # 다시 집는다(outbox_mails와 같은 claim/재시도 구조).
    max-attempts: 5
    batch-size: 20
    drain-initial-delay-ms: 60000
    drain-interval-ms: 120000
    # 이 시간 넘게 "처리 중"이면 도중에 중단된 것으로 보고 대기열로 되돌린다.
    stuck-after-ms: 300000
    retention-days: 30
    retention-initial-delay-ms: 120000
    retention-interval-ms: 86400000

  metrics:
    # 앱이 스스로 상태를 점검해 logs/kraft-metrics.log에 한 줄씩 남기고, 기준을 넘기면 ERROR로 logs/kraft-error.log에도 남긴다
    # (프로브를 찌를 오케스트레이터가 없다).
    enabled: true
    initial-delay-ms: 60000
    interval-ms: 300000
    # 오류율·응답 지연은 요청이 이만큼은 모여야 판정한다. 표본이 적으면 비율이 요동친다.
    min-requests: 20
    error-rate: 0.1
    # 5xx는 비율과 무관하게 한 건만 나와도 남긴다. 사용자 잘못이 아니기 때문이다.
    server-errors: 0
    avg-response-ms: 1000
    pool-usage: 0.8
    # 1GB. 업로드 디렉터리가 있는 디스크 기준.
    disk-free-bytes: 1073741824
    mail-pending: 20
    mail-failed: 0
    # 평균·최댓값에 묻히는 소수의 느린 요청: slow-request-ms를 넘는 건수를 세고, slow-requests를 넘으면 알린다.
    slow-request-ms: 3000
    slow-requests: 5
    # 기준을 넘기면 관리자에게 메일로도 알린다(AlertMailer). 비우면(기본값, 로컬) 로그만 남긴다 — 운영 주소는 application-prod.yml.
    # 같은 종류는 이 간격(기본 1시간)에 한 번만 보낸다.
    alert-email: ""
    alert-cooldown-ms: 3600000

  upload:
    # 사진 업로드 저장 경로(상대 경로는 실행 위치 기준). 임시 파일시스템이면 재배포 때 유실될 수 있어 영구 볼륨이나 오브젝트 스토리지를 권장한다.
    dir: uploads/images
    # 삭제 예약(PENDING_DELETE)·만료된 미연결(ORPHAN) 이미지 정리. 예약분은 커밋 직후에도 한 번 정리되므로 이 주기는 실패·프로세스 종료분의 안전망이다.
    cleanup-enabled: true
    cleanup-initial-delay-ms: 600000
    cleanup-interval-ms: 3600000
    # 디스크-대장 대조(OrphanFileReconciler) — 파일은 저장됐는데 대장 등록이 실패해 남은 파일의 최후 수단이라 cleanup보다 드물어도 충분하다.
    reconcile-enabled: true
    reconcile-initial-delay-ms: 1800000
    reconcile-interval-ms: 3600000
    # 한 주기가 볼 파일 수의 상한(넘는 나머지는 다음 주기로).
    reconcile-max-files-per-run: 50000
  recommend:
    # 기능 전체 스위치. 끄면 /recommend·POST /api/v1/numbers/recommend 빈이 등록되지 않아 404가 되고 navbar 링크도 사라진다.
    enabled: true
    auto-fetch:
      # 매주 토 21:30·22:00, 일 06:00·07:00(KST)에 최신 회차를 받아온다(RecommendationAutoFetchScheduler). 끄면 이력 갱신은
      # recommend-backfill 프로파일로만 가능하고 /recommend·API는 계속 동작한다.
      enabled: true
    dhlottery:
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
    rate-limit:
      # IP당 분당 요청 한도(실측 트래픽에 맞춰 재배포 없이 조정).
      requests-per-minute: 30
      # 허용/거부 집계를 로그로 남기는 주기 — 한도 조정 근거.
      report-interval-ms: 600000

  auth:
    rate-limit:
      # 로그인·가입·비밀번호 재설정·인증 메일 재발송의 분당 요청 한도(초기 검토값, 재배포 없이 조정).
      enabled: true
      login-per-minute: 20
      login-account-per-minute: 10
      signup-per-minute: 5
      password-reset-per-minute: 5
      resend-per-minute: 5
      report-interval-ms: 600000

  write:
    rate-limit:
      # 게시글·댓글·업로드·검색의 계정(검색은 IP) 기준 속도 제한(실측 전 초기값 — WriteRateLimiters.reportAndCleanup 집계가 조정 근거).
      enabled: true
      post-per-minute: 3
      post-per-hour: 20
      comment-per-minute: 10
      upload-per-minute: 10
      search-per-minute: 60
      report-interval-ms: 600000

  # 이메일 인증 링크의 기본 URL. 운영에서는 실제 도메인으로 덮어쓴다(application-prod.yml).
  base-url: http://localhost:8080

# 요청 상관관계 id를 로그 줄마다 남긴다(RequestIdFilter). LOG_LEVEL_PATTERN만 바꾸면 logback-spring.xml의 모든 appender
# (${FILE_LOG_PATTERN})에 반영된다. 요청과 무관한 로그는 대괄호가 빈 채로 찍힌다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
