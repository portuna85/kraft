# 정적 자원(CSS·JS)을 gzip으로 압축해 보낸다. 텍스트 계열만 대상으로 하고(이미지·폰트는
# 이미 압축된 형식이라 다시 압축해도 줄지 않는다), 너무 작은 응답은 압축 오버헤드가 더
# 크므로 1KB 미만은 그대로 보낸다.
server:
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: kraft

  profiles:
    default: local

  jpa:
    open-in-view: false

  data:
    web:
      pageable:
        # 클라이언트가 size= 파라미터로 임의의 큰 페이지를 요청하지 못하게 상한을 둔다
        # (개선 보고서 "검색과 깊은 페이지의 비용"). 기존 테스트의 최대 사용값(50)과 같다.
        max-page-size: 50

  flyway:
    # local(Docker MariaDB, ddl-auto: update)과 test(H2, create-drop)는 Hibernate가 엔티티
    # 매핑으로 스키마를 직접 만들므로 Flyway를 끈다. 운영(application-prod.yml)에서만
    # 명시적으로 켠다 — 두 스키마 관리자가 같은 DB를 동시에 건드리면 예측하기 어려워지기
    # 때문이다(예전 local은 create-drop이라 Flyway가 만든 테이블을 Hibernate가 다시 지웠다).
    enabled: false

  session:
    store-type: jdbc

  web:
    resources:
      cache:
        # 정적 자원의 재검증 캐시. no-store를 걷어낸 것은 SecurityConfig의
        # staticResourceChain이다 — 여기서는 조건부 요청(If-Modified-Since)이
        # 통하도록 Last-Modified를 남기고, max-age는 0으로 두어 매번 서버에 물어는
        # 보되(왕복은 남는다) 내용이 같으면 304만 받게 한다. 파일명에 해시가 없어서
        # (Vue 산출물이 리뷰 가능한 diff를 위해 의도적으로 고정 이름을 쓴다) 여기서
        # 곧바로 장기 캐시를 걸면 배포 후에도 낡은 파일을 계속 쓰게 될 위험이 있다.
        use-last-modified: true
        cachecontrol:
          max-age: 0
          must-revalidate: true

  # 모든 프로파일(local 포함, 2026-09-11부터)이 실제 SMTP로 인증 메일을 보낸다(SmtpEmailSender).
  # 값에 기본값을 둔 이유: spring.mail.host는 @ConditionalOnProperty로 JavaMailSender 자동
  # 구성 여부를 가르는데, 이 Spring Boot 버전은 값이 없는 플레이스홀더를 조건 평가 시점에
  # PlaceholderResolutionException으로 던진다(gradlew test 실측 — DataSource처럼 리터럴
  # 문자열을 그대로 넘기며 조용히 통과하지 않음). 기본값(localhost)을 주면 빈은 항상 만들어지고,
  # JavaMailSenderImpl은 빈 생성 시점에 실제로 연결하지 않으므로 기동은 항상 성공한다 — 메일을
  # 실제로 보내는 시점(회원가입·재발송)에만, 값이 없거나 틀리면 그때 실패가 드러난다.
  # 로컬에서 실제로 받아보려면 MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD를 OS 환경변수로
  # 지정한 뒤 실행한다(.env.example 참고 — DB 접속 정보와 같은 .env 파일에서 함께 로드한다).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

  servlet:
    multipart:
      # 게시글 사진 업로드의 실제 수신 한도. 설정이 없으면 Spring Boot 기본값이
      # max-file-size=1MB로 적용되어, PostImageService의 5MB 검사와 화면 안내("최대 5MB")에
      # 닿기도 전에 1MB 초과 파일이 컨테이너에서 거절된다(용량 안내 대신 알 수 없는 오류).
      #
      # 값을 5MB로 "딱 맞추지" 않는 이유: 경계값에서 컨테이너가 먼저 거절하면 서비스가 내는
      # "파일 크기는 5MB를 초과할 수 없습니다."와 다른 경로의 오류가 섞인다. 컨테이너 한도를
      # 한 단계 위에 두어 5MB 규칙의 판정자를 PostImageService 하나로 일원화한다.
      # 그보다 큰 요청은 ApiExceptionHandler가 413으로 받아낸다.
      max-file-size: 6MB
      max-request-size: 7MB
      # 파싱을 컨트롤러가 파일 파라미터에 실제로 접근하는 시점까지 미룬다. 이게 없으면
      # DispatcherServlet이 핸들러 진입 전에 멀티파트 전체를 즉시 읽다가 한도를 넘겨 커넥션이
      # 리셋되고, ApiExceptionHandler가 413을 내려주기도 전에 클라이언트는 본문 없는 응답만
      # 받는다(로컬 실측으로 확인 — ApiExceptionHandler.handleUploadTooLarge() 주석 참고).
      resolve-lazily: true

  threads:
    virtual:
      # 가상 스레드(Java 21+ Project Loom) 활성화. 톰캣 요청 처리·@Async 등 Spring Boot가
      # 관리하는 실행기를 플랫폼 스레드 풀 대신 가상 스레드로 구동한다. 이 프로젝트는
      # Java 25 툴체인을 쓰므로(build.gradle.kts) 별도 준비 없이 바로 켤 수 있다.
      enabled: true

app:
  mail:
    # 메일 발송은 DB 트랜잭션 밖에서 처리한다(OutboxMailWorker). 가입·재발송 직후 한 번 보내고,
    # 그때 실패했거나 앱이 내려가 있던 것을 주기 작업이 다시 시도한다.
    enabled: true
    batch-size: 20
    max-attempts: 5
    drain-initial-delay-ms: 30000
    drain-interval-ms: 60000
    # 이 시간 넘게 "발송 중"이면 도중에 중단된 것으로 보고 대기열로 되돌린다.
    stuck-after-ms: 300000
    # 한 배치 안에서 동시에 SMTP로 보내는 최대 개수(개선 보고서 "메일 임대·재시도·실행량 제한").
    max-concurrent-sends: 5
    # 종료 상태(SENT/FAILED) 행의 보관 기한과 정리 주기. 코드 기본값(30일)과 같은 값을
    # 명시적으로 적어, 실제 운영값이 무엇인지 이 파일만 보고 알 수 있게 한다.
    retention-days: 30
    retention-initial-delay-ms: 60000
    retention-interval-ms: 86400000

  verification:
    # 만료된 인증 토큰을 지우는 주기(ExpiredTokenPurger). 코드 기본값과 같은 값을
    # 명시적으로 적어 둔다.
    purge-enabled: true
    purge-initial-delay-ms: 900000
    purge-interval-ms: 86400000
    # 가입 직후 인증 메일 대기열 등록의 최종 커밋이 실패해 메일이 한 번도 큐에 들어가지
    # 못한 GUEST 계정을 찾아 복구하는 최후 수단(B08, GuestVerificationSweeper). 가입 직후
    # 진행 중인 트랜잭션을 건드리지 않도록 유예시간을 둔다.
    sweep-grace-minutes: 10
    sweep-batch-size: 50
    sweep-initial-delay-ms: 600000
    sweep-interval-ms: 1800000

  session-revocation:
    # 비밀번호 변경·재설정·탈퇴 커밋 직후 세션 폐기를 영속 태스크로 남긴다(B06). 대부분은
    # 커밋 직후 빠른 경로에서 바로 끝나고, 실패하거나 그 직후 프로세스가 죽은 것만 이 주기
    # 작업이 다시 집는다. outbox_mails와 같은 claim/재시도 구조를 그대로 쓴다.
    max-attempts: 5
    batch-size: 20
    drain-initial-delay-ms: 60000
    drain-interval-ms: 120000
    # 이 시간 넘게 "처리 중"이면 도중에 중단된 것으로 보고 대기열로 되돌린다.
    stuck-after-ms: 300000
    retention-days: 30
    retention-initial-delay-ms: 120000
    retention-interval-ms: 86400000

  metrics:
    # 앱이 스스로 상태를 점검해 logs/kraft-metrics.log에 한 줄씩 남긴다. 기준을 넘기면 ERROR로
    # 올려 logs/kraft-error.log에도 남는다. 외부 수집기나 상태 확인 엔드포인트에 의존하지 않는다
    # — 이 앱은 호스트에서 직접 실행되어 프로브를 찌를 오케스트레이터가 없다.
    enabled: true
    initial-delay-ms: 60000
    interval-ms: 300000
    # 오류율·응답 지연은 요청이 이만큼은 모여야 판정한다. 표본이 적으면 비율이 요동친다.
    min-requests: 20
    error-rate: 0.1
    # 5xx는 비율과 무관하게 한 건만 나와도 남긴다. 사용자 잘못이 아니기 때문이다.
    server-errors: 0
    avg-response-ms: 1000
    pool-usage: 0.8
    # 1GB. 업로드 디렉터리가 있는 디스크 기준.
    disk-free-bytes: 1073741824
    mail-pending: 20
    mail-failed: 0
    # 미처리 신고. 다른 항목과 달리 앱이 아니라 사람이 멈춘 신호다 — 쌓이는 동안 신고된 글은
    # 그대로 보인다. 5분마다 울리지 않도록 하루치 정도로 넉넉히 잡는다.
    reports-pending: 20

  upload:
    # 게시글 사진 업로드 저장 경로(상대 경로는 애플리케이션 실행 위치 기준). 운영 환경에서
    # 컨테이너 재배포 시 파일이 유실될 수 있으므로(임시 파일시스템), 영구 볼륨을 마운트하거나
    # 오브젝트 스토리지로 교체하는 것을 권장한다(이번 범위에서는 로컬 디스크로 구현).
    dir: uploads/images
    # 삭제 예약(PENDING_DELETE)·만료된 미연결(ORPHAN) 이미지 파일을 치우는 주기 작업.
    # 삭제 예약분은 게시글 수정·삭제 커밋 직후에도 곧바로 한 번 정리되므로, 이 주기는
    # "그때 실패했거나 프로세스가 죽어서 남은 것"을 다시 시도하는 안전망이다.
    cleanup-enabled: true
    cleanup-initial-delay-ms: 600000
    cleanup-interval-ms: 3600000
    # 디스크-대장 대조(OrphanFileReconciler). 파일 저장은 됐는데 대장 등록·최종 커밋이
    # 실패해 대장 없는 파일이 남는 경우의 최후 수단이다(개선 보고서 "파일 저장 성공 후
    # 최종 커밋 실패 시 대장 없는 파일"). cleanup보다 드물게 돌아도 충분하다.
    reconcile-enabled: true
    reconcile-initial-delay-ms: 1800000
    reconcile-interval-ms: 3600000
  # 이메일 인증 링크를 만들 때 붙일 기본 URL. 운영에서는 실제 배포 도메인으로 덮어써야 한다
  # (application-prod.yml 참고).
  base-url: http://localhost:8080
