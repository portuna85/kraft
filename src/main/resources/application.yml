spring:
  application:
    name: kraft

  profiles:
    default: local

  jpa:
    open-in-view: false

  session:
    store-type: jdbc

  threads:
    virtual:
      # 가상 스레드(Java 21+ Project Loom) 활성화. 톰캣 요청 처리·@Async 등 Spring Boot가
      # 관리하는 실행기를 플랫폼 스레드 풀 대신 가상 스레드로 구동한다. 이 프로젝트는
      # Java 25 툴체인을 쓰므로(build.gradle.kts) 별도 준비 없이 바로 켤 수 있다.
      enabled: true

app:
  upload:
    # 게시글 사진 업로드 저장 경로(상대 경로는 애플리케이션 실행 위치 기준). 운영 환경에서
    # 컨테이너 재배포 시 파일이 유실될 수 있으므로(임시 파일시스템), 영구 볼륨을 마운트하거나
    # 오브젝트 스토리지로 교체하는 것을 권장한다(이번 범위에서는 로컬 디스크로 구현).
    dir: uploads/images
  # 이메일 인증 링크를 만들 때 붙일 기본 URL. 운영에서는 실제 배포 도메인으로 덮어써야 한다
  # (application-prod.yml 참고).
  base-url: http://localhost:8080
