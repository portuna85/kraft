<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' — KRAFT 관리자'">KRAFT 관리자</title>
  <style>
    :root { color-scheme: dark; --canvas:#0b1020; --surface:#121a2d; --surface-raised:#18233a; --line:#2b3853; --text:#eff4ff; --muted:#aebbd1; --brand:#7c8cff; --brand-strong:#aab5ff; --success:#78d6a7; --danger:#ff9b9b; --focus:#b9c2ff; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 80% -10%,#1f3156 0,transparent 28rem),var(--canvas); color:var(--text); display:flex; min-height:100vh; line-height:1.5; }
    .skip-link { position:absolute; left:1rem; top:-4rem; z-index:10; background:var(--text); color:var(--canvas); padding:.7rem 1rem; border-radius:.65rem; font-weight:700; }
    .skip-link:focus { top:1rem; }
    nav { width:232px; flex-shrink:0; background:rgba(18,26,45,.94); border-right:1px solid var(--line); padding:1.5rem 1rem; display:flex; flex-direction:column; gap:.35rem; }
    nav h2 { color:var(--brand-strong); font-size:.9rem; letter-spacing:.08em; text-transform:uppercase; margin:.3rem .65rem 1.15rem; }
    nav a { color:var(--muted); text-decoration:none; padding:.6rem .7rem; border-radius:.7rem; font-size:.9rem; min-height:44px; display:flex; align-items:center; transition:background .16s,color .16s; }
    nav a:hover, nav a.active { background:rgba(124,140,255,.14); color:var(--text); }
    nav .logout { margin-top:auto; color:var(--danger); font-size:.82rem; }
    .logout button { width:100%; background:none; border:0; color:inherit; cursor:pointer; font:inherit; text-align:left; min-height:44px; padding:.6rem .7rem; border-radius:.7rem; }
    .logout button:hover { background:rgba(255,155,155,.09); }
    main { flex:1; min-width:0; padding:clamp(1.25rem,3vw,2.75rem); overflow-y:auto; }
    h1 { font-size:clamp(1.45rem,2vw,1.9rem); letter-spacing:-.03em; margin:0; color:var(--text); }
    h2 { margin:0; }
    .admin-page-header { display:grid; gap:.35rem; margin-bottom:1.5rem; }
    .admin-eyebrow { margin:0; color:var(--brand-strong); font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .admin-page-lead { margin:0; color:var(--muted); font-size:.92rem; }
    .alert { display:flex; align-items:flex-start; gap:.55rem; border-radius:.8rem; font-size:.9rem; padding:.75rem .9rem; margin-bottom:1rem; border:1px solid; }
    .alert-success { background:rgba(120,214,167,.1); border-color:rgba(120,214,167,.35); color:var(--success); }
    .alert-error { background:rgba(255,155,155,.1); border-color:rgba(255,155,155,.35); color:var(--danger); }
    .admin-card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-bottom:1.75rem; }
    .admin-card, .admin-empty-state, .admin-section { background:rgba(24,35,58,.82); border:1px solid var(--line); border-radius:1rem; }
    .admin-card { padding:1.2rem; display:grid; gap:.3rem; }
    .admin-card-label { margin:0; color:var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.04em; }
    .admin-card-value { margin:0; color:var(--text); font-size:1.35rem; font-weight:750; font-variant-numeric:tabular-nums; }
    .admin-card-copy { margin:0; color:var(--text); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .admin-card-meta { margin:0; color:var(--muted); font-size:.8rem; }
    .admin-empty-state { padding:1.25rem; color:var(--muted); margin-bottom:1.5rem; }
    .admin-empty-state p { margin:0; }
    .admin-section { padding:1.2rem; margin-top:1.25rem; }
    .admin-section-title { font-size:1rem; }
    .admin-section-description { margin:.3rem 0 1rem; color:var(--muted); font-size:.86rem; max-width:72ch; }
    .admin-action-row { display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end; }
    .admin-inline-form { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .admin-input { min-height:44px; width:132px; background:var(--canvas); border:1px solid var(--line); border-radius:.65rem; color:var(--text); font:inherit; padding:.55rem .7rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:.55rem .9rem; border-radius:.65rem; font-size:.85rem; font-weight:700; text-decoration:none; border:1px solid transparent; cursor:pointer; transition:background .16s,transform .16s; }
    .btn-primary { background:var(--brand); color:#0b1020; }
    .btn-primary:hover { background:var(--brand-strong); transform:translateY(-1px); }
    .btn-sm { min-height:40px; padding:.45rem .7rem; font-size:.8rem; }
    .pagination { display:flex; flex-wrap:wrap; gap:.7rem; margin-top:1rem; align-items:center; font-size:.86rem; color:var(--muted); }
    .pagination a { color:var(--brand-strong); text-decoration:none; font-weight:700; min-height:44px; display:inline-flex; align-items:center; }
    .table-scroll { overflow-x:auto; border:1px solid var(--line); border-radius:1rem; background:rgba(18,26,45,.58); }
    .admin-table { width:100%; min-width:680px; border-collapse:collapse; font-size:.875rem; }
    .admin-table th { background:rgba(24,35,58,.9); color:var(--muted); text-align:left; padding:.75rem .9rem; border-bottom:1px solid var(--line); font-size:.78rem; letter-spacing:.03em; }
    .admin-table td { padding:.75rem .9rem; border-bottom:1px solid rgba(43,56,83,.7); vertical-align:top; }
    .admin-table tbody tr:last-child td { border-bottom:0; }
    .admin-table tbody tr:hover td { background:rgba(124,140,255,.07); }
    .admin-table .empty-cell { text-align:center; color:var(--muted); padding:1.5rem; }
    .admin-table .audit-failure td { background:rgba(255,155,155,.08); }
    .table-scroll:focus-visible, nav a:focus-visible, .btn:focus-visible, .logout button:focus-visible, .admin-input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:768px) { body { flex-direction:column; } nav { width:100%; flex-direction:row; align-items:center; overflow-x:auto; padding:.7rem 1rem; gap:.4rem; } nav h2 { display:none; } nav a { flex-shrink:0; } nav .logout { margin-top:0; margin-left:auto; flex-shrink:0; } main { padding:1.25rem 1rem 2rem; } .admin-action-row > form, .admin-action-row > .admin-inline-form { width:100%; } .admin-inline-form .admin-input { flex:1 1 150px; } .btn { flex:1 1 auto; } }
  </style>
</head>
<body>
<a class="skip-link" href="#admin-main">본문으로 건너뛰기</a>
<nav aria-label="관리자 메뉴">
  <h2>KRAFT 관리자</h2>
  <a th:href="@{/admin/dashboard}"
     th:classappend="${#strings.startsWith(currentPath, '/admin/dashboard')} ? ' active'">대시보드</a>
  <a th:href="@{/admin/rounds}"
     th:classappend="${#strings.startsWith(currentPath, '/admin/rounds')} ? ' active'">회차 관리</a>
  <a th:href="@{/admin/audit}"
     th:classappend="${#strings.startsWith(currentPath, '/admin/audit')} ? ' active'">감사 로그</a>
  <form th:action="@{/admin/logout}" method="post" class="logout">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit"
            sec:authentication="name">로그아웃</button>
  </form>
</nav>
<main id="admin-main">
  <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
  <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
  <th:block th:replace="${content}"/>
</main>
</body>
</html>
