<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:fragment="layout(title, content)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' — KRAFT 관리자'">KRAFT 관리자</title>
    <link rel="stylesheet" th:href="@{/admin.css}" href="/admin.css" />
  </head>
  <body class="admin-shell">
    <a class="skip-link" href="#admin-main">본문으로 건너뛰기</a>
    <nav aria-label="관리자 메뉴">
      <h2>KRAFT 관리자</h2>
      <a
        th:href="@{/admin/dashboard}"
        th:classappend="${#strings.startsWith(currentPath, '/admin/dashboard')} ? ' active'"
        >대시보드</a
      >
      <a
        th:href="@{/admin/rounds}"
        th:classappend="${#strings.startsWith(currentPath, '/admin/rounds')} ? ' active'"
        >회차 관리</a
      >
      <a
        th:href="@{/admin/audit}"
        th:classappend="${#strings.startsWith(currentPath, '/admin/audit')} ? ' active'"
        >감사 로그</a
      >
      <form th:action="@{/admin/logout}" method="post" class="logout">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />
        <button type="submit" sec:authentication="name">로그아웃</button>
      </form>
    </nav>
    <main id="admin-main">
      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
      <th:block th:replace="${content}" />
    </main>
  </body>
</html>
