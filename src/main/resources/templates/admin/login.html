<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>KRAFT 관리자 로그인</title>
  <link rel="stylesheet" th:href="@{/admin.css}" href="/admin.css"/>
</head>
<body class="admin-login">
<div class="card">
  <h1>KRAFT 관리자</h1>
  <p class="sub">내부 관리 콘솔</p>

  <div class="alert alert-error" th:if="${param.error}" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  <div class="alert alert-warn" th:if="${param.locked}" role="alert">로그인 시도 횟수를 초과했습니다. 잠시 후 다시 시도하세요.</div>
  <div class="alert alert-warn" th:if="${param.expired}" role="alert">로그인 페이지가 만료되었습니다. 다시 로그인하세요.</div>
  <div class="alert alert-success" th:if="${param.logout}" role="status">로그아웃되었습니다.</div>

  <form method="post" action="/admin/login" th:action="@{/admin/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="username">사용자명</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required/>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>
    <button type="submit">로그인</button>
  </form>
</div>
</body>
</html>
