<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('회차 관리', ~{::content})}">
<th:block th:fragment="content">
  <header class="admin-page-header">
    <p class="admin-eyebrow">데이터 관리</p>
    <h1>회차 관리</h1>
    <p class="admin-page-lead">회차 데이터를 조회하고 필요한 수집 작업을 안전하게 실행합니다.</p>
  </header>

  <section class="admin-section" aria-label="회차 수집 작업">
  <div class="admin-action-row">
    <form th:action="@{/admin/rounds/collect}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-primary">최신 회차 수집</button>
    </form>
    <form th:action="@{/admin/rounds/collect}" method="post" class="admin-inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label class="sr-only" for="round-number">회차 번호</label>
      <input id="round-number" type="number" name="round" min="1" placeholder="회차 번호" class="admin-input"/>
      <button type="submit" class="btn btn-primary btn-sm">수집</button>
    </form>
    <form th:action="@{/admin/rounds/collect-all}" method="post"
          onsubmit="return confirm('누락된 가장 이른 회차부터 최신 회차까지 전체 수집을 시작합니다. 수 분이 소요될 수 있습니다. 계속하시겠습니까?');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-primary">전체 회차 수집</button>
    </form>
  </div>
  </section>

  <div class="table-scroll" tabindex="0" role="region" aria-label="회차 목록 표">
  <table class="admin-table">
    <caption class="sr-only">수집된 로또 회차 목록</caption>
    <thead>
    <tr>
      <th>회차</th><th>추첨일</th><th>1·2·3·4·5·6 + 보너스</th><th>1등 당첨금</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rounds.items}">
      <td th:text="${r.round}"></td>
      <td th:text="${r.drawDate}"></td>
      <td th:text="${r.num1}+', '+${r.num2}+', '+${r.num3}+', '+${r.num4}+', '+${r.num5}+', '+${r.num6}+' + '+${r.bonusNumber}"></td>
      <td th:text="${#numbers.formatDecimal(r.firstPrizeAmount,0,'COMMA',0,'POINT')} + '원'"></td>
    </tr>
    <tr th:if="${rounds.items.isEmpty()}">
      <td colspan="4" class="empty-cell">조회된 회차 데이터가 없습니다.</td>
    </tr>
    </tbody>
  </table>
  </div>

  <div class="pagination">
    <span th:text="'전체 ' + ${rounds.totalElements} + '건 (페이지 ' + (${rounds.page} + 1) + ' / ' + ${rounds.totalPages} + ')'"></span>
    <a th:if="${rounds.page > 0}" th:href="@{/admin/rounds(page=${rounds.page - 1})}">이전</a>
    <a th:if="${rounds.page + 1 < rounds.totalPages}" th:href="@{/admin/rounds(page=${rounds.page + 1})}">다음</a>
  </div>
</th:block>
</html>
