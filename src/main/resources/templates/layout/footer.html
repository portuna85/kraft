<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- 이동 후 한 번만 표시되는 결과 메시지 영역. 내용은 index.js의 flash가 채운다. -->
<div th:fragment="flash" id="flash" class="flash" role="status" hidden>
    <span id="flash-text"></span>
</div>

<div th:fragment="footer">
    <!-- next는 기본적으로 비어 있고(= Referer 기준 복귀), 비밀번호 변경 성공 시에만 JS가
         "/login"을 채워 로그인 화면으로 보낸다(SecurityConfig의 로그아웃 성공 처리 참고). -->
    <form id="logout-form" th:action="@{/logout}" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="next" id="logout-next" value="">
    </form>

    <div id="toast-container">
        <div id="app-toast" class="toast" role="status" aria-live="polite" aria-atomic="true"
             data-bs-delay="3000">
            <div class="toast-header">
                <strong class="me-auto" id="app-toast-title">알림</strong>
                <button type="button" class="btn-close ms-2" data-bs-dismiss="toast" aria-label="닫기"></button>
            </div>
            <div class="toast-body" id="app-toast-body"></div>
        </div>
    </div>

    <!--
      게시글·댓글이 함께 쓰는 삭제 확인 모달. 제목과 본문 문구는 대상에 따라 JS가 바꾸고,
      기본 포커스는 "취소"에 둔다.
    -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" role="dialog"
         aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="confirmDeleteModalLabel">삭제 확인</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body" id="confirmDeleteMessage">삭제하시겠습니까?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-delete"
                            data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-danger" id="btn-confirm-delete">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      비밀번호 변경 모달. 별도 화면(/users/me/password)을 없애고 어느 화면에서든 헤더의
      "비밀번호 변경"으로 바로 열도록 바꿨다. 오류는 화면 이동이 없으므로 flash가 아니라
      모달 안에서 보여준다(#change-password-error). 성공하면 기존 정책대로 로그아웃하고
      로그인 화면으로 보낸다 — 이때 로그아웃 폼에 next=/login을 실어 보낸다.
    -->
    <div sec:authorize="isAuthenticated()" class="modal fade" id="changePasswordModal" tabindex="-1"
         role="dialog" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="changePasswordModalLabel">비밀번호 변경</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="change-password-error" class="flash flash--danger" role="alert" hidden></div>
                    <form id="change-password-form">
                        <div class="mb-3">
                            <label for="currentPassword">현재 비밀번호</label>
                            <input type="password" class="form-control" id="currentPassword"
                                   autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label for="newPassword">새 비밀번호 (8자 이상, 대문자·소문자·특수문자 포함)</label>
                            <input type="password" class="form-control" id="newPassword"
                                   autocomplete="new-password">
                        </div>
                    </form>
                    <p class="text-muted mb-0">변경하면 자동으로 로그아웃되고 로그인 화면으로 이동합니다.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btn-change-password">변경하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 인증 메일 재발송 확인 모달. 누르는 즉시 메일이 나가던 것을 한 번 확인받도록 바꿨다. -->
    <div sec:authorize="hasRole('GUEST')" class="modal fade" id="resendVerificationModal" tabindex="-1"
         role="dialog" aria-labelledby="resendVerificationModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="resendVerificationModalLabel">인증 메일 재발송</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">가입한 이메일 주소로 인증 메일을 다시 보냅니다.</p>
                    <p class="text-muted mb-0">이전에 받은 인증 링크는 더 이상 사용할 수 없습니다.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-resend">재발송</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      jQuery 4.0.0. 3.3.1에는 3.5.0에서 고쳐진 DOM 처리 관련 보안 수정이 빠져 있었다.
      4.x는 메이저 업그레이드지만 제거된 API($.trim, .bind(), $.isFunction 등)를 이 앱은
      쓰지 않는다 — index.js는 .val/.attr/.on/.ajax 같은 표준 API만 사용한다.

      Bootstrap 5는 jQuery에 의존하지 않는다. 그래서 아래 두 스크립트의 순서는 더 이상
      중요하지 않지만, index.js가 jQuery와 전역 bootstrap 객체를 모두 쓰므로 index.js는
      반드시 뒤에 와야 한다.

      Popper가 필요한 컴포넌트(드롭다운·툴팁·팝오버)는 쓰지 않으므로 bundle 대신
      본체만 불러온다.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
            integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
            referrerpolicy="no-referrer"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
            integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
            referrerpolicy="no-referrer"
            crossorigin="anonymous"></script>

    <!--index.js 추가-->
    <script src="/js/app/index.js"></script>
</div>
</body>
</html>
