<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<body>

<!-- 이동 후 한 번만 표시되는 결과 메시지 영역. 내용은 ui/flash.js가 채운다. -->
<div th:fragment="flash" id="flash" class="flash" role="status" hidden>
    <span id="flash-text"></span>
</div>

<div th:fragment="footer">
    <!-- 로그아웃은 CSRF 토큰이 필요한 POST라 감춰 둔 폼으로 보낸다. 헤더의 로그아웃 버튼이
         이 폼을 제출한다(features/account.js).
         next 히든 필드는 없앴다 — 비밀번호 변경이 /login으로 직접 이동하도록 바뀌면서
         아무도 채우지 않게 됐고, 빈 값은 SecurityConfig에서 Referer 규칙으로 넘어간다. -->
    <form id="logout-form" th:action="@{/logout}" method="post" hidden>
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
    </form>

    <div id="toast-container">
        <div id="app-toast" class="toast" role="status" aria-live="polite" aria-atomic="true"
             data-bs-delay="3000">
            <div class="toast-header">
                <strong class="me-auto" id="app-toast-title">알림</strong>
                <button type="button" class="btn-close ms-2" data-bs-dismiss="toast" aria-label="닫기"></button>
            </div>
            <div class="toast-body" id="app-toast-body"></div>
        </div>
    </div>

    <!--
      게시글·댓글이 함께 쓰는 삭제 확인 모달. 제목과 본문 문구는 대상에 따라 JS가 바꾸고,
      기본 포커스는 "취소"에 둔다.
    -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" role="dialog"
         aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="confirmDeleteModalLabel">삭제 확인</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body" id="confirmDeleteMessage">삭제하시겠습니까?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-delete"
                            data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-danger" id="btn-confirm-delete">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      비밀번호 변경 모달. 별도 화면(/users/me/password)을 없애고 어느 화면에서든 헤더의
      "비밀번호 변경"으로 바로 열도록 바꿨다. 오류는 화면 이동이 없으므로 flash가 아니라
      모달 안에서 보여준다(#change-password-error). 성공하면 로그인 화면으로 보낸다 — 세션 폐기는
      서버가 하므로(UserService.changePassword) 화면에서 로그아웃을 따로 호출하지 않는다.
    -->
    <div sec:authorize="isAuthenticated()" class="modal fade" id="changePasswordModal" tabindex="-1"
         role="dialog" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="changePasswordModalLabel">비밀번호 변경</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="change-password-error" class="flash flash--danger" role="alert" hidden></div>
                    <!--/* 진짜 submit이라 Enter로도 제출되고 required·minlength가 먼저 걸린다.
                           제출 버튼은 모달 푸터에 있어 form 속성으로 이 폼과 연결한다. */-->
                    <form id="change-password-form">
                        <div class="mb-3">
                            <label for="currentPassword">현재 비밀번호</label>
                            <input type="password" class="form-control" id="currentPassword"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="mb-3">
                            <!--/* id="newPassword"가 아니다 — 비밀번호 재설정 페이지(PasswordResetApp.vue)에도
                                   같은 id의 입력이 있어, 로그인한 사람이 재설정 링크를 열면 한 문서에 id가
                                   중복될 수 있었다(개선 보고서 COR-10). 화면별로 구분한다. */-->
                            <label for="changeNewPassword">새 비밀번호 (8자 이상 72자 이하, 대문자·소문자·특수문자 포함)</label>
                            <input type="password" class="form-control" id="changeNewPassword"
                                   autocomplete="new-password" minlength="8" maxlength="72" required>
                        </div>
                    </form>
                    <p class="text-muted mb-0">변경하면 자동으로 로그아웃되고 로그인 화면으로 이동합니다.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" form="change-password-form" class="btn btn-primary"
                            id="btn-change-password">변경하기</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      게시글·댓글이 함께 쓰는 신고 모달. 사유는 고르게 하고 사정은 선택으로 받는다 — 자유
      입력만 받으면 관리자가 무엇부터 볼지 판단할 수 없다. 로그인한 사람에게만 렌더링한다.
    -->
    <div sec:authorize="isAuthenticated()" class="modal fade" id="reportModal" tabindex="-1"
         role="dialog" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="reportModalLabel">신고</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted" id="report-target-hint">관리자가 확인한 뒤 처리합니다.</p>
                    <form id="report-form">
                        <div class="mb-3">
                            <label for="report-reason">사유</label>
                            <select class="form-select" id="report-reason" required>
                                <option th:each="r : ${T(com.kraft.report.domain.ReportReason).values()}"
                                        th:value="${r}" th:text="${r.title}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="report-detail">자세한 내용 (선택)</label>
                            <textarea class="form-control" id="report-detail" maxlength="500"
                                      placeholder="관리자가 판단하는 데 도움이 될 내용을 적어 주세요."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" form="report-form" class="btn btn-danger"
                            id="btn-confirm-report">신고하기</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      회원 탈퇴 확인 모달. 되돌릴 수 없으므로 현재 비밀번호를 한 번 더 받는다.
      글과 댓글은 남고 작성자만 익명이 된다는 점을 여기서 분명히 알린다 — "탈퇴하면 내 글도
      사라진다"고 기대했다가 뒤늦게 알게 되면 안 된다.
    -->
    <div sec:authorize="isAuthenticated()" class="modal fade" id="withdrawModal" tabindex="-1"
         role="dialog" aria-labelledby="withdrawModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="withdrawModalLabel">회원 탈퇴</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="withdraw-error" class="flash flash--danger" role="alert" hidden></div>
                    <p class="mb-1">탈퇴하면 계정을 되돌릴 수 없습니다.</p>
                    <p class="text-muted">지금까지 쓴 글과 댓글은 남고, 작성자만 “탈퇴한 사용자”로 바뀝니다.
                        같은 이메일 주소로는 다시 가입할 수 있습니다.</p>
                    <form id="withdraw-form">
                        <div class="mb-3">
                            <label for="withdrawPassword">현재 비밀번호</label>
                            <input type="password" class="form-control" id="withdrawPassword"
                                   autocomplete="current-password" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" form="withdraw-form" class="btn btn-danger"
                            id="btn-confirm-withdraw">탈퇴하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 인증 메일 재발송 확인 모달. 누르는 즉시 메일이 나가던 것을 한 번 확인받도록 바꿨다. -->
    <div sec:authorize="hasRole('GUEST')" class="modal fade" id="resendVerificationModal" tabindex="-1"
         role="dialog" aria-labelledby="resendVerificationModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="resendVerificationModalLabel">인증 메일 재발송</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">가입한 이메일 주소로 인증 메일을 다시 보냅니다.</p>
                    <p class="text-muted mb-0">이전에 받은 인증 링크는 더 이상 사용할 수 없습니다.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-resend">재발송</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      jQuery는 더 이상 쓰지 않는다. Bootstrap 5가 jQuery에 의존하지 않게 되면서 이 앱의 코드만
      jQuery를 쓰고 있었는데, 쓰던 API(.val/.attr/.on/.ajax)가 전부 표준 DOM·fetch로 대체
      가능해 걷어냈다. CDN 의존이 하나 줄고, 전송량도 약 90KB 줄었다.

      두 스크립트의 순서는 우연이 아니다. 일반 <script>는 파싱 도중 즉시 실행되고
      type="module"은 파싱이 끝난 뒤에 실행되므로, 모듈이 도는 시점에는 전역 bootstrap 객체가
      반드시 준비되어 있다(경합이 아니라 명세가 보장한다). 아래 Bootstrap 태그에 async를
      붙이면 그 보장이 깨진다.

      Popper가 필요한 컴포넌트(드롭다운·툴팁·팝오버)는 쓰지 않으므로 bundle(Popper 포함,
      80KB) 대신 본체(60KB)만 불러온다. 모달·토스트는 Popper가 필요 없다.

      CDN이 아니라 이 서버가 직접 제공한다(개선 보고서 F08) — CDN 장애가 모달·토스트 UI
      전체를 죽이는 단일 장애점이었다. node_modules/bootstrap/dist/js/bootstrap.min.js를
      그대로 복사한 것이라(바이트가 위 SRI 해시와 실제로 일치함을 확인했다) integrity·
      crossorigin은 자체 호스팅에는 의미가 없어 뺐다. 버전을 올릴 때는 이 파일도 같이
      바꿔야 한다(package.json의 bootstrap 버전과 맞출 것).
    -->
    <script src="/js/vendor/bootstrap.min.js"></script>

    <!-- 앱 코드. ES 모듈이라 하위 파일들을 스스로 불러온다(/js/**는 이미 permitAll). -->
    <script type="module" src="/js/app/main.js"></script>
</div>
</body>
</html>
