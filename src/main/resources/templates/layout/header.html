<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="pageDescription" type="java.lang.String"*/-->
<!--/*@thymesVar id="canonicalPath" type="java.lang.String"*/-->
<!--/*@thymesVar id="siteBaseUrl" type="java.lang.String"*/-->
<!--/*@thymesVar id="ogType" type="java.lang.String"*/-->
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<head th:fragment="header">
    <!-- 브라우저가 문자 인코딩을 추측 없이 확정하도록 head의 첫 자식으로 둔다 — <title>의 비ASCII 문자(한글 제목)를 읽기 전에 정해져야 한다. -->
    <meta charset="UTF-8" />
    <title th:text="${pageTitle != null && !#strings.isEmpty(pageTitle)} ? ${pageTitle} + ' · Kraft' : 'Kraft'">Kraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 검색·링크 미리보기 메타데이터. 설명은 화면이 준 pageDescription(게시글이면 본문 앞부분)을, 없으면 사이트 소개를 쓴다. canonical·og:url은 컨트롤러가 대표 경로(canonicalPath)를 정한 공개 화면에만 붙이고,
         주소 앞부분은 요청의 Host가 아니라 설정된 대표 주소(siteBaseUrl, SeoModelAdvice)를 쓴다. 색인하지 않을 화면(로그인·관리자 등)은 SecurityConfig가 X-Robots-Tag로 막는다. -->
    <th:block th:with="metaTitle=${pageTitle != null && !#strings.isEmpty(pageTitle)} ? ${pageTitle} : 'Kraft',
                       metaDescription=${pageDescription != null && !#strings.isEmpty(pageDescription)} ? ${pageDescription} : '과거 당첨 데이터를 확인하고 번호 추천을 받아볼 수 있는 로또 6/45 도구 Kraft입니다. 커뮤니티도 함께 운영합니다.'">
        <meta name="description" th:content="${metaDescription}" />
        <meta property="og:site_name" content="Kraft" />
        <meta property="og:locale" content="ko_KR" />
        <meta property="og:type" th:content="${ogType != null} ? ${ogType} : 'website'" />
        <meta property="og:title" th:content="${metaTitle}" />
        <meta property="og:description" th:content="${metaDescription}" />
        <th:block th:if="${canonicalPath != null && siteBaseUrl != null}">
            <link rel="canonical" th:href="${siteBaseUrl + canonicalPath}" />
            <meta property="og:url" th:content="${siteBaseUrl + canonicalPath}" />
        </th:block>
    </th:block>
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />

    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />

    <!-- Bootstrap 5.3.8 중 이 앱이 쓰는 부분만 담은 빌드(src/styles/bootstrap-custom.scss). 그리드·카드·내비바·테이블·페이지네이션은 kraft-*로 직접 구현했고, JS도 이 서버가 직접 제공하므로(footer.html) CDN 장애의 영향을 받지 않는다. -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.custom.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <!-- 다크 모드 초기화. CSS 다음, 본문이 그려지기 전에 동기적으로 실행돼야 깜빡임이 없으므로 defer를 붙이지 않는다(theme-init.js 참고). -->
    <script th:src="@{/js/theme-init.js}"></script>

    <!-- Vue 아일랜드 마운트 실패 안내(mount-failure.js). CSP script-src를 'self'로 좁힐 수 있도록 인라인 스크립트 대신 외부 파일로 뺐다.
         defer를 붙인다 — 캐시 미스(첫 방문·자원 버전 교체 직후)에 defer가 없으면 다운로드가 끝날 때까지 나머지 head 파싱이 막힌다.
         defer된 클래식 스크립트와 모듈 스크립트는 문서 순서대로 실행되므로 아일랜드의 마운트 실패 보고가 이 리스너보다 먼저 도착하는 일은 없다. -->
    <script th:src="@{/js/mount-failure.js}" defer></script>
</head>
</html>
