<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="currentPath" type="java.lang.String"*/-->
<body>

<!--
  모든 이동·계정 버튼은 헤더 오른쪽 한 곳에만 둔다(이전에는 왼쪽 열 탐색 패널에 있었고,
  목록 화면과 오른쪽 안내 영역에도 같은 버튼이 중복으로 있었다). 화면당 한 번만 렌더링하므로
  링크·랜드마크·탭 순서가 중복되지 않는다.

  좁은 화면에서는 버튼이 한 줄에 들어가지 않으므로 "메뉴" 토글로 헤더 아래에 펼치고,
  768px 이상에서는 CSS가 항상 가로 한 줄로 펼쳐 보인다(토글 버튼은 숨는다).
-->
<header th:fragment="topbar" class="kraft-topbar">
    <div class="kraft-topbar__inner">
        <!-- 로고 타일의 "K"와 워드마크 뒤 점은 장식이라 aria-hidden — 링크의 이름은 "Kraft"다. 라벨은
             768px 이상에서만 보이는 설명 글자(링크 아님)다. -->
        <div class="kraft-brandbar">
            <a class="kraft-brand" href="/">
                <span class="kraft-brand__tile" aria-hidden="true">K</span>
                <span>Kraft<span class="kraft-brand__dot" aria-hidden="true">.</span></span>
            </a>
            <span class="kraft-brandbar__label">로또 6/45 번호 추천</span>
        </div>

        <button type="button" class="kraft-nav-toggle" id="btn-nav-toggle"
                aria-expanded="false" aria-controls="site-nav">
            <span class="kraft-nav-toggle__bars" aria-hidden="true"></span>
            <span>메뉴</span>
        </button>

        <nav id="site-nav" class="kraft-actions" aria-label="탐색">
            <!-- 번호 추천은 로그인 여부와 무관하게 동일하게 동작하는 공개 기능이라
                 sec:authorize로 가리지 않는다. app.recommend.enabled로 기능을 끄면(운영 준비)
                 컨트롤러가 404가 되므로 링크도 함께 감춘다. -->
            <a th:if="${@environment.getProperty('app.recommend.enabled', 'true')} == 'true'"
               href="/recommend" class="kraft-actions__link"
               th:classappend="${currentPath == '/recommend'} ? 'is-current'"
               th:attr="aria-current=${currentPath == '/recommend'} ? 'page' : null">번호 추천</a>

            <a href="/community" class="kraft-actions__link"
               th:classappend="${currentPath != null and (currentPath == '/community' or #strings.startsWith(currentPath, '/community?'))} ? 'is-current'"
               th:attr="aria-current=${currentPath != null and (currentPath == '/community' or #strings.startsWith(currentPath, '/community?'))} ? 'page' : null">커뮤니티</a>

            <a sec:authorize="isAuthenticated()" href="/posts/save" class="kraft-actions__link"
               th:classappend="${currentPath == '/posts/save'} ? 'is-current'"
               th:attr="aria-current=${currentPath == '/posts/save'} ? 'page' : null">글쓰기</a>

            <a sec:authorize="isAnonymous()" th:href="@{/login(redirect=${currentPath})}" class="kraft-actions__link"
               th:classappend="${currentPath == '/login'} ? 'is-current'"
               th:attr="aria-current=${currentPath == '/login'} ? 'page' : null">로그인</a>

            <a sec:authorize="isAnonymous()" href="/signup" class="kraft-actions__link"
               th:classappend="${currentPath == '/signup'} ? 'is-current'"
               th:attr="aria-current=${currentPath == '/signup'} ? 'page' : null">회원가입</a>

            <!-- 다크 모드 토글(11단계). 로그인 여부와 무관하게 항상 보인다 — 계정 메뉴
                 안에 넣지 않는 이유는 비로그인 방문자도 테마를 바꿀 수 있어야 하기 때문이다.
                 3단계(시스템→밝게→어둡게)를 순환하고, 화면에는 현재 상태 아이콘만 보인다. 접근 가능한
                 이름은 .visually-hidden 글자가 맡는다. 아이콘 선택(data-state)과 그 글자("테마: 시스템")는
                 자리 표시자일 뿐이다 — theme-init.js는 화면 색만 정하고 이 버튼은 건드리지 않으므로,
                 저장된 값이 밝게·어둡게였다면 static/js/app/features/theme-toggle.js가 마운트
                 시 실제 값으로 바로잡는다(그 전까지 한 프레임 정도 실제와 다르게 보일 수 있다). -->
            <button type="button" id="btn-theme-toggle" data-state="system"
                    class="kraft-actions__link kraft-actions__link--button kraft-theme-toggle">
                <svg class="kraft-theme-toggle__icon kraft-theme-toggle__icon--system" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
                </svg>
                <svg class="kraft-theme-toggle__icon kraft-theme-toggle__icon--light" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="kraft-theme-toggle__icon kraft-theme-toggle__icon--dark" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <span class="visually-hidden">테마: 시스템</span>
            </button>

            <!-- 계정 펼침 메뉴: 닉네임 버튼을 열면 계정 관련 행동이 나온다. 주요 탐색(위)과
                 분리해 두 종류의 행동을 구분한다. -->
            <div sec:authorize="isAuthenticated()" class="kraft-account">
                <button type="button" id="btn-account-toggle" class="kraft-actions__link kraft-account__toggle"
                        aria-expanded="false" aria-controls="account-menu">
                    <!--
                      로그인 아이디(principal name, 회원 id)가 아니라 가입 시 입력한
                      닉네임을 보여준다(KraftUserDetails.displayName).

                      principal 타입을 확인하고 쓰는 이유: 세션은 DB(SPRING_SESSION)에 저장되어 배포·재기동
                      뒤에도 살아남는데, KraftUserDetails 도입 이전에 만들어진 세션에는 displayName이 없는
                      옛 principal이 그대로 들어 있을 수 있다. 바로 참조하면 그 세션의 사용자에게는 모든
                      화면이 500으로 깨진다(실제로 재현했다). V26이 그런 옛 세션을 전부 지웠으므로 지금은
                      이 분기를 타지 않지만, 방어적으로 남겨 둔다 — 폴백 값은 principal name 그대로(숫자
                      id)이지 이메일이 아니다.
                    -->
                    <span class="kraft-actions__name" id="nav-user-name"
                          th:with="principal=${#authentication.principal}"
                          th:text="${principal instanceof T(com.kraft.config.security.KraftUserDetails)}
                                   ? ${principal.displayName} : ${#authentication.name}"></span>
                </button>
                <div id="account-menu" class="kraft-account__menu" hidden>
                    <!-- 인증 메일 재발송·비밀번호 변경은 화면을 떠나지 않고 현재 페이지 위 모달에서
                         처리한다(모달 자체는 layout/footer :: footer에 있다). -->
                    <button sec:authorize="hasRole('GUEST')" type="button" id="btn-resend-verification"
                            class="kraft-actions__link kraft-actions__link--button"
                            data-bs-toggle="modal" data-bs-target="#resendVerificationModal">인증 메일 재발송</button>

                    <button type="button" class="kraft-actions__link kraft-actions__link--button"
                            data-bs-toggle="modal" data-bs-target="#changePasswordModal">비밀번호 변경</button>

                    <a sec:authorize="hasRole('ADMIN')" href="/admin/recommendations" class="kraft-actions__link"
                       th:classappend="${currentPath == '/admin/recommendations'} ? 'is-current'"
                       th:attr="aria-current=${currentPath == '/admin/recommendations'} ? 'page' : null">추천 이력 수집</a>

                    <button type="button" id="btn-logout" class="kraft-actions__link kraft-actions__link--button">로그아웃</button>

                    <hr class="kraft-account__divider">

                    <button type="button" id="btn-withdraw" class="kraft-actions__link kraft-actions__link--button"
                            data-bs-toggle="modal" data-bs-target="#withdrawModal">회원 탈퇴</button>
                </div>
            </div>
        </nav>
    </div>
</header>
</body>
</html>
