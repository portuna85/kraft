<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
    모든 페이지의 공통 뼈대(FE-20): skip-link, 상단 바, shell, main, flash, 푸터.
    페이지는 <head>와 <body> 여는 태그만 직접 두고, 본문은 th:fragment="content" 조각으로 넘긴다.

        <body>
        <th:block th:replace="~{layout/page :: page('kraft-main--narrow', ~{::content})}">
            <th:block th:fragment="content"> ... h1과 본문 ... </th:block>
        </th:block>
        </body>

    flash는 항상 main의 맨 앞(h1 앞)에 둔다 — 페이지마다 h1 앞뒤로 달랐다.

    선택 항목은 이 호출을 th:with로 감싸 지역 변수로 넘긴다(th:replace가 같은 요소의 th:with보다
    먼저 처리되므로 바깥 th:block에 둔다).
      shellClass : shell에 덧붙일 클래스 (예: kraft-shell--with-aside)
      aside      : main 옆에 둘 조각 (~{::aside})
      afterMain  : shell 밖, 푸터 앞에 둘 조각
      noFlash    : true면 flash 영역을 만들지 않는다(오류 화면)
      slimFooter : true면 모달 없는 최소 푸터(layout/footer 참고)
*/-->
<body>
<th:block th:fragment="page(mainClass, content)">
    <a class="skip-link" href="#main">본문 바로가기</a>
    <div th:replace="~{layout/navbar :: topbar}"></div>

    <div class="kraft-shell" th:classappend="${shellClass}">
        <main id="main" class="kraft-main" th:classappend="${mainClass}">
            <th:block th:unless="${noFlash}">
                <div th:replace="~{layout/footer :: flash}"></div>
            </th:block>
            <th:block th:replace="${content}"></th:block>
        </main>
        <th:block th:if="${aside != null}">
            <th:block th:replace="${aside}"></th:block>
        </th:block>
    </div>

    <th:block th:if="${afterMain != null}">
        <th:block th:replace="${afterMain}"></th:block>
    </th:block>

    <div th:replace="~{layout/footer :: footer}"></div>
</th:block>
</body>
</html>
