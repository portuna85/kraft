<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <div th:replace="~{layout/navbar :: sitenav}"></div>

    <main id="main" class="kraft-main kraft-main--narrow">
        <div th:replace="~{layout/footer :: flash}"></div>

        <h1 class="page-title">게시글 등록</h1>
        <div class="card-kraft">
            <form>
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" class="form-control" id="title" placeholder="제목을 입력하세요" maxlength="255">
                </div>
                <div class="form-group">
                    <label for="author">작성자</label>
                    <input type="text" class="form-control" id="author" sec:authentication="name" readonly>
                    <small class="form-text text-muted">작성자는 로그인 계정으로 자동 지정됩니다.</small>
                </div>
                <div class="form-group">
                    <label for="content">내용</label>
                    <textarea class="form-control post-edit__textarea" id="content" placeholder="내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label for="picture">사진</label>
                    <input type="file" class="form-control-file" id="picture" accept="image/*">
                    <small class="form-text text-muted">JPG, JPEG, PNG, GIF, WEBP · 최대 5MB · 1개</small>
                </div>
            </form>
            <div class="btn-group-gap">
                <a href="/" role="button" class="btn btn-secondary">취소</a>
                <button type="button" class="btn btn-primary" id="btn-save">등록</button>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
