<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--narrow">
        <div th:replace="~{layout/footer :: flash}"></div>

        <h1 class="page-title">게시글 등록</h1>

        <!--/* 이메일 인증 전(GUEST)에는 서버가 작성을 거부한다. 폼을 보여주고 제출한 뒤에야
               이유를 알게 되는 흐름을 피하려고, 먼저 안내하고 폼을 감춘다. */-->
        <div class="card-kraft" sec:authorize="hasRole('GUEST')">
            <p>이메일 인증을 완료해야 글을 쓸 수 있습니다.</p>
            <p class="text-muted">가입할 때 받은 인증 메일의 링크를 눌러 주세요.
                메일이 오지 않았다면 헤더의 “인증 메일 재발송”으로 다시 받을 수 있습니다.</p>
        </div>

        <div class="card-kraft" sec:authorize="isAuthenticated() and !hasRole('GUEST')">
            <form id="post-save-form">
                <div class="mb-3">
                    <label for="title">제목</label>
                    <input type="text" class="form-control" id="title" placeholder="제목을 입력하세요" maxlength="255" required>
                </div>
                <div class="mb-3">
                    <label for="category">분류</label>
                    <!--/* 공지(NOTICE)는 관리자만 쓸 수 있다. 옵션을 감추는 것은 안내일 뿐이고,
                           실제 경계는 서버의 CategoryPolicy가 잡는다. */-->
                    <select class="form-select" id="category">
                        <option th:each="c : ${T(com.kraft.domain.post.Category).values()}"
                                th:if="${c.name() != 'NOTICE'
                                        or #authorization.expression('hasRole(''ADMIN'')')}"
                                th:value="${c}" th:text="${c.title}" th:selected="${c.name() == 'FREE'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="author">작성자</label>
                    <!-- 닉네임을 보여준다. 옛 세션 대비 물러서기는 layout/navbar 주석 참고. -->
                    <input type="text" class="form-control" id="author" readonly
                           th:with="principal=${#authentication.principal}"
                           th:value="${principal instanceof T(com.kraft.config.security.KraftUserDetails)}
                                     ? ${principal.displayName} : ${#authentication.name}">
                    <small class="form-text text-muted">작성자는 로그인 계정으로 자동 지정됩니다.</small>
                </div>
                <div class="mb-3">
                    <label for="content">내용</label>
                    <textarea class="form-control post-edit__textarea" id="content" placeholder="내용을 입력하세요"
                              maxlength="10000" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="picture">사진</label>
                    <input type="file" class="form-control" id="picture" accept="image/jpeg,image/png,image/gif,image/webp">
                    <small class="form-text text-muted">JPG, JPEG, PNG, GIF, WEBP · 최대 5MB · 1개</small>
                </div>

                <!-- 선택한 파일의 이름·크기·로컬 미리보기. 파일이 없으면 JS가 hidden을 유지한다. -->
                <div class="picture-preview" id="picture-preview" hidden>
                    <img class="picture-preview__image" id="picture-preview-image" alt="선택한 이미지 미리보기">
                    <div class="picture-preview__meta">
                        <p class="picture-preview__name" id="picture-preview-name"></p>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-picture-clear">선택 해제</button>
                    </div>
                </div>

                <!-- 업로드→저장 진행 상태. 평소에는 비어 있고 JS가 텍스트를 채우는 순간에만 보인다. -->
                <p class="form-progress" id="post-save-progress" aria-live="polite" hidden></p>
            </form>
            <div class="btn-group-gap">
                <a href="/" role="button" class="btn btn-secondary">취소</a>
                <button type="submit" form="post-save-form" class="btn btn-primary" id="btn-save">등록</button>
            </div>
        </div>

        <div class="card-kraft" sec:authorize="isAnonymous()">
            <p>로그인 후 게시글을 작성할 수 있습니다.</p>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
