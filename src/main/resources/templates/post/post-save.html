<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--narrow">
        <div th:replace="~{layout/footer :: flash}"></div>

        <h1 class="page-title">게시글 등록</h1>

        <!--/* 서버가 작성을 거부할 이유(이메일 미인증·이용 제한)가 있으면 먼저 알리고 폼을
               감춘다. 폼을 보여주고 제출한 뒤에야 이유를 알게 되는 흐름을 피하려는 것이다.
               판정은 작성 경로와 같은 WriteAccessPolicy가 한다. */-->
        <div class="card-kraft" th:if="${writeBlockReason != null}">
            <p th:text="${writeBlockReason}">글을 쓸 수 없습니다.</p>
            <p class="text-muted" sec:authorize="hasRole('GUEST')">가입할 때 받은 인증 메일의 링크를 눌러 주세요.
                메일이 오지 않았다면 헤더의 “인증 메일 재발송”으로 다시 받을 수 있습니다.</p>
        </div>

        <!--/* 등록 폼은 Vue 아일랜드(src/vue/post-save)가 그린다. 고를 수 있는 분류와 보여줄
               닉네임은 서버만 판정할 수 있어(공지는 관리자 전용, 로그인 아이디는 이메일)
               초기 상태를 JSON으로 그대로 내려준다. 폼을 보여줄지 자체는 여기 sec:authorize가
               정하므로, 권한이 없으면 마운트 지점도 스크립트도 렌더링되지 않는다. */-->
        <div class="card-kraft" sec:authorize="isAuthenticated()" th:if="${writeBlockReason == null}">
            <script type="application/json" id="post-save-initial-data" th:utext="${postSaveInitialJson}"></script>
            <div id="post-save-app"></div>
            <!-- post-save.js가 정적으로 import하는 공유 청크(Vue 런타임 포함, 67KB)를 미리
                 받아 둔다. 이게 없으면 브라우저가 post-save.js를 내려받아 파싱한 뒤에야 이
                 import를 발견해 청크를 요청하므로 왕복이 하나 더 든다. -->
            <link rel="modulepreload" href="/js/vue-dist/chunks/runtime.js" />
            <script type="module" src="/js/vue-dist/post-save.js"></script>
        </div>

        <div class="card-kraft" sec:authorize="isAnonymous()">
            <p>로그인 후 게시글을 작성할 수 있습니다.</p>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
