<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="post" type="com.kraft.post.dto.PostViewDto"*/-->
<!--/*@thymesVar id="comments" type="java.util.List<com.kraft.comment.dto.CommentViewDto>"*/-->
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--narrow">
        <div th:replace="~{layout/footer :: flash}"></div>

        <!-- 공통 삭제 모달(delete-confirm.js)이 참조하는 게시글 id. -->
        <input type="hidden" id="id" th:value="${post.id}">

        <!-- 게시글 읽기/편집은 Vue 아일랜드(src/vue/post-edit)로 렌더링된다. canManagePost·
             분류 선택지는 서버만 판정할 수 있어(공개 REST 응답에는 없는 화면 전용 값) 초기
             상태를 JSON으로 그대로 내려준다. 추천 버튼의 상태와 요청도 Vue가 관리한다. -->
        <script type="application/json" id="post-initial-data" th:utext="${postEditInitialJson}"></script>
        <div id="post-app"></div>
        <script type="module" src="/js/vue-dist/post-edit.js"></script>

        <!-- 댓글은 Vue 아일랜드(src/vue/comments)로 렌더링된다. canManage는 서버만 판정할 수
             있어(공개 REST 응답에는 없는 화면 전용 필드) 초기 목록을 JSON으로 그대로 내려준다. -->
        <script type="application/json" id="comments-initial-data" th:utext="${commentsJson}"></script>
        <section id="comments-app" class="comments" aria-labelledby="comments-heading"
                 th:attr="data-post-id=${post.id},
                          data-authenticated=${#authorization.expression('isAuthenticated()')},
                          data-can-write=${#authorization.expression('isAuthenticated() and !hasRole(''GUEST'')')}"></section>
        <script type="module" src="/js/vue-dist/comments.js"></script>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
