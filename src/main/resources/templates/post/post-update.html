<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="post" type="com.kraft.web.dto.post.PostViewDto"*/-->
<!--/*@thymesVar id="comments" type="java.util.List<com.kraft.web.dto.comment.CommentViewDto>"*/-->
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--narrow">
        <div th:replace="~{layout/footer :: flash}"></div>

        <input type="hidden" id="id" th:value="${post.id}">
        <input type="hidden" id="original-title" th:value="${post.title}">
        <input type="hidden" id="original-content" th:value="${post.content}">
        <input type="hidden" id="original-picture" th:value="${post.picture}">
        <input type="hidden" id="original-category" th:value="${post.category}">
        <!-- 편집을 시작한 시점의 버전. 저장 요청이 그대로 돌려보내면, 그 사이 다른 곳에서
             저장이 일어났는지 서버가 판별해 409로 거절한다(덮어쓰기 방지). -->
        <input type="hidden" id="post-version" th:value="${post.version}">

        <!-- 읽기 기본 상태 -->
        <article id="post-view">
            <span class="post-category" th:text="${post.category.title}">분류</span>
            <h1 class="post-title" id="post-title-text" th:text="${post.title}">제목</h1>
            <p class="post-byline">
                <span th:text="${post.author}">작성자</span> · 글 번호 <span th:text="${post.id}">1</span>
                · 조회 <span th:text="${post.viewCount}">0</span>
            </p>

            <div class="post-body" id="post-content-text" th:text="${post.content}">내용</div>

            <div class="post-image" th:if="${post.picture}">
                <img th:src="${post.picture}" alt="게시글 첨부 이미지">
            </div>

            <div class="btn-group-gap post-actions" sec:authorize="isAuthenticated()">
                <button type="button" id="btn-like" class="btn btn-outline-primary"
                        th:classappend="${post.likedByMe} ? 'is-active'"
                        th:attr="aria-pressed=${post.likedByMe}">
                    추천 <span id="like-count" th:text="${post.likeCount}">0</span>
                </button>
            </div>
            <p class="post-actions" sec:authorize="isAnonymous()">
                추천 <span th:text="${post.likeCount}">0</span>개 ·
                <a href="/login">로그인 후 추천할 수 있습니다.</a>
            </p>

            <div class="btn-group-gap post-actions" th:if="${post.canManagePost}">
                <button type="button" class="btn btn-outline-primary" id="btn-edit">수정</button>
                <button type="button" class="btn btn-outline-danger" id="btn-delete-post"
                        data-target-kind="post">삭제</button>
            </div>
        </article>

        <!-- 편집 상태: 관리 권한이 있을 때만 DOM에 만든다. -->
        <form id="post-edit" class="card-kraft post-edit" th:if="${post.canManagePost}" hidden>
            <div class="mb-3">
                <label for="title">제목</label>
                <input type="text" class="form-control" id="title" th:value="${post.title}" maxlength="255" required>
            </div>
            <div class="mb-3">
                <label for="edit-category">분류</label>
                <!--/* 공지(NOTICE)는 관리자만 쓸 수 있다. 이미 공지인 글을 관리자가 아닌 사람이
                       수정하는 경우에도 현재 값은 보여야 하므로, 선택된 분류는 항상 남긴다.
                       실제 경계는 서버의 CategoryPolicy가 잡는다. */-->
                <select class="form-select" id="edit-category">
                    <option th:each="c : ${T(com.kraft.domain.post.Category).values()}"
                            th:if="${c.name() != 'NOTICE'
                                    or c == post.category
                                    or #authorization.expression('hasRole(''ADMIN'')')}"
                            th:value="${c}" th:text="${c.title}" th:selected="${c == post.category}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="content">내용</label>
                <textarea class="form-control post-edit__textarea" id="content" maxlength="10000" required
                          th:text="${post.content}"></textarea>
            </div>
            <div class="mb-3">
                <label for="edit-picture">사진</label>
                <input type="file" class="form-control" id="edit-picture"
                       accept="image/jpeg,image/png,image/gif,image/webp">
                <small class="form-text text-muted">JPG, JPEG, PNG, GIF, WEBP · 최대 5MB · 1개. 새 파일을 선택하면 기존 이미지를 대체합니다.</small>
            </div>

            <!-- 기존 이미지(교체할 파일을 아직 선택하지 않았을 때만 표시). "이미지 삭제"를 누르면
                 숨기고 저장 시 picture를 null로 보낸다. -->
            <div class="picture-preview" id="edit-picture-current" th:if="${post.picture}">
                <img class="picture-preview__image" th:src="${post.picture}" alt="현재 첨부된 이미지">
                <div class="picture-preview__meta">
                    <p class="picture-preview__name">현재 이미지</p>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="btn-edit-picture-remove">이미지 삭제</button>
                </div>
            </div>

            <!-- 새로 선택한 파일의 로컬 미리보기. -->
            <div class="picture-preview" id="edit-picture-preview" hidden>
                <img class="picture-preview__image" id="edit-picture-preview-image" alt="선택한 이미지 미리보기">
                <div class="picture-preview__meta">
                    <p class="picture-preview__name" id="edit-picture-preview-name"></p>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-edit-picture-clear">선택 해제</button>
                </div>
            </div>

            <p class="form-progress" id="post-update-progress" aria-live="polite" hidden></p>

            <div class="btn-group-gap">
                <button type="button" class="btn btn-secondary" id="btn-cancel-edit">취소</button>
                <button type="submit" class="btn btn-primary" id="btn-update">저장</button>
            </div>
        </form>

        <!-- 댓글은 Vue 아일랜드(src/vue/comments)로 렌더링된다. canManage는 서버만 판정할 수
             있어(공개 REST 응답에는 없는 화면 전용 필드) 초기 목록을 JSON으로 그대로 내려준다. -->
        <script type="application/json" id="comments-initial-data" th:utext="${commentsJson}"></script>
        <section id="comments-app" class="comments" aria-labelledby="comments-heading"
                 th:attr="data-post-id=${post.id},data-authenticated=${#authorization.expression('isAuthenticated()')}"></section>
        <script type="module" src="/js/vue-dist/comments.js"></script>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
