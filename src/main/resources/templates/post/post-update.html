<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="post" type="com.kraft.post.dto.PostViewDto"*/-->
<!--/*@thymesVar id="comments" type="java.util.List<com.kraft.comment.dto.CommentViewDto>"*/-->
<!--/*@thymesVar id="relatedPosts" type="java.util.List<com.kraft.post.dto.PostRowDto>"*/-->
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--narrow">
        <div th:replace="~{layout/footer :: flash}"></div>

        <!-- 공통 삭제 모달(delete-confirm.js)이 참조하는 게시글 id. -->
        <input type="hidden" id="id" th:value="${post.id}">

        <!-- 게시글 읽기/편집은 Vue 아일랜드(src/vue/post-edit)로 렌더링된다. canManagePost·
             분류 선택지는 서버만 판정할 수 있어(공개 REST 응답에는 없는 화면 전용 값) 초기
             상태를 JSON으로 그대로 내려준다. 추천 버튼의 상태와 요청도 Vue가 관리한다. -->
        <script type="application/json" id="post-initial-data" th:utext="${postEditInitialJson}"></script>
        <!-- 읽기 전용 본문을 서버가 먼저 그린다(평가 보고서 2026-09-25 F08) — JS가 실행되기
             전·실행되지 않는 환경(검색 로봇, 링크 미리보기, 스크립트 로드 실패)에서도 글을 읽을 수
             있게 한다. Vue가 마운트하면 이 내용을 통째로 교체하므로 두 번 보이지 않는다.
             출력은 전부 th:text(이스케이프)다. 마운트가 실패해도 mount-failure.js는
             data-ssr-content가 있으면 지우지 않고 안내만 앞에 붙인다. -->
        <div id="post-app">
            <article class="post-ssr" data-ssr-content>
                <span class="post-category" th:text="${post.category?.title}">분류</span>
                <h1 class="post-title" th:text="${post.title}">제목</h1>
                <p class="post-byline">
                    <span th:text="${post.author}">작성자</span> · 글 번호 <span th:text="${post.id}">0</span>
                    · 조회 <span th:text="${post.viewCount}">0</span>
                </p>
                <div class="post-body" th:text="${post.content}">본문</div>
                <div class="post-image" th:if="${post.picture != null}">
                    <img th:src="${post.picture}" alt="게시글 첨부 이미지" loading="lazy" decoding="async">
                </div>
            </article>
        </div>
        <!-- post-edit.js·comments.js가 함께 쓰는 공유 청크(Vue 런타임 포함, 67KB)를 미리
             받아 둔다 — 두 스크립트가 같은 청크를 가리키므로 여기서 한 번만 선언한다. -->
        <link rel="modulepreload" th:href="@{/js/vue-dist/chunks/runtime.js}" />
        <script type="module" th:src="@{/js/vue-dist/post-edit.js}" data-mount-fallback="post-app"></script>

        <!-- 댓글은 Vue 아일랜드(src/vue/comments)로 렌더링된다. canManage는 서버만 판정할 수
             있어(공개 REST 응답에는 없는 화면 전용 필드) 초기 목록을 JSON으로 그대로 내려준다.
             관련 글보다 먼저 둔다 — 읽기 흐름은 본문 다음 참여(댓글)가 우선이고, 관련 글은
             다 읽은 뒤의 다음 행동이다(문서 5.2). -->
        <script type="application/json" id="comments-initial-data" th:utext="${commentsJson}"></script>
        <section id="comments-app" class="comments" aria-labelledby="comments-heading"
                 th:attr="data-post-id=${post.id},
                          data-authenticated=${#authorization.expression('isAuthenticated()')},
                          data-can-write=${canWriteComment},data-write-block-reason=${writeBlockReason}"></section>
        <script type="module" th:src="@{/js/vue-dist/comments.js}" data-mount-fallback="comments-app"></script>

        <!-- 관련 게시글: 같은 분류에서 현재 글을 제외한 최신 글. 서버가 한 번에 계산해
             내려주며 Vue 상태와는 무관하므로 정적으로 렌더링한다. -->
        <section class="related-posts" th:if="${!#lists.isEmpty(relatedPosts)}" aria-labelledby="related-heading">
            <h2 id="related-heading" class="related-posts__title">관련 게시글</h2>
            <ul class="related-posts__list">
                <li class="related-posts__item" th:each="p : ${relatedPosts}">
                    <a th:href="@{'/posts/update/' + ${p.id}}" th:text="${p.title}">제목</a>
                    <span class="related-posts__views" th:text="'조회 ' + ${p.viewCount}">조회 0</span>
                </li>
            </ul>
        </section>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
