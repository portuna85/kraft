<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="historyReady" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="latestDraw" type="com.kraft.recommend.dto.LatestDrawView"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<th:block th:replace="~{layout/page :: page('kraft-main--recommend', ~{::content})}">
    <th:block th:fragment="content">
        <!--/* 히어로: 작은 영문 eyebrow, h1, 한 줄 부제. 아래 두 카드(설정·결과)가 이 화면의 본체다. */-->
        <header class="recommend__hero">
            <p class="recommend__eyebrow" aria-hidden="true">NUMBER PICKER</p>
            <h1 class="page-title">번호 추천</h1>
            <p class="recommend__lead">역대 1등 당첨 조합은 빼고, 새로운 6개의 번호를 만나보세요.</p>
        </header>

        <!--/* 최신 회차 당첨번호는 서버가 직접 렌더링한다(RecommendationPageController) — 다음 추첨 전까지
               바뀌지 않는 정적 정보라 Vue·API 왕복이 필요 없다. 홈과 같은 조각을 쓴다(lotto/latest-draw.html).
               추첨일·보너스 번호·1등 당첨금·세후 예상 금액은 V21 이후 반영된 회차에만 있다(과거 회차는 null이라
               해당 블록만 조용히 생략된다). */-->
        <div class="recommend__latest" th:if="${latestDraw != null}">
            <th:block th:replace="~{lotto/latest-draw :: latestDraw(${latestDraw})}"></th:block>
        </div>

        <!--/* 제외 검증의 기준 — 이력이 어느 회차까지, 언제 확인됐는지와 지연 여부. 이력이 준비되지
               않았으면 생성이 거절되므로(503) 그 사실을 미리 알린다(RecommendationFreshness). */-->
        <p th:if="${historyReady and historyStale}" class="recommend__history recommend__history--stale" role="status">
            갱신이 늦어지고 있습니다. 최신 회차가 아직 반영되지 않았을 수 있습니다.
        </p>
        <p th:unless="${historyReady}" class="recommend__history recommend__history--stale" role="status">
            과거 1등 조합 이력을 준비하는 중이라 지금은 번호를 생성할 수 없습니다.
        </p>

        <!--/* 설정·결과 두 카드는 전부 Vue 아일랜드(src/vue/recommend)가 그린다. 서버가 내려줄 초기 상태는
               없다 — 생성은 사용자가 버튼을 눌렀을 때만 REST API로 요청한다. 서버가 아는 값 하나(검증된
               이력의 마지막 회차)만 data-history-round로 넘겨 안내 문구에 쓴다(없으면 속성이 빠진다). */-->
        <div id="recommend-app" th:attr="data-history-round=${historyVerifiedRound}"></div>
        <noscript>
            <div class="card-kraft">
                <p class="recommend__noscript">번호 추천 기능을 사용하려면 자바스크립트가 필요합니다.</p>
            </div>
        </noscript>
        <!-- recommend.js가 정적으로 import하는 공유 청크(Vue 런타임 포함)를 미리 받아
             둔다. 이 링크가 없었는데도 check-preload.mjs가 "preload가 아예 없는
             페이지"는 검사하지 않고 건너뛰어 놓쳤다. -->
        <link rel="modulepreload" th:href="@{/js/vue-dist/chunks/runtime.js}" />
        <link rel="modulepreload" th:href="@{/js/vue-dist/chunks/core.js}" />
        <script type="module" th:src="@{/js/vue-dist/recommend.js}" data-mount-fallback="recommend-app"></script>
    </th:block>
</th:block>


</body>
</html>
