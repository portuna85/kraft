<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="latestRoundNo" type="java.lang.Integer"*/-->
<!--/*@thymesVar id="latestRoundNumbers" type="java.util.List"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--recommend">
        <h1 class="page-title">번호 추천</h1>
        <div th:replace="~{layout/footer :: flash}"></div>

        <!--/* 최신 회차 당첨번호는 서버가 직접 렌더링한다(RecommendationPageController) — 다음
               추첨 전까지 바뀌지 않는 정적 정보라 Vue·API 왕복이 필요 없다. 추첨일·보너스
               번호·1등 당첨금·실수령액은 V21 이후 반영된 회차에만 있다(과거 회차는 null이라
               해당 블록만 조용히 생략된다). */-->
        <section th:if="${latestRoundNo != null}" class="recommend__latest" aria-label="최신 회차 당첨번호">
            <p class="recommend__latest-heading">최신 <strong th:text="${latestRoundNo}"></strong>회 당첨번호</p>
            <p th:if="${latestRoundDrawDate != null}" class="recommend__latest-date"
               th:text="${#temporals.format(latestRoundDrawDate, 'yyyy.MM.dd')} + ' 추첨'"></p>

            <ul class="recommend__latest-balls">
                <li th:each="n : ${latestRoundNumbers}" class="recommend__latest-ball"
                    th:classappend="${T(com.kraft.recommend.domain.LottoBallColor).cssClass(n)}"
                    th:text="${n}"></li>
                <li th:if="${latestRoundBonusNumber != null}" class="recommend__latest-ball-plus"
                    aria-hidden="true">+</li>
                <li th:if="${latestRoundBonusNumber != null}"
                    class="recommend__latest-ball recommend__latest-ball--bonus"
                    th:classappend="${T(com.kraft.recommend.domain.LottoBallColor).cssClass(latestRoundBonusNumber)}">
                    <span class="visually-hidden">보너스 </span><span th:text="${latestRoundBonusNumber}"></span>
                </li>
            </ul>

            <dl th:if="${latestRoundFirstPrizeAmount != null}" class="recommend__latest-prize">
                <dt>1등 당첨금</dt>
                <dd>
                    <span th:text="${#numbers.formatInteger(latestRoundFirstPrizeAmount, 0, 'COMMA')} + '원'"></span>
                    <span th:if="${latestRoundFirstPrizeWinnerCount != null}"
                          th:text="'(' + ${latestRoundFirstPrizeWinnerCount} + '명)'"></span>
                </dd>
                <dt>실수령액</dt>
                <dd th:text="${#numbers.formatInteger(latestRoundTakeHomeAmount, 0, 'COMMA')} + '원'"></dd>
            </dl>
        </section>

        <!--/* 생성 폼·결과는 전부 Vue 아일랜드(src/vue/recommend)가 그린다. 서버가 내려줄 초기
               상태는 없다 — 생성은 사용자가 버튼을 눌렀을 때만 REST API로 요청한다. */-->
        <div class="card-kraft">
            <div id="recommend-app"></div>
            <noscript>
                <p class="recommend__noscript">번호 추천 기능을 사용하려면 자바스크립트가 필요합니다.</p>
            </noscript>
            <!-- recommend.js가 정적으로 import하는 공유 청크(Vue 런타임 포함)를 미리 받아
                 둔다. F01: 이 링크가 없었는데도 check-preload.mjs가 "preload가 아예 없는
                 페이지"는 검사하지 않고 건너뛰어 놓쳤다. -->
            <link rel="modulepreload" href="/js/vue-dist/chunks/runtime.js" />
            <script type="module" src="/js/vue-dist/recommend.js" data-mount-fallback="recommend-app"></script>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
