<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <div th:replace="~{layout/navbar :: sitenav}"></div>

    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">비밀번호 변경</h1>
        <div th:replace="~{layout/footer :: flash}"></div>
        <div class="card-kraft" sec:authorize="isAuthenticated()">
            <form>
                <div class="form-group">
                    <label for="currentPassword">현재 비밀번호</label>
                    <input type="password" class="form-control" id="currentPassword" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="newPassword">새 비밀번호 (8자 이상, 대문자·소문자·특수문자 포함)</label>
                    <input type="password" class="form-control" id="newPassword" autocomplete="new-password">
                </div>
            </form>
            <div class="btn-group-gap">
                <a href="/" role="button" class="btn btn-secondary">취소</a>
                <button type="button" class="btn btn-primary" id="btn-change-password">변경하기</button>
            </div>
        </div>
        <div class="card-kraft" sec:authorize="isAnonymous()">
            <p>로그인 후 비밀번호를 변경할 수 있습니다.</p>
            <a href="/login" class="btn btn-primary">로그인하러 가기</a>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
