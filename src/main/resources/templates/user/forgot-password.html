<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">비밀번호 찾기</h1>
        <div th:replace="~{layout/footer :: flash}"></div>

        <!--/* 요청 폼은 Vue 아일랜드(src/vue/forgot-password)가 그린다. 서버가 내려줄 초기
               상태는 없다. 가입 여부와 무관하게 늘 같은 안내를 보여준다 — 응답이 갈리면
               그것만으로 가입 여부를 확인하는 도구가 된다. */-->
        <div class="card-kraft">
            <div id="forgot-password-app"></div>
            <!-- forgot-password.js가 정적으로 import하는 공유 청크(Vue 런타임 포함, 67KB)를
                 미리 받아 둔다 — 이 화면은 자기 코드(1.6KB)보다 이 청크가 훨씬 크다. -->
            <link rel="modulepreload" th:href="@{/js/vue-dist/chunks/runtime.js}" />
            <script type="module" th:src="@{/js/vue-dist/forgot-password.js}" data-mount-fallback="forgot-password-app"></script>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
