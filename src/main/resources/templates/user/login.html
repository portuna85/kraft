<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="_csrf" type="org.springframework.security.web.csrf.CsrfToken"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">로그인</h1>
        <p class="page-lead text-muted">가입한 이메일과 비밀번호로 로그인하세요.</p>
        <div th:replace="~{layout/footer :: flash}"></div>
        <div class="card-kraft">
            <div class="alert alert-danger"
                 th:if="${param.error != null and (param.error[0] == null or param.error[0] != 'throttled')}">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'throttled'}">
                로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.
            </div>
            <div class="alert alert-success" th:if="${param.logout != null}">
                로그아웃되었습니다.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username">이메일</label>
                    <input type="email" class="form-control" id="username" name="username"
                           placeholder="이메일을 입력하세요" autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="password">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="redirect" th:if="${param.redirect != null}" th:value="${param.redirect[0]}" />
                <div class="btn-group-gap">
                    <a href="/" class="btn btn-secondary">취소</a>
                    <button type="submit" class="btn btn-primary">로그인</button>
                </div>
            </form>
            <p class="form-text mt-3">
                <a id="link-forgot-password" href="/forgot-password">비밀번호를 잊으셨나요?</a>
            </p>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
