<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="resetToken" type="java.lang.String"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">비밀번호 재설정</h1>
        <div th:replace="~{layout/footer :: flash}"></div>

        <!--/* 재설정 폼은 Vue 아일랜드(src/vue/password-reset)가 그린다. 링크의 토큰은 화면이
               쿼리 문자열을 파싱하지 않고 서버가 data 속성으로 건넨다 — 저장 요청에 그대로
               실어 보내며, 유효한지는 그때 서버가 판정한다. */-->
        <div class="card-kraft">
            <div id="password-reset-app" th:attr="data-token=${resetToken}"></div>
            <!-- password-reset.js가 정적으로 import하는 공유 청크(Vue 런타임 포함, 67KB)를
                 미리 받아 둔다 — 이 화면은 자기 코드(2.2KB)보다 이 청크가 훨씬 크다. -->
            <link rel="modulepreload" href="/js/vue-dist/chunks/runtime.js" />
            <script type="module" src="/js/vue-dist/password-reset.js" onerror="kraftVueMountFailed('password-reset-app')"></script>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
