<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">비밀번호 재설정</h1>
        <div th:replace="~{layout/footer :: flash}"></div>

        <!--/* 재설정 폼은 Vue 아일랜드(src/vue/password-reset)가 그린다. 링크의 토큰은 URL
               프래그먼트(#token=...)로 오므로(A-SEC-11) 서버는 받지 않는다 — mount.js가
               location.hash에서 직접 읽고 history.replaceState로 곧바로 지운다. */-->
        <div class="card-kraft">
            <div id="password-reset-app"></div>
            <!-- password-reset.js가 정적으로 import하는 공유 청크(Vue 런타임 포함, 67KB)를
                 미리 받아 둔다 — 이 화면은 자기 코드(2.2KB)보다 이 청크가 훨씬 크다. -->
            <link rel="modulepreload" th:href="@{/js/vue-dist/chunks/runtime.js}" />
            <link rel="modulepreload" th:href="@{/js/vue-dist/chunks/core.js}" />
            <script type="module" th:src="@{/js/vue-dist/password-reset.js}" data-mount-fallback="password-reset-app"></script>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
