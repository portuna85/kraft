<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">회원가입</h1>
        <div th:replace="~{layout/footer :: flash}"></div>

        <!--/* 가입 폼은 Vue 아일랜드(src/vue/signup)가 그린다. 서버가 내려줄 초기 상태는 없고,
               제출은 REST API로만 오간다. */-->
        <div class="card-kraft">
            <div id="signup-app"></div>
            <!-- signup.js가 정적으로 import하는 공유 청크(Vue 런타임 포함, 67KB)를 미리
                 받아 둔다 — 이 화면은 자기 코드(2.5KB)보다 이 청크가 훨씬 크다. -->
            <link rel="modulepreload" href="/js/vue-dist/chunks/runtime.js" />
            <script type="module" src="/js/vue-dist/signup.js" onerror="kraftVueMountFailed('signup-app')"></script>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
