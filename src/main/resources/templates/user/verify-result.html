<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*@thymesVar id="pageTitle" type="java.lang.String"*/-->
<!--/*@thymesVar id="success" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="message" type="java.lang.String"*/-->
<head th:replace="~{layout/header :: header}"></head>
<body>

<a class="skip-link" href="#main">본문 바로가기</a>
<div th:replace="~{layout/navbar :: topbar}"></div>

<div class="kraft-shell">
    <main id="main" class="kraft-main kraft-main--account">
        <h1 class="page-title">이메일 인증</h1>
        <div class="card-kraft">
            <p th:if="${success}">이메일 인증이 완료되었습니다.</p>
            <p th:unless="${success}" th:text="${message}"></p>
            <!-- 링크를 클릭한 시점에 로그인 세션이 없을 수 있다(다른 기기에서 메일을 열었거나
                 세션이 만료됨). 재발송 API는 로그인이 필수라(UserApiController) 여기서 바로
                 재발송을 제공하지 못하고, 로그인 후 계정 메뉴로 안내한다. -->
            <p th:unless="${success}" class="text-muted">
                <a href="/login">로그인</a> 후 계정 메뉴에서 인증 메일을 다시 받을 수 있습니다.
            </p>

            <!-- 인증 성공이 이미 로그인된 세션의 권한을 즉시 갱신하지는 않는다. 현재 세션이
                 있으면 로그아웃 후 다시 로그인해야 바뀐 역할이 반영된다는 사실을 안내한다. -->
            <p th:if="${success}" class="text-muted" sec:authorize="isAuthenticated()">
                이미 로그인되어 있다면, 계정 메뉴에서 로그아웃한 뒤 다시 로그인해야 바뀐 권한이 반영됩니다.
            </p>
        </div>
    </main>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
