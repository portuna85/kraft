# 테스트 전용 오버라이드. gradlew test는 기본 프로파일(local)로 돌지만, 실제 로컬 개발용
# main/resources/application-local.yml은 2026-09-11부터 Docker MariaDB를 쓰도록 바뀌었다
# (아래 참고). 테스트는 Docker가 떠 있는지와 무관하게 빠르고 격리되어야 하므로, 테스트
# 클래스패스가 메인 클래스패스보다 우선한다는 점을 이용해 이 파일로 H2 인메모리를 강제한다
# (Gradle의 test 런타임 클래스패스는 test/resources를 main/resources보다 먼저 찾는다).
#
# main/resources/application-local.yml이 대체하기 전의 원래 로컬(H2) 설정과 동일하다.
spring:
  datasource:
    url: jdbc:h2:mem:kraft;MODE=MariaDB
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true

  session:
    jdbc:
      initialize-schema: always

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    email-encryption-key: local-dev-only-email-key-do-not-use-in-prod
