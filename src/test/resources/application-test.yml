# test 프로파일 전용 설정. build.gradle.kts의 Test 태스크가 이 프로파일을 강제하므로 gradlew test는 항상 H2 인메모리로 돈다 — application-local.yml은 Docker MariaDB를 쓰는데
# 테스트는 Docker 유무와 무관하게 빠르고 격리되어야 해서 분리했다.
spring:
  datasource:
    # 이름을 고정하지 않고 컨텍스트마다 새 무작위 DB를 쓴다 — 같은 이름의 DB를 서로 다른 컨텍스트(@DataJpaTest, @SpringBootTest)가 공유하면 같은 스키마를 create-drop으로 만들고 지우기를 반복하며 겹쳐 "Table USERS not found" 같은 무작위 실패가 난다.
    # DB_CLOSE_DELAY=-1은 컨텍스트가 캐시되어 재사용되는 동안 커넥션 풀이 커넥션을 전부 반납해도 DB가 사라지지 않게 한다. 같은 컨텍스트를 공유하는 테스트 클래스가 남긴 데이터는 GlobalH2CleanupExtension이 매 테스트 전에 정리한다.
    # MODE=MariaDB는 SQL 문법·함수 호환일 뿐이다 — 아래는 모드가 흉내 내지 못해 결함을 숨긴 적이 있는 것들이라, 이 동작을 바꾸는 테스트는 Testcontainers MariaDB로 한 번 더 확인한다(*MariaDbTest 클래스들).
    #   - 읽기 전용 트랜잭션 제약: H2는 @Transactional(readOnly=true)에서도 쓰기를 막지 않는다. MariaDB는 막는다.
    #   - 자기참조 FK의 제약 검사 시점(PostDeleteWithRepliesMariaDbTest가 실제로 다르게 동작함을 확인했다).
    #   - 제약 위반 예외 메시지·제약 이름 형식(PostLikeWriter.isDuplicateLikeConstraint가 이 차이 때문에 DB별로 다르게 판정한다).
    #   - FOR UPDATE SKIP LOCKED·ROW_NUMBER() 등 네이티브 쿼리의 정확한 잠금·정렬 동작.
    url: jdbc:h2:mem:kraft-${random.uuid};MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  session:
    jdbc:
      initialize-schema: always

  thymeleaf:
    cache: false

logging:
  level:
    # show-sql은 System.out에 SQL을 따로 찍어 이 로거와 함께 켜면 두 번 출력되므로 로거 하나만 쓴다. 기본은 warn — debug로 항상 켜면 SQL 수천 줄이 섞여 build/test-logs가 부푼다. 특정 클래스의 쿼리를 봐야 하면 그 테스트에서만 `@TestPropertySource(properties = "logging.level.org.hibernate.SQL=debug")`.
    org.hibernate.SQL: warn

app:
  security:
    email-encryption-key: local-dev-only-email-key-do-not-use-in-prod
    email-hash-pepper: test-only-hash-pepper-0123456789

  # 로그인·가입 등을 반복하는 MockMvc 테스트가 흔들리지 않게 제한기를 끈다(필터 자체를 검증하는 테스트는 @TestPropertySource로 다시 켠다 — AuthRateLimitFilterTest).
  auth:
    min-response-millis: 0
    rate-limit:
      enabled: false

  # 같은 이유 — 게시글·댓글·업로드·검색을 반복하는 테스트가 흔들리지 않게 끈다.
  write:
    rate-limit:
      enabled: false

  # 스위트가 도는 동안(수십~백여 초) 예약 작업이 끼어들어 다른 테스트의 데이터를 건드리지 않게 모든 주기 작업의 최초 실행을 훨씬 뒤로 미룬다. enabled 스위치는 건드리지 않는다 — 테스트가 직접 호출하는 메서드(OutboxMailWorker.drain, ExpiredTokenPurger.purgeExpired 등)도
  # 그 스위치를 검사해 false로 바꾸면 그 테스트들이 깨진다. 초기 지연만 미루면 직접 호출 경로는 그대로 두고 예약 실행의 끼어듦만 막는다.
  mail:
    drain-initial-delay-ms: 3600000
    retention-initial-delay-ms: 3600000
  verification:
    purge-initial-delay-ms: 3600000
    sweep-initial-delay-ms: 3600000
  upload:
    cleanup-initial-delay-ms: 3600000
    reconcile-initial-delay-ms: 3600000
  metrics:
    initial-delay-ms: 3600000
  session-revocation:
    drain-initial-delay-ms: 3600000
    retention-initial-delay-ms: 3600000
  post:
    purge-initial-delay-ms: 3600000
  recommend:
    # 이 스케줄러는 절대 시각(cron)이라 initial-delay로 미룰 수 없다 — 실행 시각과 겹치면 스위트 도중 외부 동행복권 사이트로 실제 요청을 보낸다.
    auto-fetch:
      enabled: false
