# GlobalH2CleanupExtension을 모든 테스트에 자동 적용한다(개선 보고서 TST-01/TST-04).
# META-INF/services/org.junit.jupiter.api.extension.Extension 참고.
junit.jupiter.extensions.autodetection.enabled=true

# 타임아웃 없는 join()/await()가 교착되면 CI 잡 타임아웃(20분)까지 멈춘다(OPS-B1). 60초는
# 가장 느린 정상 테스트(컨테이너 기동 포함)보다 넉넉히 크면서, 실제로 멈춘 테스트는 전체
# 빌드를 막기 전에 드러나게 한다.
junit.jupiter.execution.timeout.default=60s
